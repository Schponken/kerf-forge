[project]
name = "kerf"
version = "0.1.0"
description = "Kerf Forge: description-to-assembly parametric CAD for 3D-printed mechanisms"
requires-python = ">=3.12,<3.13"
dependencies = [
  "build123d==0.13.0",
  "bd_warehouse==0.4.0",
  "py_gearworks==0.0.24",
  "build123d-mcp==0.3.91",
  "trimesh>=4.4",
  "rtree>=1.2",
  "scipy>=1.11",
  "gmsh>=4.13",
  "scikit-fem>=10",
  "numpy>=1.26",
  "pyyaml>=6",
  "pytest>=8",
]
[project.scripts]
kerf = "kerf.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["kerf"]
[tool.pytest.ini_options]
testpaths = ["tests"]
