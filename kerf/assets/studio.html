<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerf Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="/ui/thoughtweb.js"></script>
<style>
:root, :root[data-theme="dark"]{
  --bg:#171b20; --bg2:#1e242b; --panel:#252c34; --panel2:#2d3540; --ink:#edf1f5; --muted:#b0bac6; --line:#46515e; --soft:#35404b;
  --accent:#9bc1e0; --accent2:var(--accent); --accent-ink:#142735; --control-line:#8495a6; --glow:transparent;
  --ok:#81c6a0; --ok-bg:#243e32; --bad:#ff9fa3; --bad-bg:#4b292e; --warn:#e7c477; --warn-bg:#443b25;
  --info:#9fc8ef; --info-bg:#263d52; --grid:transparent; --shadow:0 12px 32px rgba(0,0,0,.28);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#f5f6f7; --bg2:#eef0f2; --panel:#ffffff; --panel2:#f5f6f8; --ink:#202832; --muted:#5d6874; --line:#d4dae0; --soft:#e4e9ee;
  --accent:#305f86; --accent2:var(--accent); --accent-ink:#fff; --control-line:#7a8794; --glow:transparent;
  --ok:#216749; --ok-bg:#e5f1e9; --bad:#b52d35; --bad-bg:#fbe9eb; --warn:#805b0f; --warn-bg:#f8efd9; --info:#285f93; --info-bg:#e6eff7;
  --grid:transparent; --shadow:0 12px 32px rgba(24,35,48,.14);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;white-space:nowrap;border:1px solid var(--control-line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;transition:background .12s,border-color .12s}
button:hover{border-color:var(--muted)}
a.btn{display:inline-block;text-decoration:none;font:inherit;white-space:nowrap;border:1px solid var(--control-line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px}
a.btn:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ui-icon{width:17px;height:17px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button small{opacity:.75;font-weight:500;margin-left:4px}
.param .unit{color:var(--muted);font-size:12px;min-width:30px}
.menu.modes button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:300px}
.menu.modes .sub.cost{opacity:.75;font-size:11.5px}
button.upgrade{border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .card{max-width:440px;width:calc(100% - 32px)}
.intake{margin-top:12px}.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}
.igrid label,.intake>label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.qopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.qopt.rec{border-color:var(--accent)}
.scenario-fields{display:grid;gap:12px;margin:16px 0}.scenario-fields[hidden]{display:none}
.scenario-fields label,.request-kind{display:grid;gap:5px;color:var(--muted);font-size:12.5px}
.request-kind{margin-bottom:14px}.request-kind select{max-width:400px}
.qopt{min-width:0;overflow-wrap:anywhere}.qopt dl{margin:16px 0}.qopt dt{font-weight:650;margin-top:12px}
.qopt .chip.ok{color:var(--ink)}
.qopt dd{margin:3px 0 0;color:var(--muted)}.qopt h4{font-size:13px;margin:16px 0 6px}
.qopt ul{padding-left:18px;margin:6px 0 16px}.qopt li+li{margin-top:8px}.qopt .source-note{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.qopt details{margin:16px 0}.qopt summary{cursor:pointer}.qopt .route{margin:4px 0 0;color:var(--muted);font-size:13px}
@media(max-width:560px){.qopts{grid-template-columns:minmax(0,1fr)}}
#partsbtn{display:none}
.param .affects{margin-top:2px;opacity:.85}
button:active{background:var(--soft)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
button.primary:hover{filter:brightness(.95)}
button:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--control-line);border-radius:8px;padding:8px 10px;width:100%;transition:border-color .12s}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
textarea{min-height:120px;resize:vertical}
a{color:var(--info)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* ---------- object stage: navigation stays out of the workspace */
#side{height:72px;flex:none;display:flex;align-items:center;gap:24px;padding:0 24px;position:relative;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font-size:16px;font-weight:650;white-space:nowrap}
.shell-actions{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
#newbtn{display:flex;align-items:center;gap:6px;font-weight:600}
.shell-disclosure>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 10px;border-radius:8px;white-space:nowrap;font-size:13px}
.shell-disclosure>summary::-webkit-details-marker{display:none}
.shell-disclosure>summary:hover,.shell-disclosure[open]>summary{background:var(--soft)}
.shell-disclosure>summary svg{width:17px;height:17px}
.shell-disclosure[open]>summary{color:var(--accent)}
.shell-panel{position:fixed;top:80px;left:24px;width:380px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 100px);background:var(--panel);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;overflow:auto;animation:shellReveal .16s cubic-bezier(.2,.8,.2,1)}
.shell-disclosure:not([open])>.shell-panel{display:none}
.shell-panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.shell-panel-head h2{font-size:16px;margin:0}
.shell-close{border:0;background:none;padding:4px;display:grid;place-items:center;min-width:32px;min-height:32px}
#activitytray .shell-panel,#toolstray .shell-panel{left:auto;right:24px}
#toolstray .shell-panel{width:252px}
.shell-tools{display:grid;gap:4px}
.shell-tools button{display:flex;align-items:center;gap:12px;border:0;text-align:left;background:none;white-space:normal}
.shell-tools button:hover{background:var(--soft)}
.shell-tools .danger{color:var(--bad);border-top:1px solid var(--line);border-radius:0;margin-top:8px;padding-top:12px}
#search{flex:none;margin:0 0 12px;width:100%}
#plist{overflow:auto;min-height:0;scroll-padding-block:6px;padding:2px}
#activitycount{font-size:11px;min-width:17px;text-align:center;border-radius:5px;background:var(--soft);color:var(--ink);padding:1px 4px}
#activitycount:empty{display:none}
#activitybtn.has-options:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--info)}
@keyframes shellReveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.pitem{display:flex;width:100%;gap:10px;align-items:center;text-align:left;white-space:normal;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:none;transition:background .12s}
.pitem:hover{background:var(--soft)}
.pitem.sel{background:var(--soft);border-color:var(--control-line)}
.thumb{width:40px;height:40px;border-radius:6px;background:var(--soft) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted);font-size:18px;position:relative}
.pmeta{min-width:0}
.pmeta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:620}
.pmeta span{font-size:12px;color:var(--muted)}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
.sdot.ok{background:var(--ok)}.sdot.bad{background:var(--bad)}.sdot.run{background:var(--info)}
#buildall{padding:6px 14px}
#jobs{overflow:auto;min-height:0;scroll-padding-block:6px;padding:2px}
#jobs h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink)}
.job{display:flex;width:100%;gap:8px;align-items:center;text-align:left;padding:6px;border:0;background:none;border-radius:6px;cursor:pointer;font-size:13px}
.job:hover{background:var(--soft)}
.job .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.running{background:var(--info)}.dot.done{background:var(--ok)}.dot.failed,.dot.stopped{background:var(--bad)}

/* ---------- main */
#main{flex:1;min-width:0;min-height:0;overflow:auto;position:relative;background:var(--bg)}
.head{padding:24px 30px 0;animation:fadeUp .4s both;position:relative;z-index:5}
.head h1{margin:0 0 4px;font-size:24px;letter-spacing:-.2px}
.desc{color:var(--muted);max-width:920px;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:620;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 30px;position:relative}
.tab{border:none;background:none;border-radius:0;padding:11px 13px;color:var(--muted);font-weight:620}
.tab:hover{color:var(--ink)}
.tab.sel{color:var(--ink)}
.body{padding:22px 30px 120px;animation:fadeIn .3s both}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.viewer{width:100%;height:calc(100vh - 260px);min-height:440px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:650}
td.num{font-family:var(--mono);white-space:nowrap;font-size:13px}
.why{color:var(--muted);font-size:12px}
ul.msgs{margin:0;padding-left:18px}ul.msgs li{margin:4px 0}
.grid2{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:18px}
.param{padding:10px 0;border-bottom:1px solid var(--line)}
.param:last-of-type{border-bottom:none}
.param .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.param label{font-weight:620;font-size:13px;transition:color .2s}
.param.changed label{color:var(--accent)}
.param .rng{display:flex;gap:8px;align-items:center;margin-top:5px}
.param input[type=range]{flex:1;padding:0;accent-color:var(--accent);background:none;border:none;box-shadow:none}
.param input[type=number]{width:86px;padding:4px 7px;font-family:var(--mono);font-size:13px}
.param .key{font-size:11px;color:var(--muted);font-family:var(--mono)}
.note{font-size:12.5px;color:var(--muted)}
.banner{padding:11px 14px;border-radius:12px;margin-bottom:14px;font-size:13.5px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.info{background:var(--info-bg);color:var(--info)}
.issue{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.issue .ihead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.issue .ihead b{font-size:14.5px}
.issue .ipart{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
.issue p{margin:6px 0 0;font-size:13.5px}.issue .fixl{color:var(--muted)}
.issue details{margin-top:6px}.issue summary{cursor:pointer;color:var(--muted);font-size:12px}
.issue code{display:block;white-space:pre-wrap;font-size:12px;color:var(--muted);margin-top:4px}
.workst{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.renders{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.renders img{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in;transition:transform .2s;animation:fadeUp .4s both}
.renders img:hover{transform:scale(1.03)}
.doc{max-width:920px}
.doc img{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.doc table{font-size:13px}
.doc pre,.doc code{font-family:var(--mono);font-size:12.5px;background:var(--soft);border-radius:6px}
.doc pre{padding:10px;overflow:auto}.doc code{padding:1px 4px}
.docnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* margin bars + summary ring */
.mbar{height:7px;border-radius:7px;background:var(--soft);overflow:hidden;min-width:110px;margin-top:6px}
.mbar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,var(--ok),#8ef0b8);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.mbar.mid i{background:linear-gradient(90deg,var(--warn),#ffe08a)}.mbar.over i{background:linear-gradient(90deg,var(--bad),#ff9a9a)}
.mtext{font-size:11px;color:var(--muted);margin-top:3px}
.reqrow{animation:fadeUp .35s both}
.summary{display:flex;gap:26px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.stat{min-width:110px}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:var(--muted)}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--panel2) 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px}

/* ---------- mission control panel */
#mc{position:fixed;right:18px;bottom:18px;width:min(760px,calc(100vw - 36px));max-height:min(74vh,720px);display:none;flex-direction:column;z-index:6;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
#mc.open{display:flex;animation:popIn .35s cubic-bezier(.2,.9,.3,1.2) both}
#mc.min .mcbody{display:none}
#mctw{margin:8px 14px 2px;flex:none}#mctw[hidden]{display:none}#mc.min #mctw{margin-bottom:10px}
.fxa.up,.fxs.up{color:var(--ok)}.fxa.down,.fxs.down{color:var(--bad)}.fxs.meh{color:#e0a030}.fxs{font-weight:600}
.scene{display:flex;gap:14px;align-items:center;padding:12px 14px;margin:4px 0 10px;border-radius:12px;background:linear-gradient(135deg,rgba(255,140,40,.12),rgba(255,140,40,.03));border:1px solid rgba(255,140,40,.25)}
.scene .stage{position:relative;width:64px;height:52px;flex:none}.scene .who{position:absolute;left:2px;bottom:0;font-size:34px;animation:sbob 1.6s ease-in-out infinite}
.scene .tool{position:absolute;right:0;top:0;font-size:22px;animation:swork 1.1s ease-in-out infinite}
@keyframes sbob{50%{transform:translateY(-4px)}}@keyframes swork{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg) translateY(3px)}}
@media (prefers-reduced-motion:reduce){.scene .who,.scene .tool{animation:none}}
.cert{display:flex;gap:16px;margin-bottom:14px;border:1px solid rgba(60,200,120,.4);background:linear-gradient(135deg,rgba(60,200,120,.10),transparent)}.cert .seal{font-size:46px;line-height:1}
.tourlay{position:fixed;inset:0;z-index:90}.tourlay .spot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border:2px solid var(--accent,#f80);transition:all .25s;pointer-events:none}
.tourlay .bub{position:fixed;width:340px;background:var(--card,#1b1d22);color:inherit;border:1px solid rgba(255,140,40,.4);border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.job.sess .lab small{color:var(--muted)}.dot.claimed{background:#5aa9ff;box-shadow:0 0 0 3px rgba(90,169,255,.18)}
.wrecent ul{margin:6px 0 0;padding-left:18px}.wrecent li{margin:2px 0}
.misstag{font-size:11px;margin-top:4px;white-space:nowrap}.misstag.nearmiss{color:#e0a030}.misstag.close{color:#e07a30}.misstag.faroff{color:var(--bad)}
.fixalt{margin:-4px 0 6px;padding-left:20px}.fixalt li{margin:3px 0;color:var(--muted)}
.toast.go{cursor:pointer}.toast.go:hover{filter:brightness(1.12)}.toastgo{display:block;margin-top:4px;font-size:11.5px;font-weight:600;color:var(--accent)}
.qready{margin-bottom:14px}.qrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;margin-top:8px;padding:9px 12px}
#qbadge{margin:0 0 12px;white-space:normal;flex:none;padding:8px 10px;border-radius:8px;text-align:left;font-weight:600;background:var(--info-bg);color:var(--info);border:1px solid var(--info)}
.dot.paused{background:#e0a030}.banner.paused{margin-bottom:10px}
abbr.gl{text-decoration:none;border-bottom:1px dotted var(--accent,#f80);cursor:help}.glmodal .card{max-width:none}.glrow{padding:8px 2px;border-bottom:1px solid rgba(128,128,128,.18)}
.twmodal .card{max-width:none;width:min(860px,94vw);height:min(820px,90vh);display:flex;flex-direction:column}.twmodal .twhost{flex:1;min-height:0;margin-top:8px}
#mc .scan{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px}
#mc.running .scan{opacity:1}
#mc.running .scan::after{content:"";position:absolute;left:0;right:0;height:90px;background:linear-gradient(transparent,var(--glow),transparent);opacity:.3;animation:scan 2.8s ease-in-out infinite}
.mch{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
.mch .t{flex:1;min-width:0}
.mch .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mch .t span{font-size:12px;color:var(--muted)}
.tring{width:38px;height:38px;flex:none;position:relative}
.tring svg{animation:spin 1.4s linear infinite}
.tring.done svg,.tring.failed svg,.tring.stopped svg{animation:none}
.tring circle{fill:none;stroke-width:3.5}
.tring .bg{stroke:var(--soft)}.tring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:30 100;transition:stroke-dasharray .4s}
.tring.done .fg{stroke:var(--ok);stroke-dasharray:100 0}.tring.failed .fg,.tring.stopped .fg{stroke:var(--bad);stroke-dasharray:100 0}
.tring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:700}
.tring.done i{color:var(--ok)}.tring.failed i,.tring.stopped i{color:var(--bad)}
.mcbody{overflow:auto;padding:14px 16px 16px;position:relative}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 8px;font-weight:650}
.sect:first-child{margin-top:2px}
.stepper{display:flex;align-items:flex-start;position:relative;padding:6px 2px 2px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.step::before{content:"";position:absolute;top:13px;left:calc(-50% + 16px);right:calc(50% + 16px);height:2px;background:var(--line);transition:background .4s}
.step:first-child::before{display:none}
.step.done::before,.step.active::before{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 8px var(--glow)}
.node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);position:relative;z-index:1;transition:all .3s}

const S = {projects: [], claude: false, platform: "", sel: null, detail: null, tab: "model", edits: {}, medits: {}, job: null, since: 0, esince: 0, settings: {notify: true, sound: true},
           ev: [], lines: [], doc: null, newOpen: false, seenDone: new Set(), shown: new Set(), listed: false, fails: 0, closed: false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({error: "bad response"}));
  if (!r.ok || j.error) { const e = new Error(j.error || r.statusText); e.data = j; throw e; }
  return j;
};
/* a change to a project another Claude session is editing: ask, then send it again with override */
async function apiChange(path, body) {
  try { return await api(path, body); }
  catch (e) {
    if (!(e.data && e.data.claimed) || !confirm(e.message)) throw e;
    return await api(path, {...body, override: true});
  }
}
const slugName = v => String(v || "").trim().toLowerCase().replace(/[\s-]+/g, "_").replace(/[^a-z0-9_]/g, "").replace(/_+/g, "_").replace(/^_+|_+$/g, "");
function uniqueName(n) { const have = new Set((S.projects || []).map(p => p.name)); let x = n, i = 2; while (x && have.has(x)) x = `${n.slice(0, 37)}_${i++}`; return x; }
function openRunning(project) {   // a second click on a running job: show the one already running
  const j = (S.jobsList || []).find(x => x.state === "running" && (x.project === project || x.project === "*"));
  if (j) { watch(j.id); return true; }
  return false;
}
const fileUrl = (p, rel) => `/files/${p}/${rel.split("/").map(encodeURIComponent).join("/")}`;
const fmt = v => v == null ? "–" : (typeof v === "number" ? (Math.abs(v) >= 100 ? v.toFixed(0) : +v.toFixed(3)) : esc(Array.isArray(v) ? v.join(", ") : v));
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const about = s => s == null ? "" : s < 90 ? `~${Math.max(10, Math.round(s / 10) * 10)} s` : `~${Math.round(s / 60)} min`;

function closeShell(restore = true) {
  document.querySelectorAll(".shell-disclosure[open]").forEach(d => { d.open = false; if (restore) d.querySelector("summary").focus(); });
}
document.querySelectorAll(".shell-disclosure").forEach(d => {
  d.addEventListener("toggle", () => {
    if (!d.open) return;

function setTheme(t) { document.documentElement.dataset.theme = t; $("#themebtn").title = t === "dark" ? "Switch to light theme" : "Switch to dark theme"; $("#themebtn").setAttribute("aria-label", $("#themebtn").title); try { localStorage.setItem("kerf-theme", t); } catch (e) {} document.querySelectorAll("iframe.viewer").forEach(syncTheme); }

/* ---------- margins: how much of its limit a requirement uses (direction inferred from pass/fail) */
function margin(r) {
  const v = r.value, l = r.limit;
  if (r.skipped || typeof v !== "number" || typeof l !== "number" || l === 0 || v === 0) return null;
  if (!r.ok) return {pct: 100, cls: "over", label: r.bound === "min" ? "below the minimum" : "over the limit"};
  const isMin = r.bound ? r.bound === "min" : v > l;          // the check says which way its limit points
  const used = isMin ? l / v : v / l;
  return {pct: Math.min(100, Math.max(3, used * 100)), cls: used > 0.8 ? "mid" : "",
          label: isMin ? `${(v / l).toFixed(1)}× the minimum` : `uses ${Math.round(used * 100)} % of the limit`};
}
function mbar(r, key) {
  const m = margin(r); if (!m) return "";
  const grown = key && S.shown.has("bar:" + key);
  if (key) S.shown.add("bar:" + key);
  return `<div class="mbar ${m.cls}"><i ${grown ? `style="width:${m.pct}%;transition:none"` : `data-w="${m.pct}"`}></i></div><div class="mtext">${m.label}</div>`;
}
function growBars(root) { requestAnimationFrame(() => requestAnimationFrame(() => (root || document).querySelectorAll(".mbar i[data-w]").forEach(i => { i.style.width = i.dataset.w + "%"; i.removeAttribute("data-w"); }))); }

/* ---------- plain-English layer (kerf/glossary.py): jargon gets a dotted underline; hover or tap shows the meaning */
const GL = {checks: {}, terms: {}, rx: null};
fetch("/api/glossary").then(r => r.json()).then(g => {
  GL.checks = g.checks; GL.terms = {};
  for (const [k, v] of Object.entries(g.terms)) GL.terms[k.toLowerCase()] = [k, v];
  const keys = Object.keys(g.terms).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  GL.rx = new RegExp(`(^|[^\\w-])(${keys.join("|")})(?![\\w-])`, "i");
  if (S.detail) renderTab();
}).catch(() => {});
function glossCheck(c) { return GL.checks[c] || {name: c || "", means: ""}; }
function glossify(root) {   // wraps the first use of each glossary word in this element (never inside inputs, code or links)
  if (!GL.rx || !root) return;
  const seen = new Set(), walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n =>
    n.parentElement.closest("code,pre,a,button,input,select,textarea,label,abbr,script,style,svg,iframe,th,h1,.key,.num,.ipart,[title]") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
  for (const n of nodes) {
    let node = n, m;
    while (node && (m = GL.rx.exec(node.nodeValue))) {
      const word = m[2], key = word.toLowerCase(), at = m.index + m[1].length;
      if (seen.has(key)) { const rest = node.splitText(at + word.length); node = rest; continue; }
      seen.add(key);
      const mid = node.splitText(at), rest = mid.splitText(word.length);
      const ab = document.createElement("abbr"); ab.className = "gl"; ab.textContent = word; ab.title = GL.terms[key][1]; ab.tabIndex = 0;
      ab.onclick = e => { e.stopPropagation(); toast(GL.terms[key][0], GL.terms[key][1], "info"); };
      mid.replaceWith(ab); node = rest;
    }
  }
}
function showGlossary() {   // every word and every check, searchable
  const el = document.createElement("div"); el.className = "modal glmodal";
  const rows = [...Object.values(GL.terms).map(([k, v]) => [k, v, "word"]), ...Object.entries(GL.checks).map(([k, c]) => [c.name, c.means, "check · " + k])]
    .sort((a, b) => a[0].localeCompare(b[0]));
  el.innerHTML = `<div class="card" style="width:min(720px,94vw);max-height:84vh;display:flex;flex-direction:column"><div class="row" style="justify-content:space-between"><h3 style="margin:0">📖 Words Kerf uses, in plain English</h3><button>Close</button></div>
    <input type="search" placeholder="Search, e.g. FEA, infill, servo" style="margin:10px 0">
    <div class="gllist" style="overflow:auto">${rows.map(([k, v, t]) => `<div class="glrow"><b>${esc(k)}</b> <span class="note">${esc(t)}</span><div>${esc(v)}</div></div>`).join("")}</div></div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.querySelector("button").onclick = close; el.onclick = e => { if (e.target === el) close(); };
  const q = el.querySelector("input"); q.focus();
  q.oninput = () => el.querySelectorAll(".glrow").forEach(r => r.style.display = r.textContent.toLowerCase().includes(q.value.toLowerCase()) ? "" : "none");
}

function plainChecks(ids) {   // requirement ids -> their plain check names (kerf/glossary.py), each once

}

/* plain-language narration of one job step (the raw tool name + argument stays in the row's tooltip) */
function narrate(t) {
  const w = String(t.what || ""), path = String(t.path || ""), cmd = String(t.cmd || w), q = String(t.query || "");
  const file = path.split("/").pop() || "", part = (path.match(/\/parts\/([^/]+)\.py$/) || [])[1];
  const site = (() => { try { return new URL(t.url || w).hostname.replace(/^www\./, ""); } catch (e) { return ""; } })();
  const nice = s => s.replace(/_/g, " ");
  switch (t.name) {
    case "WebSearch": return ["🔎", q ? `Looking up “${q}”` : "Searching the web"];
    case "WebFetch": return ["🌐", site ? `Reading a page on ${site}` : "Reading a web page"];
    case "Agent": case "Task": {
      const d = nice(w);
      const who = String(t.agent || "") + " " + w;
      if (/research/i.test(who)) return ["🧑‍🔬", `A research helper is looking into: ${d}`];
      if (/review/i.test(who)) return ["🕵️", "An independent reviewer is inspecting the design"];
      if (/part-designer/i.test(who)) return ["🧑‍🔧", `A part designer is working on: ${d}`];
      return ["🧑‍🔧", `A helper is working on: ${d}`]; }
    case "Read": case "Grep": case "Glob": {
      const pj = (path.match(/projects\/([^/]+)\//) || [])[1];
      if (/catalog\//.test(path)) return ["📚", "Checking real part sizes in the parts catalog"];
      if (/docs\/ENGINEERING/.test(path)) return ["📏", "Checking the engineering rule book"];
      if (part) return ["📐", `Studying the ${nice(part)} part`];
      if (pj) return ["🗂", `Looking at the ${nice(pj)} project`];
      return ["📖", file ? `Reading ${file}` : "Looking through the files"]; }
    case "Write": case "Edit": case "MultiEdit":
      if (part) return ["✏️", part === "layout" ? "Setting the shared measurements every part uses" : `Drawing the ${nice(part)}`];
      if (file === "DESIGN.md") return ["🗺", "Writing the plan: what to build and why"];
      if (file === "REFERENCES.md") return ["📝", "Writing down what it learned from the research"];
      if (file === "project.yaml") return ["🧩", "Listing the parts and how they connect and move"];
      if (file === "STATUS.md") return ["📒", "Updating the project diary"];
      return ["✏️", `Editing ${file || "a file"}`];
    case "Bash":
      if (/kerf build/.test(cmd)) return ["🏭", "Making the print files, shopping list and pictures"];
      if (/kerf check/.test(cmd)) return ["🧪", "Testing that everything fits, moves and holds"];
      if (/kerf find/.test(cmd)) return ["🔭", "Searching existing designs for ideas"];
      if (/git (commit|push)/.test(cmd)) return ["💾", "Saving the work"];
      if (/pytest/.test(cmd)) return ["✅", "Running Kerf's own self-tests"];
      return ["⚙️", "Running a tool"];
    case "TodoWrite": case "TaskCreate": case "TaskUpdate": return ["☑", "Updating its to-do list"];
    default: return [TOOL_ICON[t.name] || "•", w ? `${t.name}: ${w}` : String(t.name)];
  }
}

function lastProjectEvents(ev) { let i = -1; ev.forEach((e, n) => { if (e.k === "start") i = n; }); return i < 0 ? ev : ev.slice(i); }
function stageState(ev) {
  let start = null, cur = null, fin = null; const done = new Set();
  for (const e of ev) {
    if (e.k === "start") { start = e; cur = null; done.clear(); fin = null; }
    else if (e.k === "stage") { if (cur) done.add(cur); cur = e.stage; }
    else if (e.k === "done") { if (cur) done.add(cur); fin = e; cur = null; }
  }
  return {start, cur, done, fin};
}

    return `<div class="step ${it.state}${f}"><div class="node">${it.state === "done" ? "✓" : it.icon}</div><label>${esc(it.label)}</label></div>`; }).join("")}</div>`;

/* Build check summary: recorded results, including whether an independent review is still to come. */
function certificate(d) {
  const R = ((d.report || {}).requirements || []).filter(r => !r.skipped), n = d.summary_numbers || {}, m = (d.report || {}).mass || {};
  const plates = (d.files || []).filter(x => x.startsWith("out/plates/") && x.endsWith(".3mf")).length;
  if (d.stale) return `<div class="banner warn">This build check summary is out of date: the design changed after the last build. Build again for current results.</div>`;
  const when = d.built_at ? new Date(d.built_at * 1000).toLocaleDateString() : "";
  const rows = [["Engineering checks passed", `${R.filter(r => r.ok).length} of ${R.length}`],
    ["Printed parts", n.print_parts != null ? String(n.print_parts) : "–"], ["Print plates", plates ? String(plates) : "–"],
    ["Filament", n.filament_g != null ? fmt(n.filament_g) + " g" : "–"], ["Finished weight", m.device_g != null ? fmt(m.device_g) + " g" : "–"],
    ["Independent review", d.review && d.review.ok ? "passed ✓" : "not done yet"]];
  return `<div class="cert card" id="cert"><div style="flex:1"><div class="note">Kerf · ${esc(when)}</div><h3 style="margin:2px 0 6px">Build check summary: ${esc(d.title)}</h3>
    <p class="note" style="margin:0 0 8px">Recorded results for this build. Read its warnings, design review status and assembly instructions before making it.</p>
    <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td class="num"><b>${v}</b></td></tr>`).join("")}</table>
    <button style="margin-top:8px" onclick="printCert()">🖨 Print / save as PDF</button></div></div>`;
}
function printCert() {
  const w = window.open("", "_blank"); if (!w) return;
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Build check summary</title><style>body{font:15px system-ui;margin:40px;color:#111}table{border-collapse:collapse}td{padding:4px 18px 4px 0;border-bottom:1px solid #ddd}button{display:none}.note{color:#555}

/* "Explain this page" + first-run tour: a spotlight walks through what is on screen, in plain words */

          ["#plist", "Your projects. The dot shows whether each one passes all its checks."],
          ["#nav_work", "See what Kerf is working on right now."], ["#jobs", "Running and recent jobs. Click one to watch it work."],
          ["#helpbtn", "Lost? Press ? on any page for a walk-through like this one."]],
  head: [[".head h1", "The project you are looking at."], ["#project-build", "Build kit: checks everything, then makes the print files, shopping list and assembly guide."],
         ["#tabs", "Each tab shows one side of the design."]],
  model: [["#mainviewer", "The 3D model. Drag to spin it, scroll to zoom. Use the buttons on it to cut it open or colour the stress."]],
  tune: [[".param", "Move a slider to change a measurement. Under it: which parts and checks it changes."],
         [".grid2 .primary", "Try these values: Kerf rebuilds a copy and re-checks it, and your design stays untouched until you Save."]],
  results: [[".summary", "The score: how many engineering checks pass and how many are close to their limit."], [".issue", "Something to fix, explained: what is wrong, why it matters, what usually fixes it."],
            [".cert", "This build’s recorded checks and review status. Read these before making the design."], ["table", "Each row is a number the design must meet. The bar shows how much room is left. Hover a name for what it means."]],
  files: [[".handoff-guides", "Read the assembly guide, shopping list and print settings before making the design."], [".handoff-downloads", "Choose saved files here. Review the build status and sliced preview before printing."]],
  history: [[".hist", "Each build is saved with its numbers and picture, so you can compare and go back."]],
};
function explainPage() {
  const steps = S.detail && document.querySelector(".head h1") ? [...TOUR.head, ...(TOUR[S.tab] || [])] : TOUR.start;
  tour(steps.filter(([q]) => { const e = document.querySelector(q); return e && e.getClientRects().length; }));
}
function tour(steps, i = 0) {
  document.querySelectorAll(".tourlay").forEach(x => x.remove());
  if (i >= steps.length) return;
  const [q, text] = steps[i], el = document.querySelector(q); el.scrollIntoView({block: "nearest"});
  const r = el.getBoundingClientRect(), lay = document.createElement("div"); lay.className = "tourlay";
  const below = r.bottom + 170 < innerHeight, left = Math.min(Math.max(12, r.left), innerWidth - 352);
  lay.innerHTML = `<div class="spot" style="left:${r.left - 6}px;top:${r.top - 6}px;width:${r.width + 12}px;height:${Math.min(r.height, innerHeight - 40) + 12}px"></div>
    <div class="bub" style="left:${left}px;${below ? `top:${r.bottom + 14}px` : `top:${Math.max(12, r.top - 150)}px`}"><div>${esc(text)}</div>
    <div class="row" style="justify-content:space-between;margin-top:10px"><span class="note">${i + 1} of ${steps.length}</span>
    <span><button data-a="x">Skip</button> <button class="primary" data-a="n">${i + 1 < steps.length ? "Next" : "Got it"}</button></span></div></div>`;
  document.body.appendChild(lay);
  lay.querySelector("[data-a=n]").onclick = () => tour(steps, i + 1);
  lay.querySelector("[data-a=x]").onclick = () => lay.remove();
}
function firstRun() {   // the start tour once per browser (best effort: storage can be unavailable)
  if (navigator.webdriver) return;   // automated test browsers: no surprise overlay
  try { if (localStorage.getItem("kerf.toured")) return; localStorage.setItem("kerf.toured", "1"); } catch (e) { return; }
  setTimeout(() => { if (!document.querySelector(".modal,.tourlay")) tour(TOUR.start.filter(([q]) => document.querySelector(q))); }, 1200);
}
window.addEventListener("load", firstRun);

async function finished(j) {
  if (S.seenDone.has(j.id)) return; S.seenDone.add(j.id);
  const st = stageState(lastProjectEvents(S.ev));
  const ok = j.state === "done" && (!st.fin || st.fin.ok);
  const target = jobTarget(j, ok), line = jobLine(j, ok, st);
  if (j.state !== "stopped" && (j.seconds >= 8 || !document.hasFocus())) desktopNotify(j.label, line, target);
  if (ok) { toast(j.label, line, "ok", target); burst(); }
  else { toast(j.label, line, j.state === "paused" ? "warn" : "bad", target);
    if (j.kind !== "fix" && S.settings.autofix && j.state !== "paused") setTimeout(followFix, 1500);
    const mc = $("#mc"); mc.classList.add("shake"); setTimeout(() => mc.classList.remove("shake"), 500); }
  if (j.state !== "stopped" && (j.seconds >= 8 || !document.hasFocus())) { chime(ok); flashTitle(ok ? `✓ ${j.label}` : `✕ ${j.label}`); }
  // done: fold the panel down to its title bar after a moment, so it stops covering the page (click to reopen)
  const fold = (k = 0) => { const mc = $("#mc"); if (S.job !== j.id || !mc.classList.contains("open")) return;
    if (mc.matches(":hover") && k < 20) return setTimeout(() => fold(k + 1), 1500); mc.classList.add("min"); };
  setTimeout(fold, 3500);
  if (j.kind === "trial") S.tab = "tune";
  if (j.kind === "quote" && ok) {
    const busy = S.newOpen && $("#ndesc") && $("#ndesc").value.trim() && slugName($("#nname").value) !== j.project;
    if (busy) listQuotes(); else await openQuote(j.project);   // typing another request: it waits in "Options ready"
    return;
  }
  await loadProjects();
  if (j.project === S.sel || j.project === "*") await refreshDetail();
  else if (j.kind === "design" && S.projects.some(p => p.name === j.project)) select(j.project);
}

function toast(title, msg, cls, target) {   // target (see kerfOpen): a click goes to the view it is about
  const t = document.createElement("div"); t.className = "toast " + (cls || "") + (target ? " go" : "");
  t.innerHTML = `<b>${esc(title)}</b><span class="note" style="white-space:pre-wrap">${esc(msg)}</span>${target ? `<span class="toastgo">Open ›</span>` : ""}`;
  if (target) { t.title = "Open it"; t.onclick = () => { kerfOpen(target); t.remove(); }; }
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .4s, transform .4s"; t.style.opacity = 0; t.style.transform = "translateX(30px)"; setTimeout(() => t.remove(), 450); }, 5200);
}

function jobTarget(j, ok) {
  if (j.state === "paused") return `job:${j.id}`;            // paused for usage: its panel has Resume now
  if (j.kind === "quote") return `quote:${j.project}`;

  if (ok) return j.kind === "design" ? "Claude Code finished the design." : j.kind === "edit" ? "Claude Code made the change." : j.kind === "fix" ? "Claude Code fixed it: every check passes." : "Every check passes.";

function burst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#burst"), x = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = $("#mc").getBoundingClientRect(), ox = r.width ? r.left + 34 : innerWidth - 120, oy = r.width ? r.top + 32 : 60;
  const cols = ["#ff6a2b", "#ffb347", "#3ddc84", "#6cb4ff", "#ffffff"];
  const P = Array.from({length: 110}, () => { const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 8;
    return {x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, r: 2 + Math.random() * 3.5, c: cols[(Math.random() * cols.length) | 0], life: 1, spin: Math.random() * 6, sq: Math.random() < .5}; });
  let f = 0;
  (function step() {
    x.clearRect(0, 0, innerWidth, innerHeight); f++;
    for (const p of P) { p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.vx *= 0.985; p.life -= 0.011; p.spin += 0.2;
      x.globalAlpha = Math.max(0, p.life); x.fillStyle = p.c; x.save(); x.translate(p.x, p.y); x.rotate(p.spin);
      if (p.sq) x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); else { x.beginPath(); x.arc(0, 0, p.r, 0, 7); x.fill(); } x.restore(); }
    if (f < 120) requestAnimationFrame(step); else x.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

const WORK_STATES = {running:"Working",working:"Working",claimed:"Claimed",waiting:"Waiting for input",paused:"Paused",continued:"Continued in another job",blocked:"Blocked",failed:"Failed",done:"Finished",stopped:"Stopped",stale:"Update overdue",idle:"Not running"};

  const gitOK = !w.fetch_error && healthy("Shared claims"), codexOK = healthy("Codex"), jobsOK = healthy("Studio jobs");
  const next = new Map(), updates = [];

    const source = item.source || (item.job_id ? "job" : item.chat_id ? "session" : "claim");
    const linked = item.chat_id || prior?.chat_id, owned = workClaims(item).length || (prior && workClaims(prior).length);
    const baseOK = source==="job" ? jobsOK : source==="claim" ? gitOK : item.provider==="Codex" ? codexOK : healthy(item.provider);
    const contextOK = baseOK && (!linked || codexOK);
    const localStatus = source==="job" && ["done","failed","stopped","continued","paused"].includes(item.state);
    const runtimeOK = source==="job" ? baseOK && (!linked || codexOK || localStatus) :
      baseOK && (!["claimed","stale"].includes(item.state) || !owned || gitOK);

      else if (current.runtime && previous.runtime && (prior.state!==item.state || prior.status_label!==item.status_label))
        detail = `${prior.status_label || WORK_STATES[prior.state] || "Previous status unavailable"} → ${item.status_label || WORK_STATES[item.state] || "Status unavailable"}`;
      else if (current.detail && previous.detail && prior.activity!==item.activity) detail = item.activity || "Activity detail is no longer reported.";
      else if (current.detail && previous.detail && prior.action!==item.action) detail = item.action ? `Current action: ${item.action}` : "Current action is no longer reported.";

let actx = null;
addEventListener("pointerdown", () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }, {passive: true});
function chime(good) {   // three rising notes when it worked, two falling when it didn't
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const t0 = actx.currentTime + 0.02;
    (good ? [523.25, 659.25, 783.99] : [392.0, 311.13]).forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      const s = t0 + i * 0.13; g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.16, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
      o.start(s); o.stop(s + 0.55); });
  } catch (e) {}
}

  S.closed = true;
  document.body.innerHTML = `<div style="margin:auto;text-align:center;animation:fadeUp .4s both">
    <div class="logo" style="width:64px;height:64px;margin:0 auto 18px;border-radius:18px"><svg width="32" height="32" viewBox="0 0 30 30"><path d="M8 24V6m0 9 11-9m-7 6 9 12" stroke="#160a03" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2 style="margin:0 0 6px">${quit ? "Kerf Studio is closed" : "Connection to Kerf Studio lost"}</h2>
    <p class="note">${quit ? "You can close this window." : "The app may still be running. Reconnect to check your projects and jobs."}</p>
    ${quit ? "" : '<button class="primary" onclick="location.reload()">Reconnect</button>'}
    <p class="note">To start it again, open Kerf Studio on your Dock or run<br><code>.venv/bin/kerf studio --no-open</code> in the Kerf Forge folder.</p></div>`;
  if (quit) setTimeout(() => window.close(), 400);
}

addEventListener("resize", updateProjectBrief);
loadProjects(); pollJobs(); loadSettings();
setInterval(loadProjects, 5000); setInterval(pollJobs, 3000); setInterval(pollQuotes, 15000); setTimeout(pollQuotes, 1500);
</script>
