<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerf Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root, :root[data-theme="dark"]{
  --bg:#0c0d10; --bg2:#101216; --panel:#15171c; --panel2:#1a1d23; --ink:#ecebe7; --muted:#8d929b; --line:#262a31; --soft:#1e2127;
  --accent:#ff6a2b; --accent2:#ffb347; --accent-ink:#160a03; --glow:rgba(255,106,43,.35);
  --ok:#3ddc84; --ok-bg:rgba(61,220,132,.12); --bad:#ff5d5d; --bad-bg:rgba(255,93,93,.13); --warn:#ffc14d; --warn-bg:rgba(255,193,77,.12);
  --info:#6cb4ff; --info-bg:rgba(108,180,255,.13); --grid:rgba(255,255,255,.035); --shadow:0 20px 60px rgba(0,0,0,.55);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#f4f3ef; --bg2:#eceae4; --panel:#ffffff; --panel2:#faf9f6; --ink:#1d1f22; --muted:#666b72; --line:#e2dfd8; --soft:#efede8;
  --accent:#e2530f; --accent2:#f08c2b; --accent-ink:#fff; --glow:rgba(226,83,15,.22);
  --ok:#1b8a4b; --ok-bg:#e3f4ea; --bad:#c92a2a; --bad-bg:#fbe9e9; --warn:#a1620a; --warn-bg:#fdf2de; --info:#1c5fa8; --info-bg:#e6effa;
  --grid:rgba(0,0,0,.035); --shadow:0 18px 50px rgba(0,0,0,.14);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;display:flex;overflow:hidden}
button{font:inherit;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:7px 13px;transition:border-color .15s,transform .1s,background .15s,box-shadow .2s}
button:hover{border-color:var(--muted)}
a.btn{display:inline-block;text-decoration:none;font:inherit;white-space:nowrap;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:7px 13px}
a.btn:hover{border-color:var(--muted)}
button small{opacity:.75;font-weight:500;margin-left:4px}
.param .unit{color:var(--muted);font-size:12px;min-width:30px}
.intake{margin-top:12px}.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}
.igrid label,.intake>label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.qopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.qopt.rec{border-color:var(--accent)}
#partsbtn{margin:0 14px 10px;width:calc(100% - 28px)}
.param .affects{margin-top:2px;opacity:.85}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink);font-weight:650}
button.primary:hover{box-shadow:0 0 22px var(--glow)}
button:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
textarea{min-height:120px;resize:vertical}
a{color:var(--info)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* ---------- sidebar */
#side{width:292px;flex:none;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;height:100%;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:11px;padding:18px 16px 12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 0 24px var(--glow);position:relative;overflow:hidden;flex:none}
.logo::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.55) 80%,transparent 90%);animation:spin 4s linear infinite}
.logo svg{position:relative;z-index:1}
.brand b{font-size:16px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.themebtn{margin-left:auto;padding:5px 8px;border-radius:8px;font-size:13px}
#newbtn{margin:4px 14px 10px;width:calc(100% - 28px);padding:10px}
#search{margin:0 14px 8px;width:calc(100% - 28px)}
#plist{overflow:auto;flex:1;padding:0 8px}
.pitem{display:flex;gap:11px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
.pitem:hover{background:var(--soft)}
.pitem.sel{background:var(--panel);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--soft) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted);font-size:18px;position:relative}
.thumb.running::before{content:"";position:absolute;inset:-3px;border-radius:12px;padding:2px;background:conic-gradient(var(--accent),var(--accent2),transparent 60%,var(--accent));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 1.4s linear infinite}
.pmeta{min-width:0}
.pmeta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:620}
.pmeta span{font-size:12px;color:var(--muted)}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
.sdot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.sdot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}.sdot.run{background:var(--info);animation:pulse 1s infinite}
#buildall{padding:6px 14px}
#jobs{border-top:1px solid var(--line);padding:10px 12px;max-height:32%;overflow:auto}
#jobs h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.job{display:flex;gap:8px;align-items:center;padding:6px;border-radius:8px;cursor:pointer;font-size:13px}
.job:hover{background:var(--soft)}
.job .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.running{background:var(--info);box-shadow:0 0 10px var(--info);animation:pulse 1s infinite}.dot.done{background:var(--ok)}.dot.failed,.dot.stopped{background:var(--bad)}

/* ---------- main */
#main{flex:1;min-width:0;height:100%;overflow:auto;position:relative;
  background:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 60%),
             linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,var(--bg)}
.head{padding:24px 30px 0;animation:fadeUp .4s both}
.head h1{margin:0 0 4px;font-size:24px;letter-spacing:-.2px}
.desc{color:var(--muted);max-width:920px;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:620;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 30px;position:relative}
.tab{border:none;background:none;border-radius:0;padding:11px 13px;color:var(--muted);font-weight:620}
.tab:hover{color:var(--ink)}
.tab.sel{color:var(--ink)}
.uline{position:absolute;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--glow);transition:left .3s cubic-bezier(.2,.8,.2,1),width .3s cubic-bezier(.2,.8,.2,1)}
.body{padding:22px 30px 120px;animation:fadeIn .3s both}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.viewer{width:100%;height:calc(100vh - 260px);min-height:440px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:650}
td.num{font-family:var(--mono);white-space:nowrap;font-size:13px}
.why{color:var(--muted);font-size:12px}
ul.msgs{margin:0;padding-left:18px}ul.msgs li{margin:4px 0}
.grid2{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:18px}
.param{padding:10px 0;border-bottom:1px solid var(--line)}
.param:last-of-type{border-bottom:none}
.param .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.param label{font-weight:620;font-size:13px;transition:color .2s}
.param.changed label{color:var(--accent)}
.param .rng{display:flex;gap:8px;align-items:center;margin-top:5px}
.param input[type=range]{flex:1;padding:0;accent-color:var(--accent);background:none;border:none;box-shadow:none}
.param input[type=number]{width:86px;padding:4px 7px;font-family:var(--mono);font-size:13px}
.param .key{font-size:11px;color:var(--muted);font-family:var(--mono)}
.note{font-size:12.5px;color:var(--muted)}
.banner{padding:11px 14px;border-radius:12px;margin-bottom:14px;font-size:13.5px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.info{background:var(--info-bg);color:var(--info)}
.files h3{font-size:11px;margin:20px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.files a.f{display:inline-flex;gap:6px;align-items:center;margin:0 8px 8px 0;padding:7px 11px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--ink);background:var(--panel);font-size:13px;transition:border-color .15s,transform .15s}
.files a.f:hover{border-color:var(--accent);transform:translateY(-1px)}
.renders{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.renders img{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in;transition:transform .2s;animation:fadeUp .4s both}
.renders img:hover{transform:scale(1.03)}
.doc{max-width:920px}
.doc img{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.doc table{font-size:13px}
.doc pre,.doc code{font-family:var(--mono);font-size:12.5px;background:var(--soft);border-radius:6px}
.doc pre{padding:10px;overflow:auto}.doc code{padding:1px 4px}
.docnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* margin bars + summary ring */
.mbar{height:7px;border-radius:7px;background:var(--soft);overflow:hidden;min-width:110px;margin-top:6px}
.mbar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,var(--ok),#8ef0b8);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.mbar.mid i{background:linear-gradient(90deg,var(--warn),#ffe08a)}.mbar.over i{background:linear-gradient(90deg,var(--bad),#ff9a9a)}
.mtext{font-size:11px;color:var(--muted);margin-top:3px}
.reqrow{animation:fadeUp .35s both}
.summary{display:flex;gap:26px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.stat{min-width:110px}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:var(--muted)}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--panel2) 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px}

/* ---------- mission control panel */
#mc{position:fixed;right:18px;bottom:18px;width:min(760px,calc(100vw - 330px));max-height:min(74vh,720px);display:none;flex-direction:column;z-index:6;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
#mc.open{display:flex;animation:popIn .35s cubic-bezier(.2,.9,.3,1.2) both}
#mc.min .mcbody{display:none}
#mc .scan{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px}
#mc.running .scan{opacity:1}
#mc.running .scan::after{content:"";position:absolute;left:0;right:0;height:90px;background:linear-gradient(transparent,var(--glow),transparent);opacity:.3;animation:scan 2.8s ease-in-out infinite}
.mch{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
.mch .t{flex:1;min-width:0}
.mch .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mch .t span{font-size:12px;color:var(--muted)}
.tring{width:38px;height:38px;flex:none;position:relative}
.tring svg{animation:spin 1.4s linear infinite}
.tring.done svg,.tring.failed svg,.tring.stopped svg{animation:none}
.tring circle{fill:none;stroke-width:3.5}
.tring .bg{stroke:var(--soft)}.tring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:30 100;transition:stroke-dasharray .4s}
.tring.done .fg{stroke:var(--ok);stroke-dasharray:100 0}.tring.failed .fg,.tring.stopped .fg{stroke:var(--bad);stroke-dasharray:100 0}
.tring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:700}
.tring.done i{color:var(--ok)}.tring.failed i,.tring.stopped i{color:var(--bad)}
.mcbody{overflow:auto;padding:14px 16px 16px;position:relative}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 8px;font-weight:650}
.sect:first-child{margin-top:2px}
.stepper{display:flex;align-items:flex-start;position:relative;padding:6px 2px 2px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.step::before{content:"";position:absolute;top:13px;left:calc(-50% + 16px);right:calc(50% + 16px);height:2px;background:var(--line);transition:background .4s}
.step:first-child::before{display:none}
.step.done::before,.step.active::before{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 8px var(--glow)}
.node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);position:relative;z-index:1;transition:all .3s}
.step.active .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--glow),0 0 18px var(--glow)}
.step.active .node::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin .9s linear infinite}
.step.done .node{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink)}
.step.done.fresh .node{animation:pop .4s both}
.step label{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step.active label{color:var(--ink);font-weight:650}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pc{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.pc.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.pc.bad{border-color:var(--bad);color:var(--bad)}
.pc em{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:4px}
.new-in{animation:popIn .35s cubic-bezier(.2,.9,.3,1.4) both}
.lrow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.lrow.new-in{animation:slideIn .35s both}
.lrow:last-child{border-bottom:none}
.lrow .n{font-weight:620;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .n small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
.new-in .badge{animation:pop .45s .15s both}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.skip{background:var(--soft);color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:4px}
.fi{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:6px 8px;border-radius:9px;background:var(--soft)}
.fi.new-in{animation:slideIn .3s both}
.fi .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:none;background:var(--panel);border:1px solid var(--line)}
.fi .w{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.fi b{font-weight:620;color:var(--ink);margin-right:6px}
.thought{font-size:13px;padding:10px 12px;border-radius:10px;border-left:3px solid var(--accent);background:var(--soft);white-space:pre-wrap;max-height:120px;overflow:auto}
details.raw summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:14px}
#log{margin:8px 0 0;padding:10px 12px;max-height:220px;overflow:auto;font:11.5px/1.5 var(--mono);white-space:pre-wrap;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.pbar{height:3px;background:var(--soft);position:relative;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--glow);transition:width .6s cubic-bezier(.2,.8,.2,1)}
#mc.running .pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:200% 100%;animation:shimmer 1.4s infinite}

/* toasts + burst */
#toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:10;pointer-events:none}
.toast{pointer-events:auto;min-width:260px;max-width:380px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);animation:toastIn .45s cubic-bezier(.2,.9,.3,1.3) both;font-size:13px}
.toast.ok{border-left:4px solid var(--ok)}.toast.bad{border-left:4px solid var(--bad)}
.toast b{display:block;margin-bottom:2px}
#burst{position:fixed;inset:0;pointer-events:none;z-index:9;width:100vw;height:100vh}
.shake{animation:shake .45s both!important}

/* new design */
.new{max-width:840px}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.examples button{font-size:12.5px;padding:5px 11px;border-radius:999px}
.row{display:flex;gap:10px;align-items:center}
.howit{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.howit div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;color:var(--muted);animation:fadeUp .4s both}
.howit b{display:block;color:var(--ink);margin-bottom:3px;font-size:13px}
.howit i{font-style:normal;font-size:18px;display:block;margin-bottom:6px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:11;cursor:zoom-out}
.lightbox img{max-width:92vw;max-height:92vh;background:#fff;border-radius:12px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes scan{0%{top:-90px}100%{top:100%}}
@keyframes toastIn{from{opacity:0;transform:translateX(30px) scale(.95)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:900px){body{flex-direction:column;overflow:auto}#side{width:100%;height:auto;max-height:42vh}.grid2,.howit{grid-template-columns:1fr}#mc{width:calc(100vw - 36px)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#ff6a2b"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs></svg>
<aside id="side">
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 30 30" aria-hidden="true"><path d="M8 24V6m0 9 11-9m-7 6 9 12" stroke="#160a03" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><b>Kerf Studio</b><small>describe it → printable, checked parts</small></div>
    <button class="themebtn" id="themebtn" onclick="toggleTheme()" title="Light / dark">☀</button>
    <button class="themebtn" onclick="quitApp()" title="Quit Kerf Studio" style="margin-left:4px">⏻</button>
  </div>
  <button id="newbtn" class="primary" onclick="showNew()">+ New design</button>
  <button id="partsbtn" onclick="showParts()" title="Parts you already have: designs prefer them and the shopping list leaves them out">▤ My parts</button>
  <input id="search" placeholder="Search projects" oninput="renderList()">
  <div id="plist"></div>
  <div id="buildall" style="display:none"><button style="width:100%" onclick="buildAll()"></button></div>
  <div id="jobs"><h4>Activity</h4><div id="joblist" class="note">Nothing running.</div></div>
</aside>
<main id="main"><div class="body"><div class="sk" style="height:34px;width:40%;margin-bottom:12px"></div><div class="sk" style="height:16px;width:70%;margin-bottom:24px"></div><div class="sk" style="height:420px"></div></div></main>

<div id="mc"><div class="scan"></div>
  <div class="mch"><div class="tring" id="tring"><svg viewBox="0 0 40 40" width="38" height="38"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" cx="20" cy="20" r="16" pathLength="100"/></svg><i id="tricon"></i></div>
    <div class="t"><b id="mctitle"></b><span id="mcsub"></span></div>
    <button id="mcstop" onclick="stopJob()">Stop</button><button onclick="toggleMin()" title="Minimise">▁</button><button onclick="closeMc()" title="Close">✕</button></div>
  <div class="pbar"><i id="pbar"></i></div>
  <div class="mcbody" id="mcbody"></div>
</div>
<div id="toasts"></div>
<canvas id="burst"></canvas>
<div class="lightbox" id="lb" onclick="this.style.display='none'"><img id="lbimg" alt=""></div>

<script>
const S = {projects: [], claude: false, platform: "", sel: null, detail: null, tab: "model", edits: {}, job: null, since: 0, esince: 0,
           ev: [], lines: [], doc: null, newOpen: false, seenDone: new Set(), shown: new Set(), listed: false, fails: 0, closed: false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({error: "bad response"}));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
};
const fileUrl = (p, rel) => `/files/${p}/${rel.split("/").map(encodeURIComponent).join("/")}`;
const fmt = v => v == null ? "–" : (typeof v === "number" ? (Math.abs(v) >= 100 ? v.toFixed(0) : +v.toFixed(3)) : esc(Array.isArray(v) ? v.join(", ") : v));
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const about = s => s == null ? "" : s < 90 ? `~${Math.max(10, Math.round(s / 10) * 10)} s` : `~${Math.round(s / 60)} min`;
// elements animate in only the first time they appear (polling re-renders must not replay animations)
const fresh = key => { if (S.shown.has(key)) return ""; S.shown.add(key); return " new-in"; };

/* ---------- theme */
function setTheme(t) { document.documentElement.dataset.theme = t; $("#themebtn").textContent = t === "dark" ? "☀" : "☾"; try { localStorage.setItem("kerf-theme", t); } catch (e) {} document.querySelectorAll("iframe.viewer").forEach(syncTheme); }
function syncTheme(f) {   // the 3D viewer follows the studio's theme (same origin, so the page can be told directly)
  try { const d = f.contentDocument; if (!d || !d.documentElement) return; d.documentElement.dataset.theme = document.documentElement.dataset.theme;
        if (typeof f.contentWindow.restyle === "function") f.contentWindow.restyle(); } catch (e) {}
}
function toggleTheme() { setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); }
let saved = null; try { saved = localStorage.getItem("kerf-theme"); } catch (e) {}
setTheme(saved || "dark");

/* ---------- margins: how much of its limit a requirement uses (direction inferred from pass/fail) */
function margin(r) {
  const v = r.value, l = r.limit;
  if (r.skipped || typeof v !== "number" || typeof l !== "number" || l === 0 || v === 0) return null;
  if (!r.ok) return {pct: 100, cls: "over", label: r.bound === "min" ? "below the minimum" : "over the limit"};
  const isMin = r.bound ? r.bound === "min" : v > l;          // the check says which way its limit points
  const used = isMin ? l / v : v / l;
  return {pct: Math.min(100, Math.max(3, used * 100)), cls: used > 0.8 ? "mid" : "",
          label: isMin ? `${(v / l).toFixed(1)}× the minimum` : `uses ${Math.round(used * 100)} % of the limit`};
}
function mbar(r, key) {
  const m = margin(r); if (!m) return "";
  const grown = key && S.shown.has("bar:" + key);
  if (key) S.shown.add("bar:" + key);
  return `<div class="mbar ${m.cls}"><i ${grown ? `style="width:${m.pct}%;transition:none"` : `data-w="${m.pct}"`}></i></div><div class="mtext">${m.label}</div>`;
}
function growBars(root) { requestAnimationFrame(() => requestAnimationFrame(() => (root || document).querySelectorAll(".mbar i[data-w]").forEach(i => { i.style.width = i.dataset.w + "%"; i.removeAttribute("data-w"); }))); }

/* ---------- projects list */
function statusChips(p) {
  const c = [];
  if (p.running && p.running.length) c.push(`<span class="chip info">● running</span>`);
  if (!p.built) c.push(`<span class="chip">not built</span>`);
  else if (p.ok) c.push(`<span class="chip ok">✓ checks pass</span>`);
  else c.push(`<span class="chip bad">${p.problems} problem${p.problems == 1 ? "" : "s"}</span>`);
  if (p.stale) c.push(`<span class="chip warn">changed since build</span>`);
  c.push(p.review && p.review.ok ? `<span class="chip ok">✓ reviewed</span>` : `<span class="chip warn">review needed</span>`);
  return c.join("");
}
async function loadProjects() {
  try {
    const d = await api("/api/projects");
    S.projects = d.projects; S.claude = d.claude; S.platform = d.platform;
    renderList();
    if (!S.sel && S.projects.length && !S.newOpen) select(S.projects[0].name);
    if (!S.projects.length && !S.newOpen) welcome();
    S.fails = 0;
  } catch (e) { if (++S.fails >= 3 && !S.closed) closedScreen(); }
}
function renderList() {
  const unbuilt = S.projects.filter(p => !p.built).length;
  $("#buildall").style.display = unbuilt ? "" : "none";
  const est = S.projects.filter(p => !p.built).reduce((a, p) => a + (p.build_s || 0), 0);
  $("#buildall button").textContent = `⚙ Build ${unbuilt} unbuilt project${unbuilt == 1 ? "" : "s"}${est ? " (" + about(est) + ")" : ""}`;
  const q = ($("#search").value || "").toLowerCase(), first = !S.listed; S.listed = true;
  $("#plist").innerHTML = S.projects.filter(p => !q || (p.title + p.name + p.description).toLowerCase().includes(q)).map((p, i) => {
    const run = p.running && p.running.length;
    return `<div class="pitem ${p.name === S.sel ? "sel" : ""}" style="${first ? `animation:fadeUp .35s ${i * 40}ms both` : ""}" onclick="select('${p.name}')">
      <div class="thumb ${run ? "running" : ""}" style="${p.thumb ? `background-image:url('${fileUrl(p.name, p.thumb)}')` : ""}">${p.thumb ? "" : "◇"}</div>
      <div class="pmeta"><b>${esc(p.title)}</b><span><i class="sdot ${run ? "run" : !p.built ? "" : p.ok ? "ok" : "bad"}"></i>${run ? "working…" : !p.built ? "not built yet" : p.ok ? "checks pass" : p.problems + " problems"}${p.review && p.review.ok ? " · reviewed" : ""}</span></div>
    </div>`; }).join("") || `<div class="note" style="padding:10px">No projects.</div>`;
}

async function select(name, keepTab) {
  S.sel = name; S.newOpen = false; S.edits = {}; if (!keepTab) S.tab = "model"; S.doc = null;
  renderList();
  const ticket = S.ticket = (S.ticket || 0) + 1;   // a slower answer for an earlier click must not replace this one
  let d;
  try { d = await api(`/api/project/${name}`); } catch (e) { if (ticket === S.ticket) $("#main").innerHTML = `<div class="body"><div class="banner bad">${esc(e.message)}</div></div>`; return; }
  if (ticket !== S.ticket) return;
  S.detail = d;
  renderProject();
}
async function refreshDetail() { if (S.sel && !S.newOpen) { const name = S.sel; try { const d = await api(`/api/project/${name}`); if (name === S.sel) { S.detail = d; renderProject(); } } catch (e) {} } }

function renderProject() {
  const d = S.detail; if (!d) return;
  const plates = d.files.some(f => f.startsWith("out/plates/") && f.endsWith(".3mf"));
  const tabs = [["model","3D model"],["tune","Tune"],["results","Checks"],["files","Files"],["docs","Docs"],["history","History"]];
  const n = d.summary_numbers, e = d.estimate || {};
  $("#main").innerHTML = `
    <div class="head">
      <h1>${esc(d.title)}</h1>
      <p class="desc">${esc(d.description)}</p>
      <div class="chips">${statusChips(d)}${d.report && d.report.seconds ? `<span class="chip">last run ${Math.round(d.report.seconds)} s</span>` : ""}</div>
      ${n ? `<div class="chips">${n.cost_usd != null ? `<span class="chip" title="Priced shopping list (bom.md), per piece used; whole packs cost $${fmt(n.packs_usd)}">$${fmt(n.cost_usd)}${n.unpriced ? ` + ${n.unpriced} unpriced` : ""}</span>` : ""}
        ${n.filament_g != null ? `<span class="chip" title="Printed parts, estimated">${fmt(n.filament_g)} g filament · ${n.print_parts} part${n.print_parts == 1 ? "" : "s"}</span>` : ""}
        ${n.device_g != null ? `<span class="chip" title="Everything mounted on the device">device ${fmt(n.device_g)} g</span>` : ""}
        ${n.print_s ? `<span class="chip" title="${n.print_sliced ? "sliced by Bambu Studio / OrcaSlicer" : "lower bound: plastic at the filament's max flow; slice for the real time (PRINT_SETTINGS.md)"}">${n.print_sliced ? "" : "≥ "}${n.print_s >= 3600 ? (n.print_s / 3600).toFixed(1) + " h" : Math.round(n.print_s / 60) + " min"} printing · ${n.plates} plate${n.plates == 1 ? "" : "s"}</span>` : ""}</div>` : ""}
      <div class="actions">
        <button class="primary" onclick="run('build')" title="Every check, then STEP/STL/3MF plates, BOM, assembly guide and renders">⚙ Build${e.build ? ` <small>${about(e.build)}</small>` : ""}</button>
        <button onclick="run('check')" title="Every check incl. motion sweeps and strength, no files">✓ Check${e.check ? ` <small>${about(e.check)}</small>` : ""}</button>
        <button onclick="run('quick')" title="Fast check without motion sweeps and FEA">⚡ Quick check</button>
        <button onclick="openIn('plates')" ${plates ? "" : "disabled"} title="Open the print plates in Bambu Studio">▦ Open plates in Bambu Studio</button>
        <button onclick="openIn('folder')">📁 Show files</button>
        <a class="btn" href="/export/${d.name}.zip" download title="Plates, parts, STEP, BOM, guides, drawings, bring-up program and the design files in one zip">⤓ Export zip</a>
      </div>
    </div>
    <nav class="tabs" id="tabs">${tabs.map(([k, l]) => `<button class="tab ${S.tab === k ? "sel" : ""}" data-t="${k}" onclick="setTab('${k}')">${l}</button>`).join("")}<span class="uline" id="uline"></span></nav>
    <div class="body" id="tabbody"></div>`;
  moveUline(); renderTab();
}
function moveUline() { const b = document.querySelector(`.tab[data-t="${S.tab}"]`), u = $("#uline"); if (b && u) { u.style.left = b.offsetLeft + "px"; u.style.width = b.offsetWidth + "px"; } }
function setTab(t) { S.tab = t; document.querySelectorAll(".tab").forEach(b => b.classList.toggle("sel", b.dataset.t === t)); moveUline(); renderTab(); }

function notBuilt(what) {
  return `<div class="card empty"><b>Not built yet</b>${what}<br><br><button class="primary" onclick="run('build')">⚙ Build now</button>
    <p class="note">A build runs every check and writes the 3D viewer, print plates, BOM and assembly guide (a few minutes).</p></div>`;
}
function renderTab() {
  const d = S.detail, el = $("#tabbody"), t = S.tab;
  if (!el) return;
  el.style.animation = "none"; el.offsetHeight; el.style.animation = "";
  if (t === "model") {
    el.innerHTML = d.viewer ? `<iframe class="viewer" onload="syncTheme(this)" src="${fileUrl(d.name, d.viewer)}?t=${Date.now()}"></iframe>
      <p class="note">Drag to orbit, scroll to zoom. The joint sliders move the real kinematics; "Spread parts apart" explodes the assembly.</p>` : notBuilt("The 3D model appears here after the first build.");
  } else if (t === "tune") renderTune(el);
  else if (t === "results") renderResults(el, d.report);
  else if (t === "files") renderFiles(el);
  else if (t === "docs") renderDocs(el);
  else if (t === "history") renderHistory(el);
}

/* ---------- My parts (catalog/inventory.json) */
async function showParts() {
  S.newOpen = true; S.sel = null; S.ticket = (S.ticket || 0) + 1; renderList();   // drops a project still loading
  const d = await api("/api/inventory"); S.inv = {...d.items}; S.invKeys = d.keys;
  renderParts();
}
function renderParts() {
  const rows = Object.entries(S.inv).sort();
  $("#main").innerHTML = `<div class="head"><h1>My parts</h1><p class="desc">What you already have on the bench. New designs prefer these, and every shopping list counts them first and leaves them out of the cost.</p></div>
    <div class="body"><div class="card">
      <table><tr><th>Part</th><th style="width:120px">Have</th><th></th></tr>${rows.map(([k, v]) => `<tr><td><b>${esc((S.invKeys.find(x => x.key === k) || {}).name || k)}</b> <span class="note">${esc(k)}</span></td>
        <td><input type="number" min="0" step="1" value="${v}" onchange="S.inv['${k}']=parseFloat(this.value)||0"></td><td><button onclick="delete S.inv['${k}'];renderParts()">Remove</button></td></tr>`).join("") || `<tr><td colspan="3" class="note">Nothing yet.</td></tr>`}</table>
      <div class="row" style="margin-top:12px"><input id="invadd" list="invkeys" placeholder="Add a part: start typing (servo, M3x8, PETG…)" style="flex:1">
        <datalist id="invkeys">${S.invKeys.map(x => `<option value="${esc(x.key)}">${esc(x.name)}</option>`).join("")}</datalist>
        <input id="invqty" type="number" min="1" value="1" style="width:90px"><button onclick="addPart()">Add</button></div>
      <div class="row" style="margin-top:14px"><button class="primary" onclick="saveParts()">Save</button></div></div></div>`;
}
function addPart() { const k = $("#invadd").value.trim(), q = parseFloat($("#invqty").value) || 1;
  if (!S.invKeys.some(x => x.key === k)) { toast("Unknown part", "Pick one from the list (they are the parts Kerf can price).", "bad"); return; }
  S.inv[k] = (S.inv[k] || 0) + q; renderParts(); }
async function saveParts() { try { const r = await api("/api/inventory", {items: S.inv}); S.inv = {...r.items}; renderParts(); toast("Saved", "My parts updated. Rebuild a project to see its shopping list change.", "ok"); }
  catch (e) { toast("Not saved", e.message, "bad"); } }

/* ---------- welcome / empty state */
function welcome() {
  $("#main").innerHTML = `<div class="body"><div class="card empty" style="text-align:left;max-width:760px">
    <h2 style="margin-top:0">Welcome to Kerf Studio</h2>
    <p>Describe a device in plain words and Kerf designs every printed part, picks the purchased parts, proves it fits,
      moves and holds, and writes print plates, a priced shopping list and an assembly guide.</p>
    <ol><li><b>+ New design</b>: say what it should do ("a pan-tilt camera head for a Pi camera").</li>
      <li>Watch it work; when it finishes, the 3D model, checks and files appear here.</li>
      <li><b>Tune</b> a dimension, <b>Try</b> it (your files stay untouched), then <b>Build</b> and print.</li></ol>
    <button class="primary" onclick="showNew()">+ New design</button></div></div>`;
}

/* ---------- history: one entry per build from Studio, with what changed */
function renderHistory(el) {
  const d = S.detail, H = d.history || [];
  if (!H.length) { el.innerHTML = `<div class="card empty"><b>No versions yet</b>Every build from Studio saves a version here: its values, results, cost and picture, so you can compare and go back.</div>`; return; }
  const cur = d.report || {}, curReq = Object.fromEntries((cur.requirements || []).map(r => [r.id, r]));
  const curParams = Object.fromEntries(d.params.map(p => [p.key, p.value]));
  el.innerHTML = H.map((h, i) => {
    const pch = Object.entries(h.params || {}).filter(([k, v]) => k in curParams && Math.abs(curParams[k] - v) > 1e-9);
    const rch = Object.entries(h.requirements || {}).filter(([k, r]) => curReq[k] && typeof r.value === "number" && typeof curReq[k].value === "number" && Math.abs(curReq[k].value - r.value) > 1e-6 * Math.max(1, Math.abs(r.value)));
    return `<div class="card hist" style="margin-bottom:12px;display:flex;gap:14px">
      ${h.thumb ? `<img src="/history/${d.name}/${h.stamp}/thumb.png" alt="" style="width:150px;height:112px;object-fit:cover;border-radius:8px" onclick="zoom(this.src)">` : ""}
      <div style="flex:1"><b>${new Date(h.time * 1000).toLocaleString()}</b> <span class="chip ${h.ok ? "ok" : "bad"}">${h.ok ? "checks pass" : h.problems + " problems"}</span>
        <span class="note">commit ${esc(h.commit || "?")}${h.dirty ? " + uncommitted edits" : ""}${i === 0 ? " · latest" : ""}</span>
        <div class="note">${h.cost != null ? "$" + fmt(h.cost) + " · " : ""}${h.mass && h.mass.device_g != null ? fmt(h.mass.device_g) + " g device" : ""}</div>
        <div>${pch.length ? `<b>Values that differ from now:</b> ${pch.map(([k, v]) => `${esc(k)} ${fmt(v)} (now ${fmt(curParams[k])})`).join(", ")}` : `<span class="note">Same values as now.</span>`}</div>
        ${rch.length ? `<div><b>Results then vs now:</b> ${rch.slice(0, 8).map(([k, r]) => `${esc(k)} ${fmt(r.value)} → ${fmt(curReq[k].value)}${r.unit ? " " + esc(r.unit) : ""}`).join(", ")}</div>` : ""}
        ${pch.length ? `<button style="margin-top:8px" onclick="restoreVersion('${h.stamp}')">↶ Restore these values</button>` : ""}
      </div></div>`;
  }).join("");
}
async function restoreVersion(stamp) {
  if (!confirm("Write this version's parameter values back into project.yaml? Part code is not changed. Build again afterwards.")) return;
  try { const r = await api("/api/restore", {project: S.sel, stamp}); await refreshDetail(); setTab("history");
        toast("Restored", r.changed.length ? `Changed: ${r.changed.join(", ")}. Build to update the files.` : "Nothing to change.", "ok"); }
  catch (e) { toast("Not restored", e.message, "bad"); }
}

function reqTable(reqs) {
  if (!reqs || !reqs.length) return `<p class="note">No requirement checks.</p>`;
  return `<table><tr><th>Requirement</th><th>Result</th><th>Value</th><th>Limit</th><th style="width:24%">Margin</th></tr>${reqs.map((r, i) => `
    <tr class="reqrow" style="animation-delay:${i * 45}ms"><td><b>${esc(r.id)}</b> <span class="why">${esc(r.check)}</span><div class="why">${esc(r.why || "")}</div></td>
    <td>${r.skipped ? `<span class="badge skip">skipped</span>` : r.ok ? `<span class="badge ok">PASS</span>` : `<span class="badge bad">FAIL</span>`}</td>
    <td class="num">${fmt(r.value)}${r.unit && r.value != null ? " " + esc(r.unit) : ""}</td><td class="num">${limitText(r)}</td><td>${mbar(r)}</td></tr>`).join("")}</table>`;
}
function limitText(r) {   // "max 4.7 kg·cm", "min 15 °", "40–48 mm"
  if (r.limit == null) return "–";
  const u = r.unit ? " " + esc(r.unit) : "";
  if (r.bound === "range" && Array.isArray(r.limit)) return `${r.limit.map(x => x == null ? "…" : fmt(x)).join("–")}${u}`;
  return `${r.bound && r.bound !== "limit" ? r.bound + " " : ""}${fmt(r.limit)}${typeof r.limit === "number" ? u : ""}`;
}
function ring(pass, total) {
  const C = 2 * Math.PI * 40, f = total ? pass / total : 0;
  return `<div class="ring"><svg viewBox="0 0 96 96" width="96" height="96"><circle class="bg" cx="48" cy="48" r="40"/>
    <circle class="fg" cx="48" cy="48" r="40" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - f)}"/></svg><b>${pass}/${total}</b></div>`;
}
function renderResults(el, rep) {
  if (!rep) { el.innerHTML = notBuilt("Check results appear here."); return; }
  const P = rep.problems || [], W = rep.warnings || [], R = (rep.requirements || []).filter(r => !r.skipped);
  const pass = R.filter(r => r.ok).length;
  const tight = R.filter(r => { const m = margin(r); return m && r.ok && m.cls === "mid"; }).length;
  el.innerHTML = `
    <div class="summary card">${ring(pass, R.length)}
      <div class="stat"><b>${rep.ok ? "Ready to print" : P.length + " to fix"}</b><span>${rep.ok ? "every check passes" : "problems block printing"}</span></div>
      <div class="stat"><b>${pass}</b><span>engineering checks pass</span></div>
      <div class="stat"><b>${tight}</b><span>with under 20 % margin</span></div>
      <div class="stat"><b>${W.length}</b><span>warnings to read</span></div></div>
    <div class="banner ${rep.ok ? "ok" : "bad"}">${rep.ok ? "Parts fit, nothing collides at any joint angle, every screw lines up and can be reached, and strength and the other requirements hold." : `${P.length} problem${P.length == 1 ? "" : "s"} to fix before printing.`}</div>

function compareTable(saved, tried) {   // the saved build's result next to the tried one, per requirement
  if (!tried || !tried.length) return `<p class="note">No requirement results for the try.</p>`;
  const sv = Object.fromEntries((saved || []).map(r => [r.id, r]));
  return `<table><tr><th>Requirement</th><th>Saved</th><th>Tried</th><th>Change</th></tr>${tried.filter(r => !r.skipped).map(r => {
    const s = sv[r.id], a = s && typeof s.value === "number" ? s.value : null, b = typeof r.value === "number" ? r.value : null;
    const dlt = a != null && b != null ? b - a : null, u = r.unit ? " " + esc(r.unit) : "";
    return `<tr><td><b>${esc(r.id)}</b></td><td class="num">${s ? fmt(s.value) + u + (s.ok ? "" : " ✗") : "–"}</td>
      <td class="num">${fmt(r.value)}${u}${r.ok ? "" : " ✗"}</td>
      <td class="num">${dlt == null || Math.abs(dlt) < 1e-9 ? "–" : (dlt > 0 ? "+" : "") + fmt(dlt) + u}</td></tr>`; }).join("")}</table>`;
}
function setParam(k, v, live) {

  if (live) { const r = document.querySelector(`#r_${k}`); r.parentElement.querySelector("input[type=number]").value = v;

}

const STAGE_NAMES = {build: "Build parts", print: "Print checks", fit: "Fit & screws", motion: "Motion", requirements: "Engineering", export: "Files", renders: "Renders"};
const PHASES = [["research","Research","🔎"],["plan","Plan","✎"],["contract","Contract","▤"],["parts","Model parts","◧"],["check","Check + fix","✓"],["build","Build","⚙"],["review","Review","◎"],["ship","Save","⬆"]];
const TOOL_ICON = {WebSearch: "🔎", WebFetch: "🌐", Read: "📖", Write: "✎", Edit: "✎", Bash: "▶", Agent: "◆", Task: "◆", Grep: "⌕", Glob: "⌕", TaskCreate: "☑", TaskUpdate: "☑"};

function watch(id) {

  const mc = $("#mc"); mc.classList.remove("open", "min"); mc.offsetHeight; mc.classList.add("open");

function closeMc() { $("#mc").classList.remove("open"); S.job = null; }
function toggleMin() { $("#mc").classList.toggle("min"); }
async function stopJob() { if (S.job && confirm("Stop this job?")) await api("/api/stop", {job: S.job}).catch(e => toast("Couldn't stop", e.message, "bad")); }

async function pollJob() {
  const id = S.job; if (!id) return;
  try {
    const j = await api(`/api/job/${id}?since=${S.since}&esince=${S.esince}`);
    if (id !== S.job) return;
    S.lines.push(...j.lines); S.since = j.n; S.ev.push(...j.events); S.esince = j.ne;
    renderMc(j);
    if (j.state === "running") setTimeout(pollJob, 900);
    else finished(j);
  } catch (e) { setTimeout(pollJob, 2500); }
}
function lastProjectEvents(ev) { let i = -1; ev.forEach((e, n) => { if (e.k === "start") i = n; }); return i < 0 ? ev : ev.slice(i); }
function stageState(ev) {
  let start = null, cur = null, fin = null; const done = new Set();
  for (const e of ev) {
    if (e.k === "start") { start = e; cur = null; done.clear(); fin = null; }
    else if (e.k === "stage") { if (cur) done.add(cur); cur = e.stage; }
    else if (e.k === "done") { if (cur) done.add(cur); fin = e; cur = null; }
  }
  return {start, cur, done, fin};
}

function stepper(items, key) {   // items: [{k,label,icon,state}] state: done|active|""
  return `<div class="stepper">${items.map((it, i) => {
    const f = it.state === "done" && !S.shown.has(`mc:${key}:${it.k}`) ? " fresh" : "";
    if (it.state === "done") S.shown.add(`mc:${key}:${it.k}`);
    return `<div class="step ${it.state}${f}"><div class="node">${it.state === "done" ? "✓" : it.icon}</div><label>${esc(it.label)}</label></div>`; }).join("")}</div>`;
}

function renderMc(j) {
  const mc = $("#mc"); mc.classList.toggle("running", j.state === "running");
  $("#mctitle").textContent = j.label;
  $("#tring").className = "tring " + (j.state === "running" ? "" : j.state);
  $("#tricon").textContent = j.state === "running" ? "" : j.state === "done" ? "✓" : "✕";
  $("#mcstop").style.display = j.state === "running" ? "" : "none";
  const body = $("#mcbody"), atEnd = body.scrollTop + body.clientHeight >= body.scrollHeight - 40;
  let html = "", pct = 0;
  if (j.kind === "design") {
    const tools = S.ev.filter(e => e.k === "tool"), seen = new Set(tools.map(e => e.phase).filter(Boolean));
    const curPhase = [...tools].reverse().find(e => e.phase)?.phase;
    const ci = PHASES.findIndex(p => p[0] === curPhase);
    pct = j.state === "done" ? 100 : Math.max(4, ((ci + 1) / PHASES.length) * 100);
    html += `<div class="sect">Design phases</div>` + stepper(PHASES.map(([k, l, ic], i) => ({k, label: l, icon: ic,
      state: j.state === "done" ? "done" : (k === curPhase && j.state === "running") ? "active" : (i < ci || seen.has(k)) ? "done" : ""})), "ph");
    const hint = S.ev.find(e => e.k === "hint");
    if (hint) html += readyCard({code: hint.code, why: hint.code === "auth" ? "Claude Code's sign-in expired, so the design stopped before it began." :
                                 "Claude Code doesn't trust this folder yet, so it would have ignored Kerf's settings and quality checks; the design was stopped."});
    const thoughts = S.lines.filter(l => !l.startsWith("  > ") && !l.startsWith("==") && !l.startsWith("(")).slice(-1);
    if (thoughts.length) html += `<div class="sect">Claude is thinking</div><div class="thought">${esc(thoughts[0])}</div>`;
    html += `<div class="sect">Latest actions · ${tools.length} so far</div><div class="feed">${tools.slice(-8).reverse().map((t, n) =>
      `<div class="fi${fresh("mc:tool:" + (tools.length - n))}"><span class="ic">${TOOL_ICON[t.name] || "•"}</span><span class="w"><b>${esc(t.name)}</b>${esc(t.what)}</span></div>`).join("") || `<div class="note">Starting Claude Code…</div>`}</div>`;
  } else {
    const projs = S.ev.filter(e => e.k === "project"), cp = projs[projs.length - 1];
    const ev = lastProjectEvents(S.ev), st = stageState(ev), stages = st.start ? st.start.stages : ["build", "print", "fit", "requirements"];
    const pkey = cp ? cp.name : "p";
    const ndone = stages.filter(s => st.done.has(s)).length;
    pct = st.fin ? 100 : (ndone + (st.cur ? 0.5 : 0)) / stages.length * 100;
    if (cp) { pct = ((cp.i - 1) + pct / 100) / cp.n * 100;
      html += `<div class="banner info">Project ${cp.i} of ${cp.n}: <b>${esc(st.start ? st.start.project : cp.name)}</b></div>`; }
    html += `<div class="sect">Pipeline</div>` + stepper(stages.map((s, i) => ({k: s, label: STAGE_NAMES[s] || s, icon: i + 1,
      state: st.done.has(s) ? "done" : s === st.cur ? "active" : ""})), pkey);
    const parts = ev.filter(e => e.k === "part");
    if (parts.length) html += `<div class="sect">Printed parts · ${parts.length}${st.start ? " of " + st.start.parts.length : ""}</div><div class="pchips">${parts.map(p =>
      `<span class="pc ${p.ok ? "ok" : "bad"}${fresh(`mc:${pkey}:part:${p.id}`)}">${p.ok ? "✓" : "✕"} ${esc(p.id)}${p.mass ? `<em>${p.mass} g</em>` : ""}</span>`).join("")}</div>`;
    const sw = ev.filter(e => e.k === "sweep");
    if (sw.length) html += `<div class="sect">Moving joints swept through their range</div><div class="pchips">${sw.map(s =>
      `<span class="pc ${s.clear ? "ok" : "bad"}${fresh(`mc:${pkey}:sw:${s.joint}`)}">${s.clear ? "↻ clear" : "✕ collides"} · ${esc(s.joint)}</span>`).join("")}</div>`;
    const reqs = ev.filter(e => e.k === "req");
    if (reqs.length || st.cur === "requirements") {
      const total = st.start ? st.start.reqs.length : reqs.length;
      html += `<div class="sect">Engineering checks · ${reqs.length} of ${total}</div>${reqs.map(r => `<div class="lrow${fresh(`mc:${pkey}:req:${r.id}`)}"><div class="n">${esc(r.id)}<small>${esc(r.check)}</small></div>
        <div>${r.skipped ? `<span class="note">skipped in quick mode</span>` : mbar(r, `mc:${pkey}:${r.id}`) || `<span class="note">${fmt(r.value)}${r.unit ? " " + esc(r.unit) : ""} · ${limitText(r)}</span>`}</div>
        <span class="badge ${r.skipped ? "skip" : r.ok ? "ok" : "bad"}">${r.skipped ? "SKIP" : r.ok ? "PASS" : "FAIL"}</span></div>`).join("")}
        ${st.cur === "requirements" && reqs.length < total ? `<div class="lrow"><div class="n">${esc(st.start.reqs[reqs.length] || "")}<small>computing…</small></div><div class="sk" style="height:7px"></div><span class="badge skip">…</span></div>` : ""}`;
    }
    if (st.fin) html += `<div class="banner ${st.fin.ok ? "ok" : "bad"}" style="margin-top:12px">${st.fin.ok ? "✓ Every check passes" : `✕ ${st.fin.problems} problem(s); details in the Checks tab`} · ${st.fin.seconds} s</div>`;
  }
  if (j.state === "failed" && !html.includes("banner bad")) html += `<div class="banner bad" style="margin-top:12px">Finished with an error; details in the log below.</div>`;
  if (j.state === "stopped") html += `<div class="banner bad" style="margin-top:12px">Stopped.</div>`;
  const openRaw = body.querySelector("details.raw")?.open;
  html += `<details class="raw"${openRaw ? " open" : ""}><summary>Raw log · ${S.lines.length} lines</summary><pre id="log">${esc(S.lines.slice(-400).join("\n"))}</pre></details>`;

  if (openRaw) { const lg = $("#log"); lg.scrollTop = lg.scrollHeight; }
  growBars(body);
  $("#mcsub").textContent = `${j.state === "running" ? "working" : j.state} · ${mmss(j.seconds)}`;
  $("#pbar").style.width = (j.state === "done" ? 100 : pct) + "%";
  if (atEnd) body.scrollTop = body.scrollHeight;

async function finished(j) {
  if (S.seenDone.has(j.id)) return; S.seenDone.add(j.id);
  const st = stageState(lastProjectEvents(S.ev));
  const ok = j.state === "done" && (!st.fin || st.fin.ok);
  if (ok) { toast(j.label, j.kind === "design" ? "Claude Code finished the design." : "Every check passes.", "ok"); burst(); }
  else { toast(j.label, j.state === "stopped" ? "Stopped." : st.fin ? `${st.fin.problems} problem(s) to fix.` : "Finished with an error; see the log.", "bad");
    const mc = $("#mc"); mc.classList.add("shake"); setTimeout(() => mc.classList.remove("shake"), 500); }
  if (j.kind === "trial") S.tab = "tune";
  if (j.kind === "quote" && ok) { if (!S.newOpen) showNew(); if ($("#nname") && !$("#nname").value) { $("#nname").value = j.project; $("#nname").dataset.touched = 1; } await showQuote(j.project); return; }
  await loadProjects();
  if (j.project === S.sel || j.project === "*") await refreshDetail();
  else if (j.kind === "design" && S.projects.some(p => p.name === j.project)) select(j.project);
}

/* ---------- toasts + burst */
function toast(title, msg, cls) {
  const t = document.createElement("div"); t.className = "toast " + (cls || "");
  t.innerHTML = `<b>${esc(title)}</b><span class="note" style="white-space:pre-wrap">${esc(msg)}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .4s, transform .4s"; t.style.opacity = 0; t.style.transform = "translateX(30px)"; setTimeout(() => t.remove(), 450); }, 5200);
}
function burst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#burst"), x = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = $("#mc").getBoundingClientRect(), ox = r.width ? r.left + 34 : innerWidth - 120, oy = r.width ? r.top + 32 : 60;
  const cols = ["#ff6a2b", "#ffb347", "#3ddc84", "#6cb4ff", "#ffffff"];
  const P = Array.from({length: 110}, () => { const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 8;
    return {x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, r: 2 + Math.random() * 3.5, c: cols[(Math.random() * cols.length) | 0], life: 1, spin: Math.random() * 6, sq: Math.random() < .5}; });
  let f = 0;
  (function step() {
    x.clearRect(0, 0, innerWidth, innerHeight); f++;
    for (const p of P) { p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.vx *= 0.985; p.life -= 0.011; p.spin += 0.2;
      x.globalAlpha = Math.max(0, p.life); x.fillStyle = p.c; x.save(); x.translate(p.x, p.y); x.rotate(p.spin);
      if (p.sq) x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); else { x.beginPath(); x.arc(0, 0, p.r, 0, 7); x.fill(); } x.restore(); }
    if (f < 120) requestAnimationFrame(step); else x.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ---------- new design */
const EXAMPLES = ["a wall mount for my DJI Osmo Pocket 3 with a 1/4-20 screw", "a 2-axis pan-tilt for a phone, SG90 servos",
  "a parametric project box for an Arduino Uno with a snap lid", "a 3\" cinewhoop frame for 1404 motors", "a gripper that picks up a 60 mm ball with one MG996R"];
function showNew() {
  S.newOpen = true; S.sel = null; S.ticket = (S.ticket || 0) + 1; renderList();   // drops a project still loading
  $("#main").innerHTML = `<div class="head"><h1>New design</h1><p class="desc">Describe what you want in plain words: what it does, loads or sizes that matter, parts you already own.</p></div>
    <div class="body new">
      <div id="ready"></div>
      <div class="card">
        <label class="note" for="ndesc">What should it be?</label>
        <textarea id="ndesc" placeholder="e.g. a 4-axis desk robot arm that lifts 150 g at 25 cm" oninput="autoname()"></textarea>
        <div class="examples">${EXAMPLES.map(x => `<button onclick="$('#ndesc').value=this.textContent;autoname()">${esc(x)}</button>`).join("")}</div>
        <label class="note" for="nname">Project folder name</label>
        <input id="nname" placeholder="desk_arm" oninput="this.dataset.touched=1">
        <details class="intake" open><summary><b>A few questions</b> <span class="note">(optional; they steer the design)</span></summary>
          <div class="igrid">
            <label>Budget, USD<input id="i_budget" placeholder="e.g. 60"></label>
            <label>Power<select id="i_power"><option value="">not sure</option><option>USB</option><option>Mains adapter</option><option>Battery (LiPo)</option><option>Battery (AA / 18650)</option><option>None (passive)</option></select></label>
            <label>Mounting<input id="i_mounting" placeholder="desk, wall, tripod, on the robot arm…"></label>
            <label>Environment<select id="i_environment"><option value="">indoors</option><option>Outdoors</option><option>Hot (car, near a heater)</option><option>Wet / splashes</option></select></label>
            <label>Printer<input id="i_printer" value="Bambu Lab A2L"></label>
            <label>Material<select id="i_material"><option>PETG</option><option>PLA</option><option>CF-PETG</option><option>TPU (flexible parts)</option></select></label>
          </div>
          <label class="note">Anything else (sizes, parts you own, must-haves)<input id="i_notes"></label>
          <p class="note">Parts in <a href="#" onclick="showParts();return false">My parts</a> are preferred and not counted in the cost.</p>
        </details>
        <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="primary" id="nquote" onclick="startQuote()" disabled>✦ Show me 2–3 options first</button>
          <button id="nstart" onclick="startNew()" disabled>Start designing now</button>
          <span class="note">Options take a few minutes; the full design roughly 1–4 hours. It keeps going while Kerf Studio stays open.</span></div>
        <div id="quote"></div>
      </div>
      <div class="howit">
        <div style="animation-delay:60ms"><i>🔎</i><b>Research</b>Finds proven open designs and datasheets, then picks real parts with the sizing math.</div>
        <div style="animation-delay:120ms"><i>◧</i><b>Model</b>Writes every printed part in CAD with matching screw holes, inserts and mounts.</div>
        <div style="animation-delay:180ms"><i>✓</i><b>Prove</b>Fit, motion through every angle, screw access, strength simulation, print checks.</div>
        <div style="animation-delay:240ms"><i>◎</i><b>Review</b>An independent reviewer inspects it; findings are fixed before it's called done.</div>
      </div>
    </div>`;
  checkReady();
}
function autoname() {
  const n = $("#nname"); if (n.dataset.touched) return;
  const stop = new Set(["a","an","the","for","my","with","that","and","of","to","in","on","at","it","is"]);
  n.value = ($("#ndesc").value.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w && !stop.has(w)).slice(0, 3).join("_") || "").replace(/^[^a-z]+/, "").slice(0, 40);
}
function intake() {
  const o = {}; for (const k of ["budget","power","mounting","environment","printer","material","notes"]) { const el = $("#i_" + k); if (el && el.value.trim()) o[k] = el.value.trim(); }
  return o;
}
async function startQuote() {
  const r = await fetch("/api/quote", {method: "POST", headers: {"Content-Type": "application/json"},
                                       body: JSON.stringify({name: $("#nname").value.trim(), description: $("#ndesc").value, intake: intake()})});
  const j = await r.json().catch(() => ({error: "bad response"}));
  if (r.ok && j.job) { S.quoteFor = $("#nname").value.trim(); watch(j.job); toast("Working out options", "Claude Code is researching 2–3 ways to build it, with cost and print time.", "ok"); return; }
  if (j.setup) { showReady({ok: false, code: j.setup, why: j.error}); return; }
  toast("Couldn't start", j.error || r.statusText, "bad");
}
async function showQuote(name) {
  const el = $("#quote"); if (!el) return;
  try {
    const q = await api(`/api/quote/${name}`); S.quote = q;
    el.innerHTML = `<h3>Options</h3><div class="qopts">${q.options.map((o, i) => `<div class="card qopt ${i === q.recommended ? "rec" : ""}">
      <b>${esc(o.title)}</b>${i === q.recommended ? ` <span class="chip ok">recommended</span>` : ""}<p>${esc(o.summary)}</p>
      <div class="chips"><span class="chip">$${fmt(o.cost_usd)}</span><span class="chip">${fmt(o.print_hours)} h printing</span><span class="chip">${fmt(o.parts_printed)} printed parts</span></div>
      ${o.cost_note || o.print_note ? `<p class="note">${esc([o.cost_note, o.print_note].filter(Boolean).join(" · "))}</p>` : ""}
      ${(o.risks || []).length ? `<p class="note">Risks: ${o.risks.map(esc).join("; ")}</p>` : ""}
      <button class="primary" onclick="startNew(${i})">Design this one</button></div>`).join("")}</div>
      ${(q.assumptions || []).length ? `<p class="note">Assumed: ${q.assumptions.map(esc).join("; ")}</p>` : ""}`;
  } catch (e) { el.innerHTML = `<div class="banner bad">No options yet: ${esc(e.message)}</div>`; }
}
async function startNew(opt) {
  const option = typeof opt === "number" && S.quote ? S.quote.options[opt] : null;
  const r = await fetch("/api/new", {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify({name: $("#nname").value.trim(), description: $("#ndesc").value, intake: intake(), option})});
  const j = await r.json().catch(() => ({error: "bad response"}));
  if (r.ok && j.job) { watch(j.job); toast("Design started", "Claude Code is researching. Watch it work in the panel.", "ok"); return; }
  if (j.setup) { showReady({ok: false, code: j.setup, why: j.error}); return; }
  toast("Couldn't start", j.error || r.statusText, "bad");
}
/* ---------- Claude Code readiness: checked before every design, fixed once with one button */
const SETUP_TEXT = {
  missing: "Install it once: open Terminal and run <code>npm install -g @anthropic-ai/claude-code</code>, then press Set up.",
  trust: "One time: click <b>Set up Claude Code</b>, choose “Yes, I trust this folder”, type <code>/exit</code>, then start again.",
  auth: "Your Claude Code sign-in expired. Click <b>Set up Claude Code</b>, type <code>/login</code> and follow it, then <code>/exit</code> and start again.",
};
function readyCard(st) {
  return `<div class="banner warn" id="readycard"><b>Claude Code needs a one-time fix before designs can run.</b><br>${esc(st.why)}<br>${SETUP_TEXT[st.code] || ""}
    <div class="row" style="margin-top:10px"><button class="primary" onclick="setupClaude()">Set up Claude Code</button><button onclick="checkReady()">Check again</button></div></div>`;
}
function showReady(st) {
  const el = $("#ready"); if (!el) return;
  el.innerHTML = st.ok ? `<div class="banner ok">✓ Claude Code is installed, trusts this folder and is signed in.</div>` : readyCard(st);
  for (const id of ["#nstart", "#nquote"]) { const b = $(id); if (b) b.disabled = !st.ok; }
}
async function checkReady() { const el = $("#ready"); if (el) el.innerHTML = `<div class="sk" style="height:44px;margin-bottom:14px"></div>`;
  try { showReady(await api("/api/claude")); } catch (e) { showReady({ok: false, code: "auth", why: e.message}); } }
async function setupClaude() {
  try { const r = await api("/api/claude-setup", {}); toast("Terminal opened", r.opened ? "Follow the steps in the Terminal window, then click Check again." : "Run this in Terminal: " + r.command, "ok"); }
  catch (e) { toast("Couldn't open Terminal", e.message, "bad"); }
}

/* ---------- lifetime: closing the window closes the tool (the server waits for running jobs) */
addEventListener("pagehide", () => { try { navigator.sendBeacon("/api/bye", "{}"); } catch (e) {} });
async function quitApp() {
  let r = await fetch("/api/quit", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"}).catch(() => null);
  if (r && r.status === 409) {
    const j = await r.json();
    if (!confirm(`Still running:\n• ${j.running.join("\n• ")}\n\nStop ${j.running.length > 1 ? "them" : "it"} and quit?`)) return;
    r = await fetch("/api/quit", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({force: true})}).catch(() => null);
  }
  closedScreen();
}
function closedScreen() {
  S.closed = true;
  document.body.innerHTML = `<div style="margin:auto;text-align:center;animation:fadeUp .4s both">
    <div class="logo" style="width:64px;height:64px;margin:0 auto 18px;border-radius:18px"><svg width="32" height="32" viewBox="0 0 30 30"><path d="M8 24V6m0 9 11-9m-7 6 9 12" stroke="#160a03" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2 style="margin:0 0 6px">Kerf Studio is closed</h2><p class="note">You can close this window. Click the Dock icon to open it again.</p></div>`;
  setTimeout(() => window.close(), 400);
}
