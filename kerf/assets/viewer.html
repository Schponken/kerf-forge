<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · Kerf viewer</title>
<style>
:root{--bg:#f3f4f2;--panel:#ffffff;--ink:#1b1f22;--mute:#5d666c;--line:#dfe2df;--soft:#eef0ed;--accent:#2f6fb0;
  --good:#1f7a45;--goodbg:#e2f3e8;--bad:#b3261e;--badbg:#fbe4e2;--warn:#8a5a00;--warnbg:#fff1d6;--scene:#eceeeb;--grid1:#c4c9c5;--grid2:#dde0dd;--edge:#1a1e21}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--panel:#1d2124;--ink:#e7eaec;--mute:#9aa4aa;--line:#30363a;--soft:#262b2e;--accent:#6aa7e8;
  --good:#6fd59a;--goodbg:#173323;--bad:#ff8a80;--badbg:#3a1d1b;--warn:#f0c46a;--warnbg:#3a2f14;--scene:#1a1e21;--grid1:#3b4246;--grid2:#2a3033;--edge:#0b0d0e}}
:root[data-theme="dark"]{--bg:#15181a;--panel:#1d2124;--ink:#e7eaec;--mute:#9aa4aa;--line:#30363a;--soft:#262b2e;--accent:#6aa7e8;
  --good:#6fd59a;--goodbg:#173323;--bad:#ff8a80;--badbg:#3a1d1b;--warn:#f0c46a;--warnbg:#3a2f14;--scene:#1a1e21;--grid1:#3b4246;--grid2:#2a3033;--edge:#0b0d0e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
.pill{font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px}
.pill.ok{color:var(--good);background:var(--goodbg)}.pill.bad{color:var(--bad);background:var(--badbg)}
.meta{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
header .sp{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
body{display:flex;flex-direction:column}main{display:grid;grid-template-columns:1fr 400px;flex:1;min-height:0}
#stage{position:relative;min-height:320px;background:var(--scene)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.views{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.views button{background:var(--panel)}.views button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;display:none;white-space:nowrap}
.legend{position:absolute;left:12px;bottom:10px;color:var(--mute);font-size:12px}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-radius:0;background:none;padding:10px 9px;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);background:none}
.pane{padding:14px 16px;overflow:auto;flex:1;display:none}.pane.on{display:block}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 0 8px;font-weight:650}
h2:first-child{margin-top:0}
.ctl{margin:0 0 14px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl .name{font-weight:600}.ctl .val{font-variant-numeric:tabular-nums;color:var(--mute)}
.ctl input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 2px}
.ctl .sub{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;color:var(--mute);font-size:12px;gap:6px 8px}.ctl .sub span:last-child{display:flex;gap:6px;margin-left:auto}
.ctl .sub button{padding:1px 8px;font-size:12px}
.part{display:grid;grid-template-columns:18px 14px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.part:hover .pn{color:var(--accent)}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
.pn{font-weight:600}.pd{color:var(--mute);font-size:12px}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--soft);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chk{display:grid;grid-template-columns:20px 1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--soft)}
.chk .i{display:flex;padding-top:2px}.chk .i.ok{color:var(--good)}.chk .i.bad{color:var(--bad)}
.chk .d{color:var(--mute);font-size:12px}
.note{padding:8px 10px;border-radius:7px;margin:0 0 8px;font-size:13px}
.note.bad{background:var(--badbg);color:var(--bad)}.note.warn{background:var(--warnbg);color:var(--warn)}
.empty{color:var(--mute)}
#insp{font-size:13px}
.tabs button[hidden]{display:none}
#insp .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}#insp .hd b{font-size:14px}#insp .hd .sp{flex:1}
#insp .x{border:0;background:none;font-size:18px;line-height:1;padding:0 4px;color:var(--mute)}
#insp code,#insp pre{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#insp pre{background:var(--soft);border-radius:6px;padding:7px 9px;margin:6px 0 10px;white-space:pre-wrap;word-break:break-word}
#insp .loc{display:flex;gap:8px;align-items:center;justify-content:space-between}
#insp .prm{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:7px 0;border-top:1px solid var(--soft)}
#insp .prm .k{font-weight:600}#insp .prm .l{color:var(--mute);font-size:12px;grid-column:1/-1}
#insp input[type=number]{width:90px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
#insp textarea{width:100%;min-height:52px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;resize:vertical}
#insp .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#insp .ok{color:var(--good);font-size:12px}
#insp a{color:var(--accent)}
/* floating panels on the 3D view: cut-away, stress legend, compare legend */
.float{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.18);font-size:12.5px;z-index:3}
.float[hidden]{display:none}
.float h3{margin:0 0 6px;font-size:12px;font-weight:650}
.float .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.float .seg button{border:0;border-radius:0;padding:3px 10px}
.float input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 2px}
#cutp{left:12px;top:52px;width:250px}
#slegend,#clegend{left:12px;bottom:34px;width:270px;max-height:calc(100% - 110px);overflow:auto}
.ramp{height:10px;border-radius:5px;margin:4px 0 2px}
.rampl{display:flex;justify-content:space-between;color:var(--mute);font-size:11px}
.prow{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px solid var(--soft);cursor:pointer}
.prow:hover b{color:var(--accent)}
.prow .v{font-variant-numeric:tabular-nums;color:var(--mute)}
.views button[hidden]{display:none}
/* the view menu: camera angles and display toggles in one place, so the bar shows only View, Cut and Stress */
.vwrap{position:relative}
.vmenu{position:absolute;top:calc(100% + 6px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:none;z-index:4;min-width:190px}
.vmenu.open{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.vmenu button{width:100%}
.vmenu .wide{grid-column:1/-1}
.vmenu hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:2px 0}
/* inside Kerf Studio: Studio shows the title, status, checks and print info itself */
.embedded body>header{display:none}
.embedded .tabs [data-tab="print"],.embedded .tabs [data-tab="checks"]{display:none}
/* build it step by step */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lab{position:absolute;transform:translate(10px,-50%);white-space:nowrap;font-size:12px;padding:3px 8px 3px 7px;border-radius:7px;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.18);transition:opacity .25s}
.lab::before{content:"";position:absolute;left:-10px;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.lab b{font-weight:650}.lab span{color:var(--mute)}
.lab.screw,.lab.ins{transform:translate(10px,20%)}
.lab.screw::before{background:#c63d2f}.lab.ins::before{background:#c9a24a}.lab.move::before{background:var(--good)}
#abar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:3;max-width:calc(100% - 24px)}
#abar[hidden]{display:none}
#abar button{white-space:nowrap}
#abar .t{font-size:13px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
#abar .t b{font-variant-numeric:tabular-nums}
#asm .tl{display:flex;gap:3px;margin:2px 0 12px}
#asm .tl button{flex:1;height:8px;padding:0;border-radius:4px;border:0;background:var(--soft);min-width:8px}
#asm .tl button.done{background:color-mix(in srgb,var(--good) 55%,var(--soft))}
#asm .tl button.cur{background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
#asm .ah{display:flex;align-items:baseline;gap:8px}#asm .ah .n{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
#asm h3{margin:2px 0 8px;font-size:17px;letter-spacing:-.01em}
#asm .ctrls{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;align-items:center}
#asm .ctrls .sp{flex:1}
#asm .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#asm .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 4px;cursor:default}
#asm .chip .sw{width:12px;height:12px;border-radius:50%}
#asm .chip.screw .sw{background:#9aa3ad}#asm .chip.ins .sw{background:#c9a24a}#asm .chip.move .sw{background:var(--good)}
#asm .txt{font-size:13px;line-height:1.5}
#asm .txt ul{margin:0 0 8px;padding-left:18px}#asm .txt li{margin:3px 0}#asm .txt li li{color:var(--mute)}
#asm .txt code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:0 4px;border-radius:4px}
#asm .txt h4{margin:12px 0 4px;font-size:13px}
#asm .opt{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:12px;margin:4px 0}
#asm .donebox{display:flex;gap:8px;align-items:center;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--soft);cursor:pointer}
#asm .donebox.on{background:var(--goodbg);color:var(--good)}
#asm .fin{font-size:15px;font-weight:650;color:var(--good)}
@media (max-width:760px){body{display:block}main{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line)}header{padding:10px 16px}.views{left:16px}.legend{display:none}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><span id="status" class="pill"></span>
  <span class="meta" id="meta"></span><span class="sp"></span>
  <button id="theme" title="Switch light/dark">Theme</button>
</header>
<main>
  <div id="stage">
    <div class="views">
      <span class="vwrap"><button id="viewb" title="Camera angle and what to show">View ▾</button>
        <span class="vmenu" id="vmenu"><button data-view="iso">Iso</button><button data-view="front">Front</button><button data-view="right">Right</button>
          <button data-view="top">Top</button><button data-view="fit" class="wide">Fit to window</button><hr>
          <button id="edges" class="on wide" title="Outline edges">Edges</button>
          <button id="keep" class="wide" title="Show keep-out volumes (prop discs, camera view, wire paths)">Keep-outs</button></span></span>
      <button id="cutb" title="Cut the model open to see inside (walls, channels, inserts)">Cut</button>
      <button id="stressb" title="Colour each strength-checked part by how hard its material works" hidden>Stress</button>
    </div>
    <div id="cutp" class="float" hidden><h3>Cut-away</h3>
      <div style="display:flex;gap:8px;align-items:center"><span class="seg" id="cutax"><button data-ax="x">X</button><button data-ax="y" class="on">Y</button><button data-ax="z">Z</button></span>
        <button id="cutflip" title="Keep the other side">⇄ Flip</button><span class="sp"></span></div>
      <input type="range" id="cutpos" min="0" max="1000" value="500"><div class="rampl"><span id="cutval"></span><span>drag to move the cut</span></div></div>
    <div id="slegend" class="float" hidden></div>
    <div id="clegend" class="float" hidden></div>
    <div id="labels"></div>
    <div id="abar" hidden><button id="ab_prev" title="Back (←)">‹ Back</button><button id="ab_play" title="Play every step (space)">▶ Play</button>
      <span class="t" id="ab_t"></span><button id="ab_re" title="Replay this step (R)">↻</button><button id="ab_next" title="Next (→)">Next ›</button></div>
    <div id="tip"></div>
    <div class="legend" id="hint">Drag to orbit, right-drag to pan, scroll to zoom, click a face to inspect it</div>
  </div>
  <aside>
    <nav class="tabs">
      <button data-tab="motion" class="on">Move</button><button data-tab="asm" id="tabAsm" hidden>Build it</button><button data-tab="parts">Parts</button>
      <button data-tab="bom">Shopping list</button><button data-tab="print">Print</button><button data-tab="checks">Checks</button><button data-tab="insp" id="tabInsp" hidden>Inspect</button>
    </nav>
    <section class="pane on" id="motion"></section>
    <section class="pane" id="asm"></section>
    <section class="pane" id="parts"></section>
    <section class="pane" id="bom"></section>
    <section class="pane" id="print"></section>
    <section class="pane" id="checks"></section>
    <section class="pane" id="insp"><p class="empty">Click a part in the 3D view to see which file, line and parameters made that face.</p></section>
  </aside>
</main>
<script>/*KV3*/</script>
<script type="application/json" id="kerf-data">/*DATA*/</script>
<script>
(() => {
const T = window.KV3, D = JSON.parse(document.getElementById('kerf-data').textContent);
if (window.parent !== window) document.documentElement.classList.add('embedded');
const R = D.report, $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// Inside Kerf Studio (same origin) the page can hand an edit request straight to Claude Code ("Do it").
const HOST = (() => { try { return window.parent !== window && window.parent.kerfStudio && window.parent.kerfStudio.edit ? window.parent.kerfStudio : null; } catch (e) { return null; } })();
const ICON = {
  ok: '<svg viewBox="0 0 16 16" width="14" height="14" aria-label="pass"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad: '<svg viewBox="0 0 16 16" width="14" height="14" aria-label="fail"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  plate: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="5" y="5" width="3" height="3" fill="currentColor"/><rect x="9" y="8" width="3" height="3" fill="currentColor"/></svg>' };
const fmt = (x, d = 1) => (x == null || isNaN(x)) ? '–' : Number(x).toFixed(d).replace(/\.0+$/, '');

// ---------- header ----------
$('title').textContent = R.project || 'Assembly';
$('status').textContent = R.ok ? 'PASS' : `FAIL · ${(R.problems || []).length} problem${(R.problems || []).length === 1 ? '' : 's'}`;
$('status').className = 'pill ' + (R.ok ? 'ok' : 'bad');
const printed = D.items.filter(i => i.role === 'printed'), bought = D.items.filter(i => i.role === 'purchased');
const massP = printed.reduce((s, i) => s + ((R.parts || {})[i.id]?.mass_est_g || 0), 0);
const massB = Object.values(R.purchased || {}).reduce((s, p) => s + (p.mass_g || 0) * (p.qty || 1), 0);
// headline mass = the device (printed + bought parts on it); bench items marked off_board are listed apart
const M = R.mass || {device_g: massP + massB, off_board_g: 0};
$('meta').textContent = `${printed.length} printed · ${bought.length} purchased · ~${fmt(M.device_g, 0)} g`
  + (M.off_board_g ? ` (+${fmt(M.off_board_g, 0)} g off the device)` : '') + ` · ${R.printer || ''}`;
let theme = null;
$('theme').onclick = () => { theme = (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = theme; restyle(); };

// ---------- scene ----------
const stage = $('stage');
const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.localClippingEnabled = true;   // the cut-away plane
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = T.SRGBColorSpace;
stage.prepend(renderer.domElement);
const scene = new T.Scene();
scene.add(new T.HemisphereLight(0xffffff, 0x6f7377, 1.9));
const sun = new T.DirectionalLight(0xffffff, 1.7); sun.position.set(1, -1.5, 2.2); scene.add(sun);
const fill = new T.DirectionalLight(0xffffff, 0.55); fill.position.set(-1.4, 1.1, 0.4); scene.add(fill);
const cam = new T.PerspectiveCamera(32, 1, 0.1, 1e6); cam.up.set(0, 0, 1);
const ctl = new T.OrbitControls(cam, renderer.domElement); ctl.enableDamping = true; ctl.dampingFactor = 0.12;
const lo = new T.Vector3(...D.bounds[0]), hi = new T.Vector3(...D.bounds[1]);
const center = lo.clone().add(hi).multiplyScalar(0.5), radius = Math.max(hi.clone().sub(lo).length() / 2, 10);
let grid = null, dirty = true;
const redraw = () => { dirty = true; };
function restyle() {
  scene.background = new T.Color(css('--scene'));
  if (grid) scene.remove(grid);
  const size = Math.ceil(radius * 3 / 10) * 10;
  grid = new T.GridHelper(size, Math.max(4, Math.round(size / 10)), new T.Color(css('--grid1')), new T.Color(css('--grid2')));
  grid.rotation.x = Math.PI / 2; grid.position.set(center.x, center.y, lo.z - 0.01); scene.add(grid);
  for (const g of groups.values()) g.userData.edges.material.color.set(css('--edge'));
  redraw();
}

// Cut-away: one plane, shared by every part's surface and edges. Inside a cut solid you see its back faces: drawn
// darker and hatched, they read as the cut face (a cheap, exact section cap for closed parts).
const cutPlane = new T.Plane(new T.Vector3(0, 0, -1), 0), CLIP = [], CAP = { value: 0 };
function capShader(sh) {
  sh.uniforms.uCut = CAP;
  sh.fragmentShader = 'uniform float uCut;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
    if (uCut > 0.5 && !gl_FrontFacing) { float h = step(0.5, fract((gl_FragCoord.x + gl_FragCoord.y) / 10.0)); diffuseColor.rgb = diffuseColor.rgb * (0.5 + 0.2 * h); }`);
}
const b64 = (s, Type) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Type(u.buffer); };
const groups = new Map(), pickables = [];
for (const it of D.items) {
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(b64(it.verts, Float32Array), 3));
  geo.setIndex(new T.BufferAttribute(b64(it.tris, Uint32Array), 1));
  geo.computeVertexNormals();
  const keep = it.role === 'keepout';
  const mat = new T.MeshStandardMaterial({ color: it.color, roughness: it.role === 'purchased' ? 0.55 : 0.78, metalness: it.role === 'purchased' ? 0.15 : 0.02,
    side: T.DoubleSide, transparent: keep, opacity: keep ? 0.18 : 1, depthWrite: !keep, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, clippingPlanes: CLIP });
  mat.onBeforeCompile = capShader;
  const mesh = new T.Mesh(geo, mat); mesh.userData.id = it.id;
  const edges = new T.LineSegments(new T.EdgesGeometry(geo, 28), new T.LineBasicMaterial({ color: 0x1a1e21, transparent: true, opacity: 0.55, clippingPlanes: CLIP }));
  const g = new T.Group(); g.matrixAutoUpdate = false; g.add(mesh); g.add(edges);
  g.userData = { it, mesh, edges, base: new T.Color(it.color) };
  geo.computeBoundingBox(); g.userData.box = geo.boundingBox;
