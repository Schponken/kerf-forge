name: Desk robot arm
description: >
  A 4-axis desktop arm (base yaw, shoulder, elbow, wrist pitch) on hobby servos with a two-finger gripper on a fifth
  servo. ~260 mm reach, lifts 150 g at full reach with every servo at or under half its stall torque. The turntable
  runs on two 6001 bearings on a 12 mm spindle and is driven through a 36:24 printed gear pair; every arm joint is a
  fork with the servo on one side and an M3 socket-screw pivot (into a heat-set insert) on the other. Bolts (4x M4) or clamps to a desk.
printer: Bambu Lab A2L
supports: allowed
params:
  plate_t: {value: 7, min: 7, max: 8, step: 0.5, label: Side-plate thickness}
  side_gap: {value: 1.5, min: 0.5, max: 2.0, step: 0.1, label: Axial gap between a fork and the link inside it (takes a 4.5-5.5 mm horn; shim with M3 washers)}
  grip_w: {value: 35, min: 34, max: 40, step: 1, label: Gripper body width (across the fork)}
  base_floor: {value: 6, min: 5, max: 8, step: 0.5, label: Base plate thickness}
  gear_w: {value: 8, min: 6, max: 12, step: 1, label: Yaw gear face width}
  gear_m: {value: 1.5, min: 1.5, max: 2.0, step: 0.25, label: Yaw gear module}
  gear_z_tt: {value: 24, min: 20, max: 30, step: 1, label: Turntable gear teeth}
  gear_z_yaw: {value: 36, min: 30, max: 45, step: 1, label: Yaw servo gear teeth}
  brg_lo_z: {value: 20, min: 16, max: 26, step: 1, label: Lower yaw bearing height (bottom face)}
  plat_t: {value: 8, min: 8, max: 10, step: 0.5, label: Turntable platform thickness}
  x_sh: {value: 25, min: 15, max: 35, step: 1, label: Shoulder axis ahead of the yaw axis}
  z_sh: {value: 100, min: 95, max: 120, step: 1, label: Shoulder axis height above the desk}
  L1: {value: 85, min: 80, max: 110, step: 1, label: Shoulder to elbow}
  L2: {value: 80, min: 70, max: 100, step: 1, label: Elbow to wrist}
  link_h: {value: 34, min: 30, max: 40, step: 1, label: Link plate height}
  finger_len: {value: 50, min: 45, max: 60, step: 1, label: Finger length (pivot to tip)}
layout: parts/layout.py
parts:
  base: {file: parts/base.py, material: PETG, print_rot: [0, 0, 0], infill: 0.3, load_axis: Z}
  turntable: {file: parts/turntable.py, material: PETG, print_rot: [180, 0, 0], infill: 0.4, load_axis: Z}
  retainer: {file: parts/retainer.py, material: PETG, print_rot: [0, 0, 0], infill: 1.0,
             assembly_note: "NOW bolt or clamp the base to the desk (4 x M4 / wood screws, or C-clamps on the rear pad): the front holes at x = 30 are still reachable because the platform ends at x = 15 and the yokes are not on yet. Taking the turntable out later means unbolting the base first (bearing bore and retainer screw are under it)"}
  yaw_gear: {file: parts/yaw_gear.py, material: PETG, print_rot: [0, 0, 0], infill: 0.5}
  yoke_r: {file: parts/yoke_r.py, material: PETG, print_rot: [-90, 0, 0], infill: 0.4, load_axis: Z}
  yoke_l: {file: parts/yoke_l.py, material: PETG, print_rot: [90, 0, 0], infill: 0.4, load_axis: Z}
  upper_arm: {file: parts/upper_arm.py, material: PETG, print_rot: [90, 0, 0], infill: 0.3, load_axis: X}
  forearm: {file: parts/forearm.py, material: PETG, print_rot: [90, 0, 0], infill: 0.3, load_axis: X}
  gripper: {file: parts/gripper.py, material: PETG, print_rot: [90, 0, 0], infill: 0.3, load_axis: X}
  finger: {file: parts/finger.py, material: PETG, print_rot: [0, 0, 0], infill: 0.4, load_axis: X}
  cable_mast: {file: parts/cable_mast.py, material: PETG, print_rot: [90, 0, 0], infill: 0.3, load_axis: Z}
  psu_hood: {file: parts/psu_hood.py, material: PETG, print_rot: [0, -90, 0], infill: 0.3,
             assembly_note: "on the bench, BEFORE the hood goes on the supply: press the two M3 inserts into the bosses behind the end wall, fit the inlet (next step; its flange screws take at most 0.5 N*m), push the three mains jumpers' receptacles onto its L / N / PE tabs and clamp their ferrules in the supply's AC/L, AC/N and FG terminals (WIRING.md), and the two DC pairs in its +V/-V terminals; feed the DC pairs out through the hood's side exit and tie them to its floor bridge (the bridge cannot be reached once the hood is seated); then slide the hood over the terminal end and fit the side screw"}
purchased:
  brg_lo: {catalog: bearings.6001, proxy: bearing}
  brg_hi: {catalog: bearings.6001, proxy: bearing}
  yaw_servo: {catalog: servos.MG996R, proxy: servo, groups: {tabs: yaw_servo}, tab_screws_from: bottom, range: [-61, 61]}
  yaw_horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: yaw_horn}}
  sh_servo: {catalog: servos.DS3225, proxy: servo, groups: {tabs: sh_servo}, tab_screws_from: bottom, range: [-60, 60]}
  sh_horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: sh_horn}}
  el_servo: {catalog: servos.DS3218, proxy: servo, groups: {tabs: el_servo}, tab_screws_from: bottom, range: [-60, 60]}
  el_horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: el_horn}}
  wr_servo: {catalog: servos.MG996R, proxy: servo, groups: {tabs: wr_servo}, tab_screws_from: bottom, range: [-75, 75]}
  wr_horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: wr_horn}}
  gr_servo: {catalog: servos.MG996R, proxy: servo, groups: {tabs: gr_servo}, tab_screws_from: bottom, range: [0, 65]}
  gr_horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: gr_horn}}
  # electrics (DESIGN.md 'Electrics'): 5 V 18 A supply -> two WAGO lever buses (+ and - each) -> every servo's red/brown;
  # Arduino Nano on USB -> I2C -> PCA9685 driver on the base post -> every servo's signal (orange)
  driver: {catalog: boards.pca9685_adafruit, proxy: board, groups: {holes: driver}}
  nano: {catalog: boards.arduino_nano, proxy: board}
  # supply frame (box proxy, origin at the bottom centre): the terminal-block end is at x = -64.5 (catalog datum x = 0),
  # the datasheet y = 0 side (tapped side holes) at y = -48.5; DC pins 4-7 sit at datum y 23.5-52 (y -25..3.5 here)
  psu: {catalog: electronics.supplies.meanwell_lrs100_5, proxy: box, color: "#9aa0a6",
        joints: {term_end: [-64.5, 0, 0], dc: [-57.2, -11, 25]},
        sites: [{group: psu_side, screw: M3, at: [-32.5, -48.5, 15], dir: [0, -1, 0], engage: 5.0, min_engage: 3.0}],
        note: "screw it to the desk or a board through its base holes; the hood closes its terminal end"}
  # catalog panel range 2.5-8 mm; flange holes d3.4 on 56 mm -> M3
  iec_inlet: {catalog: electronics.connectors.iec_inlet_fused_switched_schurter_dd11, proxy: panel_module, screw: M3,
              groups: {holes: inlet}, note: "fused (2 x T3.15 A) and switched mains inlet in the PSU hood's end wall"}
  bus_arm: {catalog: electronics.connectors.wago_221_415, proxy: box, qty: 2, color: "#e8e8e8",
            note: "two splices (+5 V and GND): supply in, shoulder/elbow/wrist/grip servo red (or brown) out"}
  bus_yaw: {catalog: electronics.connectors.wago_221_415, proxy: box, qty: 2, color: "#e8e8e8",
            note: "two splices (+5 V and GND): supply in, yaw servo out, PCA9685 GND reference out"}
bom_extra:
  - {type: fastener, item: "M4 screws or 4 mm wood screws (desk mounting), or two small C-clamps on the rear pad", qty: 4, spec: "length = 6 mm base + desk; the base holes are 4.5 mm"}
  - {type: hardware, item: Medium-strength threadlocker, qty: 1, spec: "a small drop on the thread TIP of the three M3 pivot screws only, where it sits in the brass insert; keep it off the printed bores (anaerobic threadlocker can stress-crack PETG)"}
  - {type: hardware, item: "M3 flat washer (ISO 7089, 3.2 x 7 x 0.5)", qty: 9, spec: "up to 3 per pivot, between the fork and the link, to take up the 1.5 mm side gap", price_key: "washer:M3"}
  - {type: hardware, item: "USB-A to mini-B cable 1.8 m (SparkFun CAB-11301)", qty: 1, spec: "PC to the Arduino Nano (A000005 is mini-B)", price_key: electronics.cables.usb_mini_b_6ft_sparkfun_cab11301}
  - {type: hardware, item: "Cable ties 2.5 mm", qty: 10, spec: "lead bundle at the cable mast, base post, link slot pairs"}
assembly:
  root: base
  joints:
    - {parent: base.brg_lo, child: brg_lo.face}
    - {parent: base.brg_hi, child: brg_hi.face}
    - {parent: base.yaw_servo_seat, child: yaw_servo.tabs}
    - {parent: yaw_servo.output, child: yaw_horn.spline, name: yaw_drive, range: [-61, 61]}
    - {parent: yaw_horn.face, child: yaw_gear.mount}
    - {parent: base.yaw, child: turntable.origin, name: base_yaw, range: [-90, 90]}
    - {parent: turntable.retainer_seat, child: retainer.origin}
    - {parent: turntable.yoke_r_seat, child: yoke_r.origin}
    - {parent: turntable.yoke_l_seat, child: yoke_l.origin}
    - {parent: turntable.mast_seat, child: cable_mast.origin}
    - {parent: base.driver_seat, child: driver.bottom}
    - {parent: base.desk_nano, child: nano.bottom}
    - {parent: base.desk_psu, child: psu.bottom}
    - {parent: psu.term_end, child: psu_hood.origin}
    - {parent: psu_hood.inlet, child: iec_inlet.panel}
    - {parent: base.desk_bus_arm, child: bus_arm.bottom}
    - {parent: base.desk_bus_yaw, child: bus_yaw.bottom}
    - {parent: yoke_r.servo_seat, child: sh_servo.tabs}
    - {parent: sh_servo.output, child: sh_horn.spline, name: shoulder, range: [-60, 60]}
    - {parent: sh_horn.face, child: upper_arm.horn_mount}
    - {parent: upper_arm.servo_seat, child: el_servo.tabs}
    - {parent: el_servo.output, child: el_horn.spline, name: elbow, range: [-60, 60]}
    - {parent: el_horn.face, child: forearm.horn_mount}
    - {parent: forearm.servo_seat, child: wr_servo.tabs}
    - {parent: wr_servo.output, child: wr_horn.spline, name: wrist, range: [-75, 75]}
    - {parent: wr_horn.face, child: gripper.horn_mount}
    - {parent: gripper.servo_seat, child: gr_servo.tabs}
    - {parent: gr_servo.output, child: gr_horn.spline, name: grip, range: [0, 65], home: 0}
    - {parent: gr_horn.face, child: finger.horn_mount}
  # DESIGN.md 'Assembly order': the turntable and its retainer go in while the base is still loose (bearing bore and
  # retainer screw are reached from under the base), THEN the base is bolted to the desk, then the yokes and the arm
  order: [base, brg_lo, brg_hi, yaw_servo, yaw_horn, yaw_gear, turntable, retainer, cable_mast, yoke_r, sh_servo, sh_horn,
          upper_arm, el_servo, el_horn, forearm, wr_servo, wr_horn, gripper, gr_servo, gr_horn, finger, yoke_l, driver,
          psu, psu_hood, iec_inlet, bus_arm, bus_yaw, nano]
  allow_overlap:
    - {pair: [turntable, brg_hi], max_mm3: 1.0, why: "0.3 mm fillet at the spindle step sits in the 6001 inner race's 0.3 mm edge chamfer (the proxy has square edges)"}
  sweeps:
    - {joint: yaw_drive, follows: base_yaw, ratio: -0.66666}
electrical:
  supply: psu                # mains supply: rated by its 18 A, no run time
  burst_s: 5                 # all five servos stalled together for 5 s (worst case), for wire heating
  supply_v: 5.4              # LRS output trimmed up with its SVR pot (4.5-5.5 V; reached through the hood top): covers the lead drop at stall
  mains: {inlet: iec_inlet, fuse: electronics.fuses.littelfuse_215_t3_15a, cord: electronics.cords.iec_c13_cord_us_18awg,
          wire: electronics.wire_misc.mains_wire_18awg_ul1015, tab_receptacle: electronics.connectors.fdisc_187_insulated_18awg,
          jumper_mm: 100, input_v: 115}
wiring:      # servo runs are each servo's own 300 mm lead + an extension (lead:), length-checked at every joint pose
  # supply DC (+V/-V screw pins, ferrules) out of the hood to the two WAGO bus pairs; the hood ties the bundle to its floor
  - {id: psu_arm, from: psu.dc, to: bus_arm, v: 5.4, gauge: 16, color: red/black, length_mm: 380, route: [psu_hood.dc_tie, psu_hood.dc_exit, [-301.5, -62, 4], [-130, -62, 4], [-130, -5, 4]],
     note: "supply +V/-V (one pin pair) to the arm bus splices"}
  - {id: psu_yaw, from: psu.dc, to: bus_yaw, v: 5.4, gauge: 16, color: red/black, length_mm: 360, route: [psu_hood.dc_tie, psu_hood.dc_exit, [-301.5, -62, 4], [-130, -62, 4]],
     note: "second +V/-V pin pair to the yaw bus splices"}
  # each servo: red + brown from the bus (5 A blade fuse in the red at the bus), orange on to the PCA9685 channel pin
  - {id: pwr_sh, from: bus_arm, to: sh_servo, v: 5.4, gauge: 22, color: red/brown, lead: [sh_servo, electronics.wire_misc.servo_ext_300_pololu2184], fuse: electronics.fuses.ato_5a_littelfuse_257005, fuse_holder: electronics.fuses.ato_holder_littelfuse_fhac0001zxj,
     ends: {from: lever, to: plug}, route: [[-112, -5, 15], [-114, -18, 30], [-114, -18, 135.5], base.cable_post, cable_mast.cable_top, yoke_r.lead_top],
     note: "up behind the driver, over the post top to the mast, outside the upper arm's plate A"}
  - {id: pwr_el, from: bus_arm, to: el_servo, v: 5.4, gauge: 22, color: red/brown, lead: [el_servo, electronics.wire_misc.servo_ext_300_pololu2184], fuse: electronics.fuses.ato_5a_littelfuse_257005, fuse_holder: electronics.fuses.ato_holder_littelfuse_fhac0001zxj,
     ends: {from: lever, to: plug}, route: [[-112, -5, 15], [-114, -18, 30], [-114, -18, 135.5], base.cable_post, cable_mast.cable_top, upper_arm.lead_1, upper_arm.lead_2], note: "tied through the upper arm's slot pair"}
  - {id: pwr_wr, from: bus_arm, to: wr_servo, v: 5.4, gauge: 22, color: red/brown, lead: [wr_servo, electronics.wire_misc.servo_ext_600_pololu2185], fuse: electronics.fuses.ato_5a_littelfuse_257005, fuse_holder: electronics.fuses.ato_holder_littelfuse_fhac0001zxj,
     ends: {from: lever, to: plug}, route: [[-112, -5, 15], [-114, -18, 30], [-114, -18, 135.5], base.cable_post, cable_mast.cable_top, upper_arm.lead_1, upper_arm.lead_2, forearm.lead_1, forearm.lead_2], note: "tied through the upper arm and forearm slot pairs"}
  - {id: pwr_gr, from: bus_arm, to: gr_servo, v: 5.4, gauge: 22, color: red/brown, lead: [gr_servo, electronics.wire_misc.servo_ext_600_pololu2185], fuse: electronics.fuses.ato_5a_littelfuse_257005, fuse_holder: electronics.fuses.ato_holder_littelfuse_fhac0001zxj,
     ends: {from: lever, to: plug}, route: [[-112, -5, 15], [-114, -18, 30], [-114, -18, 135.5], base.cable_post, cable_mast.cable_top, upper_arm.lead_1, upper_arm.lead_2, forearm.lead_1, forearm.lead_3, forearm.lead_4, gripper.lead_1, gripper.lead_2],
     note: "tied through the upper arm and forearm slot pairs"}
  - {id: pwr_yaw, from: bus_yaw, to: yaw_servo, v: 5.4, gauge: 22, color: red/brown, lead: [yaw_servo, electronics.wire_misc.servo_ext_300_pololu2184], fuse: electronics.fuses.ato_5a_littelfuse_257005, fuse_holder: electronics.fuses.ato_holder_littelfuse_fhac0001zxj,
     ends: {from: lever, to: plug}, route: [[-112, -37, 15], [-112, -53, 1.5], base.yaw_lead_out, base.yaw_lead_in, base.yaw_boss],
     note: "from the boss down into the open pocket and out under the plate in its underside groove (laid in from below before the base is bolted down)"}
  - {id: sig_sh, from: driver, to: sh_servo, kind: signal, gauge: 22, color: orange, lead: pwr_sh, ends: {from: crimp, to: plug},
     route: [[-114, -18, 95], [-114, -18, 135.5], base.cable_post, cable_mast.cable_top, yoke_r.lead_top], note: "PCA9685 channel 1, signal (PWM) pin; the housing's V+ and GND slots stay empty"}
  - {id: sig_el, from: driver, to: el_servo, kind: signal, gauge: 22, color: orange, lead: pwr_el, ends: {from: crimp, to: plug},
     route: [[-114, -18, 95], [-114, -18, 135.5], base.cable_post, cable_mast.cable_top, upper_arm.lead_1, upper_arm.lead_2], note: "channel 2"}
  - {id: sig_wr, from: driver, to: wr_servo, kind: signal, gauge: 22, color: orange, lead: pwr_wr, ends: {from: crimp, to: plug},
     route: [[-114, -18, 95], [-114, -18, 135.5], base.cable_post, cable_mast.cable_top, upper_arm.lead_1, upper_arm.lead_2, forearm.lead_1, forearm.lead_2], note: "channel 3"}
  - {id: sig_gr, from: driver, to: gr_servo, kind: signal, gauge: 22, color: orange, lead: pwr_gr, ends: {from: crimp, to: plug},
     route: [[-114, -18, 95], [-114, -18, 135.5], base.cable_post, cable_mast.cable_top, upper_arm.lead_1, upper_arm.lead_2, forearm.lead_1, forearm.lead_3, forearm.lead_4, gripper.lead_1, gripper.lead_2], note: "channel 4"}
  - {id: sig_yaw, from: driver, to: yaw_servo, kind: signal, gauge: 22, color: orange, lead: pwr_yaw, ends: {from: crimp, to: plug},
     route: [[-114, -20, 95], [-128, -20, 30], [-128, -58, 2], [-60, -58, 2], base.yaw_lead_out, base.yaw_lead_in, base.yaw_boss], note: "channel 0"}
  - {id: gnd_ref, from: bus_yaw, to: driver, kind: signal, gauge: 22, color: black, length_mm: 150, ends: {from: lever, to: crimp},
     route: [[-112, -37, 15], [-114, -20, 30], [-114, -20, 95]],
     note: "supply GND to a GND pin of the PCA9685 (channel 15's GND): the servo signals need a common ground (the driver's V+ terminal stays unused)"}
  - {id: i2c, from: nano, to: driver, kind: signal, gauge: 26, conductors: 4, color: red/black/blue/yellow, length_mm: 150,
     ends: {from: crimp, to: crimp}, route: [[-125, 40, 12], [-114, 20, 30], [-114, 20, 95]],
     note: "Nano 5V/GND/A4 (SDA)/A5 (SCL) to the PCA9685 side header VCC/GND/SDA/SCL (two 1x3 housings: GND-OE-SCL and SDA-VCC-V+, OE and V+ empty); the Nano runs from the PC's USB"}
requirements:
  - {id: torque_shoulder, check: static_torque, joint: shoulder, actuator: sh_servo, payload_g: 150, payload_at: gripper.tcp,
     max_fraction: 0.5, poses: [{}, {shoulder: -60}, {shoulder: -30}, {shoulder: 30}, {shoulder: 60}, {elbow: 60}, {elbow: -60}],
     why: "hold 150 g at the tcp with the arm stretched out horizontally (pose {}) using at most half the DS3225's stall torque"}
  - {id: torque_elbow, check: static_torque, joint: elbow, actuator: el_servo, payload_g: 150, payload_at: gripper.tcp,
     max_fraction: 0.5, poses: [{}, {elbow: -60}, {elbow: 60}, {shoulder: 60, elbow: -60}, {wrist: 75}, {wrist: -75}],
     why: "same for the elbow (DS3218), forearm horizontal included"}
  - {id: torque_wrist, check: static_torque, joint: wrist, actuator: wr_servo, payload_g: 150, payload_at: gripper.tcp,
     max_fraction: 0.5, poses: [{}, {wrist: -75}, {wrist: 75}, {grip: 65}],
     why: "same for the wrist (MG996R), gripper horizontal included"}
  - {id: reach, check: distance, a: upper_arm.shoulder_ref, b: gripper.tcp, min_mm: 230, max_mm: 300, pose: {},
     why: "about 250 mm reach, measured square to the shoulder axis with the arm stretched out"}
  - {id: grip_open, check: distance, a: finger.tip, b: gripper.fixed_tip, min_mm: 40, pose: {grip: 65},
     why: "the open gripper takes a 40 mm object"}
  - id: upper_arm_fea
    check: fea_static
    part: upper_arm
    why: "2x the worst static load at the elbow (report masses after ENG-6: 359 g beyond the elbow incl. the 150 g payload, 2x = 7.0 N, rounded up for the leads/screws to 8.4 N = 4.2 N on the servo tabs + 4.2 N on the pivot, and 2 x 4.46 kg*cm torque_elbow = 875 -> 900 N*mm) with the shoulder end held; tip deflection <= 1% of L1"
    direction: xy            # printed on edge: the plates' bending stress runs along the layers
    sf: 2.0
    max_disp_mm: 0.85
    fixed:                   # plate A on the shoulder horn screws; plate B only on its pivot bore (the heat-set insert on the screw)
      any:
        - {sites: sh_horn, radius: 4.0}
        - {cylinder: {at: [0, 0, "w_u"], dir: [0, 0, -1], r: 2.0, tol: 0.3, span: [0, "plate_t + 3"]}}
    loads:
      - {sites: el_servo, radius: 4.0, force_n: [0, -4.2, 0]}
      - {box: [["L1 - 4", -4, "w_u - plate_t - 0.1"], ["L1 + 4", 4, "w_u + 0.1"]], force_n: [0, -4.2, 0]}
      - {sites: el_servo, radius: 4.0, torque_nmm: 900, axis: {at: ["L1", 0, 0], dir: [0, 0, 1]}}
  - id: forearm_fea
    check: fea_static
    part: forearm
    why: "2x the worst static load at the wrist (245 g beyond it incl. the payload, 2x = 4.8 N, rounded up to 6.0 N = 3.0 N on each of the two sites, and 2 x 1.91 kg*cm torque_wrist = 375 -> 380 N*mm) with the elbow end held; deflection <= 1% of L2"
    direction: xy
    sf: 2.0
    max_disp_mm: 0.8
    fixed:                   # plate A on the elbow horn screws; plate B only on its pivot bore
      any:
        - {sites: el_horn, radius: 4.0}
        - {cylinder: {at: [0, 0, "w_f"], dir: [0, 0, -1], r: 2.0, tol: 0.3, span: [0, "plate_t + 3"]}}
    loads:
      - {sites: wr_servo, radius: 4.0, force_n: [0, -3.0, 0]}
      - {box: [["L2 - 4", -4, "w_f - plate_t - 0.1"], ["L2 + 4", 4, "w_f + 0.1"]], force_n: [0, -3.0, 0]}
      - {sites: wr_servo, radius: 4.0, torque_nmm: 380, axis: {at: ["L2", 0, 0], dir: [0, 0, 1]}}
  - id: yoke_r_fea
    check: fea_static
    part: yoke_r
    why: "the shoulder servo stalls (21 kg*cm reaction through its four tab screws) while carrying half of 2x the arm + payload weight (487 g beyond the shoulder incl. the payload: half of 2x = 4.8 N, rounded up to 6.3 N per yoke); feet bolted"
    direction: z             # the foot prints standing up: judge the cheek-foot corner against layer strength
    sf: 3.0
    max_disp_mm: 0.5
    fixed: {sites: yoke_r_foot, radius: 4.0}
    loads:
      - {sites: sh_servo, radius: 4.0, torque_nmm: "sh_stall_nmm", axis: {at: ["x_sh", 0, "z_sh"], dir: [0, 1, 0]}}
      - {sites: sh_servo, radius: 4.0, force_n: [0, 0, -6.3]}
  - id: yoke_l_fea
    check: fea_static
    part: yoke_l
    why: "the pivot side carries half of 2x the arm + payload weight; feet bolted"
    direction: z
    sf: 3.0
    max_disp_mm: 0.3
    fixed: {sites: yoke_l_foot, radius: 4.0}
    loads:
      - {box: [["x_sh - 4", "-cheek_out - 0.1", "z_sh - 4"], ["x_sh + 4", "-cheek_in + 0.1", "z_sh + 4"]], force_n: [0, 0, -6.3]}
  - id: gripper_fea
    check: fea_static
    part: gripper
    why: "the grip servo stalls with the finger closed on the fixed jaw: 9.4 kg*cm / 50 mm = 18.4 N on the jaw tip, reacted at the servo tabs"
    direction: z             # the jaw post bends across layers (printed on edge)
    sf: 3.0
    max_disp_mm: 1.0
    fixed: {sites: gr_servo, radius: 4.0}
    loads:
      - {near_joint: fixed_tip, radius: 5.0, force_n: [0, 0, 18.4]}
  - id: finger_fea
    check: fea_static
    part: finger
    why: "the moving finger pressed on the jaw at stall: 18.4 N at the tip, horn screws held"
    direction: xy
    sf: 2.0
    max_disp_mm: 1.0
    fixed: {sites: gr_horn, radius: 4.0}
    loads:
      - {near_joint: tip, radius: 5.0, force_n: [0, 18.4, 0]}
  - id: turntable_fea
    check: fea_static
    part: turntable
    why: "2x the arm + payload (602 g on the turntable incl. the 150 g payload: 2x = 11.8 N, rounded up to 13.8 N for the leads, screws and cable bundle; 6.9 N per yoke foot group) and 2x its tipping moment (8.21 kg*cm torque_shoulder + the arm weight 2.5 cm behind it ~ 0.90 N*m static -> 1.8 N*m) about Y as 2 x 980 N*mm couples (the 13.8 N acting at the foot-screw centroid x = -11 takes ~150 N*mm back off, so the net is ~1.8 N*m); spindle held only where the two bearings touch it"
    direction: z             # the spindle prints vertically: its bending stress runs across layers
    sf: 3.0
    max_disp_mm: 0.3
    fixed:
      any:
        - {cylinder: {at: [0, 0, "z_blo"], dir: [0, 0, 1], r: "(brg_d - 0.05) / 2", tol: 0.3, span: [0, "brg_B"]}}
        - {cylinder: {at: [0, 0, "z_bhi"], dir: [0, 0, 1], r: "(brg_d - 0.05) / 2", tol: 0.3, span: [0, "brg_B"]}}
        - {box: [[-7.6, -7.6, "z_tt - 0.01"], [7.6, 7.6, "z_tt + 0.01"]]}     # collar resting on the upper inner race
    loads:
      - {sites: yoke_r_foot, radius: 4.0, force_n: [0, 0, -6.9]}
      - {sites: yoke_l_foot, radius: 4.0, force_n: [0, 0, -6.9]}
      - {sites: yoke_r_foot, radius: 4.0, torque_nmm: 980, axis: {at: [0, 0, "z_plat1"], dir: [0, 1, 0]}}
      - {sites: yoke_l_foot, radius: 4.0, torque_nmm: 980, axis: {at: [0, 0, "z_plat1"], dir: [0, 1, 0]}}
  - id: base_fea
    check: fea_static
    part: base
    why: "the bearing tower carries 2x the arm's tipping moment (1.8 N*m) as a +-72 N couple on the two 6001 seats 25 mm apart, 2x the arm weight (13.8 N) on the upper seat's floor, and the yaw servo at stall: its 9.4 kg*cm reacted through the 4 tab screws plus the 34 N gear-mesh force (922 N*mm / 27 mm pitch radius) on the shelf and on the upper bearing; base bolted down at its 4 M4 holes"
    direction: z             # the tower prints upright: its bending stress runs across layers
    sf: 3.0
    max_disp_mm: 0.3
    mesh_size: 4.0           # the default (smallest bbox side / 4 = 25 mm) cannot resolve the 28 mm bearing bores
    fixed:
      any:
        - {box: [[-94, -46, -0.01], [-82, -34, 0.01]]}
        - {box: [[-94, 34, -0.01], [-82, 46, 0.01]]}
        - {box: [[24, -46, -0.01], [36, -34, 0.01]]}
        - {box: [[24, 34, -0.01], [36, 46, 0.01]]}
    loads:
      - {cylinder: {at: [0, 0, "z_bhi"], dir: [0, 0, 1], r: "brg_D / 2", tol: 0.3, span: [0, "brg_B"]}, bearing_n: [72, -34, 0]}
      - {cylinder: {at: [0, 0, "z_blo"], dir: [0, 0, 1], r: "brg_D / 2", tol: 0.3, span: [0, "brg_B"]}, bearing_n: [-72, 0, 0]}
      - {box: [["-brg_D / 2", "-brg_D / 2", "z_bhi - 0.05"], ["brg_D / 2", "brg_D / 2", "z_bhi + 0.05"]], force_n: [0, 0, -13.8]}
      - {sites: yaw_servo, radius: 4.0, torque_nmm: "yaw_stall_nmm", axis: {at: ["-yaw_c", 0, 0], dir: [0, 0, 1]}}
      - {sites: yaw_servo, radius: 4.0, force_n: [0, 34, 0]}
  - id: upper_arm_stall_fea
    check: fea_static
    part: upper_arm
    why: "fault case (a crash into the desk or an obstacle): the elbow servo at STALL (19 kg*cm) on its tab screws plus 2x the static elbow load; strength only, the 1 % deflection rule is for the working load (upper_arm_fea)"
    direction: xy
    case: crash              # a fault case: ENGINEERING.md s3 asks SF 3
    sf: 3.0
    max_disp_mm: 2.0
    fixed:
      any:
        - {sites: sh_horn, radius: 4.0}
        - {cylinder: {at: [0, 0, "w_u"], dir: [0, 0, -1], r: 2.0, tol: 0.3, span: [0, "plate_t + 3"]}}
    loads:
      - {sites: el_servo, radius: 4.0, force_n: [0, -4.2, 0]}
      - {box: [["L1 - 4", -4, "w_u - plate_t - 0.1"], ["L1 + 4", 4, "w_u + 0.1"]], force_n: [0, -4.2, 0]}
      - {sites: el_servo, radius: 4.0, torque_nmm: "el_stall_nmm", axis: {at: ["L1", 0, 0], dir: [0, 0, 1]}}
  - id: forearm_stall_fea
    check: fea_static
    part: forearm
    why: "fault case: the wrist servo at STALL (9.4 kg*cm) on its tab screws plus 2x the static wrist load; strength only (forearm_fea is the working-load deflection check)"
    direction: xy
    case: crash              # a fault case: ENGINEERING.md s3 asks SF 3
    sf: 3.0
    max_disp_mm: 2.0
    fixed:
      any:
        - {sites: el_horn, radius: 4.0}
        - {cylinder: {at: [0, 0, "w_f"], dir: [0, 0, -1], r: 2.0, tol: 0.3, span: [0, "plate_t + 3"]}}
    loads:
      - {sites: wr_servo, radius: 4.0, force_n: [0, -3.0, 0]}
      - {box: [["L2 - 4", -4, "w_f - plate_t - 0.1"], ["L2 + 4", 4, "w_f + 0.1"]], force_n: [0, -3.0, 0]}
      - {sites: wr_servo, radius: 4.0, torque_nmm: "mg_stall_nmm", axis: {at: ["L2", 0, 0], dir: [0, 0, 1]}}
  - id: cable_loop
    check: channel_clear
    path: [{item: cable_mast, at: cable_top}, {item: base, at: cable_post}]
    diameter: 5.0
    poses: [{base_yaw: -90}, {base_yaw: -45}, {base_yaw: 45}, {base_yaw: 90}, {base_yaw: -90, shoulder: -60}, {base_yaw: 90, shoulder: -60},
            {base_yaw: -90, shoulder: 60}, {base_yaw: 90, shoulder: 60}, {shoulder: -60, elbow: -60}]
    why: "the servo-lead bundle (4 leads, ~5 mm incl. clearance) from the turntable's cable mast to the base cable post stays clear of every part over the full yaw range, with the arm stretched out or raised"
  - {id: power, check: power_budget, why: "supply, buses and every wire within rating with all five servos stalled together"}
  - {id: usb_access, check: connector_access, item: nano, direction: [1, 0, 0], length_mm: 30,
     why: "the USB cable reaches the Nano to load the sketch"}
  - {id: mains_access, check: connector_access, item: iec_inlet, direction: [0, 0, 1], length_mm: 50,
     why: "the C13 cord plugs into the inlet (plug + cord bend) with the hood on the supply"}
  - {id: arm_mass, check: mass_max, max_g: 900, include: [base, turntable, retainer, yaw_gear, yoke_r, yoke_l, upper_arm, forearm, gripper, finger, cable_mast, brg_lo, brg_hi, yaw_servo, yaw_horn, sh_servo, sh_horn, el_servo, el_horn, wr_servo, wr_horn, gr_servo, gr_horn, driver], why: "the arm on its base (the supply, buses and Nano sit on the desk); also the torque budget"}
