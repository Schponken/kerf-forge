name: TVC coax rocket drone
description: >
  A rocket-style thrust-vectoring drone (fd.iwth / Mistral layout): a 3-rod carbon mast with printed rings, the 6S
  battery on top, a counter-rotating pair of 2207 motors with 5.1" props on a two-axis gimbal at the bottom driven
  directly by two MG90S servos (free steel pins on the opposite sides), and three splayed printed legs.
printer: Bambu Lab A2L
supports: allowed
params:
  ring_r_in: {value: 72, min: 70, max: 80, step: 0.5, label: Gimbal outer ring inner radius (props are 65.9)}
  ring_r_out: {value: 82, min: 76, max: 88, step: 0.5, label: Gimbal outer ring outer radius}
  ring_h: {value: 17, min: 8, max: 22, step: 0.5, label: Gimbal outer ring height (pads match it)}
  lug_out: {value: 2, min: 1, max: 4, step: 0.5, label: Roll horn lug beyond the ring}
  hub_t: {value: 8, min: 8, max: 10, step: 0.5, label: Motor hub / motor plate thickness}
  hub_r: {value: 27, min: 24, max: 30, step: 0.5, label: Motor hub disc radius}
  ring_low_z: {value: 75, min: 68, max: 90, step: 1, label: Underside of the lower mast ring above the gimbal centre}
  rod_len: {value: 228, min: 150, max: 300, step: 1, label: Carbon mast tube length}
  rod_r: {value: 30, min: 26, max: 36, step: 0.5, label: Mast tube circle radius}
  mid_z: {value: 186, min: 120, max: 260, step: 1, label: Middle ring underside height}
  foot_r: {value: 150, min: 110, max: 170, step: 1, label: Foot radius from the thrust axis}
  ground_z: {value: -85, min: -110, max: -70, step: 1, label: Ground below the gimbal centre}
  leg_r0: {value: 72, min: 66, max: 80, step: 0.5, label: Leg attachment radius}
  batt_dx: {value: -24.5, min: -30, max: 15, step: 0.5, label: Battery offset x (CG trim)}
  batt_dy: {value: -10, min: -15, max: 15, step: 0.5, label: Battery offset y (CG trim)}
layout: parts/layout.py
parts:
  ring_low: {file: parts/ring_low.py, material: PETG, print_rot: [180, 0, 0], infill: 0.2, load_axis: z}
  gimbal_outer: {file: parts/gimbal_outer.py, material: PETG, print_rot: [0, 0, 0], infill: 0.2, load_axis: [x, y]}
  motor_hub: {file: parts/motor_hub.py, material: PETG, print_rot: [180, 0, 0], infill: 0.5, load_axis: y}
  motor_plate: {file: parts/motor_plate.py, material: PETG, print_rot: [0, 0, 0], infill: 0.5, load_axis: [x, y]}
  ring_mid: {file: parts/ring_mid.py, material: PETG, print_rot: [180, 0, 0], infill: 0.3, load_axis: [x, y]}
  ring_top: {file: parts/ring_top.py, material: PETG, print_rot: [180, 0, 0], infill: 0.3, load_axis: [x, y]}
  leg_1: {file: parts/leg.py, material: PETG, print_rot: [90, 0, 0], infill: 0.25, load_axis: [x, z]}
  leg_2: {file: parts/leg.py, material: PETG, print_rot: [90, 0, 0], infill: 0.25, load_axis: [x, z]}
  leg_3: {file: parts/leg.py, material: PETG, print_rot: [90, 0, 0], infill: 0.25, load_axis: [x, z]}
purchased:
  servo_roll: {catalog: servos.MG90S, proxy: servo, groups: {tabs: yoke_servo}, range: [-15, 15]}
  servo_pitch: {catalog: servos.MG90S, proxy: servo, groups: {tabs: ring_servo}, range: [-15, 15]}
  horn_roll: {catalog: servo_horns.aluminum_micro_21T, proxy: horn, groups: {holes: roll_horn}}
  horn_pitch: {catalog: servo_horns.aluminum_micro_21T, proxy: horn, groups: {holes: pitch_horn}}
  motor_top: {catalog: drone.motors.2207_1855kv_6s, proxy: motor, groups: {mount: hub_motor_top}}
  motor_bottom: {catalog: drone.motors.2207_1855kv_6s, proxy: motor, groups: {mount: plate_motor_bottom}}
  rod_1: {catalog: rods.cf_tube_5x3, proxy: rod, length: 228}
  rod_2: {catalog: rods.cf_tube_5x3, proxy: rod, length: 228}
  rod_3: {catalog: rods.cf_tube_5x3, proxy: rod, length: 228}
  stack: {catalog: drone.stacks.fc_20, proxy: stack, groups: {holes: mid_stack}}
  pad: {catalog: electronics.pads.battery_pad, proxy: box, size: [70, 38, 3], color: "#303030",
        note: "anti-slip pad cut to 70 x 38 mm under the pack"}
  battery: {catalog: drone.batteries.6S_1100, proxy: box, color: "#c8a400", joints: {strap: [5, 0, 31]}}
  strap: {catalog: electronics.straps.strap_20x250, proxy: box, size: [20, 44, 1.8], color: "#404040",
          note: "over the pack across its width, down through the two ring_top slots, under the plate; modelled as its top run"}
  xt60: {catalog: drone.connectors.XT60, proxy: box, color: "#d8b000",
         note: "male, on a short 14 AWG pigtail tied to ring_top; hangs just past the plate edge between two tubes so it is held by hand to plug/unplug"}
  bec: {catalog: electronics.becs.ubec_5v_3a, proxy: box, color: "#303060",
        note: "servo supply (5 V jumper), cable-tied under ring_mid; fed from the ESC battery pads"}
  receiver: {catalog: electronics.receivers.elrs_nano, proxy: box, color: "#205020",
             note: "heat-shrunk, cable-tied under ring_mid; T antenna along a tube, clear of the props"}
keepouts:
  prop_top: {catalog: drone.props.5_1in, proxy: prop_disc, owner: motor_top}
  prop_bottom: {catalog: drone.props.5_1in, proxy: prop_disc, owner: motor_bottom}
bom_extra:
  - {type: electrical, item: "low-ESR capacitor 470 uF (Rubycon, ships with the stack), >= 35 V", qty: 1,
     spec: "across the ESC battery pads, short leads (6S full charge is 25.2 V; the UBEC input max is 26 V)",
     link: "https://www.speedybee.com/speedybee-f405-mini-bls-35a-20x20-stack/",
     note: "included with the stack (catalog drone.stacks.fc_20 includes); its voltage is not published: if it is marked under 35 V buy a 35 V 470-1000 uF low-ESR one"}
  - {type: hardware, item: M2 silicone grommets (stack), qty: 4, spec: "in the stack's 3.5 mm holes; soft-mount (ENGINEERING.md s9)",
     link: "https://www.speedybee.com/speedybee-f405-mini-bls-35a-20x20-stack/", note: "included with the stack (no separate purchase)"}
  - {type: fastener, item: "M3 x 6 mm nylon-tip set screw", qty: 9, spec: "radial rod locks, one per ring boss, 1.5 mm hex key; the nylon tip cannot split the 1 mm carbon tube wall: stop at contact + 1/8 turn. A drop of epoxy in each bore makes the joint permanent"}
  - {type: tool, item: 1.5 mm ball-end hex driver, qty: 1, spec: "the two pitch-horn M2 screws inside the hub fork (a straight key hits the fork)"}
  - {type: hardware, item: 2.5 mm cable tie, qty: 14, spec: "2 at the yoke slots, 3 round the gimbal ring, 2 round the hub fork bar, 4 along the mast tube, 1 XT60 pigtail, 1 UBEC, 1 receiver"}
assembly:
  root: ring_low
  joints:
    - {parent: ring_low.rod_1, child: rod_1.end_a}
    - {parent: ring_low.rod_2, child: rod_2.end_a}
    - {parent: ring_low.rod_3, child: rod_3.end_a}
    - {parent: ring_low.mid_seat, child: ring_mid.origin}
    - {parent: ring_low.top_seat, child: ring_top.origin}
    - {parent: ring_mid.stack_seat, child: stack.bottom}
    - {parent: ring_top.battery_seat, child: pad.bottom}
    - {parent: pad.top, child: battery.bottom}
    - {parent: battery.strap, child: strap.bottom}
    - {parent: ring_top.xt60_seat, child: xt60.bottom}
    - {parent: ring_mid.bec_seat, child: bec.bottom}
    - {parent: ring_mid.rx_seat, child: receiver.bottom}
    - {parent: ring_low.leg_1, child: leg_1.origin}
    - {parent: ring_low.leg_2, child: leg_2.origin}
    - {parent: ring_low.leg_3, child: leg_3.origin}
    - {parent: ring_low.roll_servo, child: servo_roll.tabs}
    - {parent: servo_roll.output, child: horn_roll.spline, name: gimbal_roll, range: [-15, 15], home: 0}
    - {parent: horn_roll.face, child: gimbal_outer.roll_horn}
    - {parent: gimbal_outer.pitch_servo, child: servo_pitch.tabs}
    - {parent: servo_pitch.output, child: horn_pitch.spline, name: gimbal_pitch, range: [-15, 15], home: 0}
    - {parent: horn_pitch.face, child: motor_hub.pitch_horn}
    - {parent: motor_hub.top_motor, child: motor_top.base}
    - {parent: motor_hub.plate_seat, child: motor_plate.origin}
    - {parent: motor_plate.bottom_motor, child: motor_bottom.base}
    - {parent: motor_top.prop, child: prop_top.hub}
    - {parent: motor_bottom.prop, child: prop_bottom.hub}
  allow_overlap:
    - {pair: [servo_roll, horn_roll], max_mm3: 120, why: horn hub engages the servo output spline}
    - {pair: [servo_pitch, horn_pitch], max_mm3: 120, why: horn hub engages the servo output spline}
  order: [servo_roll, horn_roll, gimbal_outer, servo_pitch, horn_pitch, motor_hub, motor_top, motor_plate, motor_bottom]
  key_access:
    - {group: plate_motor_bottom, before: [motor_hub, motor_top],
       why: "the bottom motor is screwed to motor_plate on the bench; the plate then bolts under the hub"}
  sweeps:
    - {name: gimbal_corners, poses: [{gimbal_roll: 15, gimbal_pitch: 15}, {gimbal_roll: 15, gimbal_pitch: -15},
                                     {gimbal_roll: -15, gimbal_pitch: 15}, {gimbal_roll: -15, gimbal_pitch: -15}]}
electrical:
  battery: battery
  burst_s: 5                 # longest full-throttle climb; the ESC burst rating is 45 A for 5 s
  limits:
    motor_top: {peak_a: 21.54, why: "ArduPilot MOT_SPIN_MAX = 0.85 (default 0.95) caps the motor output at 85 % of range: static prop power goes as speed^3 (P = C_P rho n^3 D^5) and motor speed follows the output, so peak current = 0.85^3 x 35.08 A = 21.54 A per motor (thrust 0.85^2 = 72 %). The pair (43 A) stays inside the XT60's 60 A instantaneous rating."}
    motor_bottom: {peak_a: 21.54, why: "same MOT_SPIN_MAX = 0.85 as motor_top"}
# Routes. Fixed points are world mm (ring_low frame); {item, at} points ride on the gimbal parts (tie points: a cable
# tie round the ring section / the hub fork bar). Path for everything going to the gimbal: down through the ring_mid
# wire pass at 30 deg, over the ring_low +Y edge to the +X yoke, down beside the yoke plate (2 tie slots), across the
# roll pivot near its axis onto the gimbal ring, along the ring top to the pitch servo, across the pitch pivot onto the
# hub fork. Cut lengths = worst routed length over every gimbal pose + 15 %, rounded up (out/WIRING.md).
wiring:
  - {id: bat_lead, from: battery, to: xt60, v: 25.2, gauge: 12, color: red/black, supplied: true, length_mm: 115,
     route: [[42, 12, 318], [46, 20, 300]], note: "the pack's own XT60 lead (CNHL does not publish its length): it must be at least this long"}
  - {id: main, from: xt60, to: stack, v: 25.2, gauge: 14, color: red/black, length_mm: 170,
     route: [[28.6, 16.5, 299], [20, 22, 280], [20, 22, 205]], note: "XT60 pigtail, tied through the two ring_top slots"}
  - {id: ph_top, from: stack.esc, to: motor_top, v: 25.2, gauge: 18, color: black, conductors: 3, length_mm: 550,
     route: [[26.8, 15.5, 197], [26.8, 15.5, 180], [26.8, 20, 100], [100.8, 18.5, 85], [100.8, 18.5, 12],
             {item: gimbal_outer, at: [78, 16, 12.5]}, {item: gimbal_outer, at: [66.7, 38.5, 11.5]},
             {item: gimbal_outer, at: [44.2, 63.1, 11.5]}, {item: gimbal_outer, at: [20, 74, 13]},
             {item: gimbal_outer, at: [18, 50, 13]}, {item: motor_hub, at: [10.25, 36, 9.5]}, {item: motor_hub, at: [8, 22, 10.5]}],
     note: "ESC channel 1; extend the motor leads"}
  - {id: ph_bottom, from: stack.esc, to: motor_bottom, v: 25.2, gauge: 18, color: black, conductors: 3, length_mm: 580,
     route: [[26.8, 15.5, 197], [26.8, 15.5, 180], [26.8, 20, 100], [100.8, 18.5, 85], [100.8, 18.5, 12],
             {item: gimbal_outer, at: [78, 16, 12.5]}, {item: gimbal_outer, at: [66.7, 38.5, 11.5]},
             {item: gimbal_outer, at: [44.2, 63.1, 11.5]}, {item: gimbal_outer, at: [20, 74, 13]},
             {item: gimbal_outer, at: [18, 50, 13]}, {item: motor_hub, at: [10.25, 36, 9.5]},
             {item: motor_hub, at: [16, 34, 9.5]}, {item: motor_hub, at: [16, 34, -11]}],
     note: "ESC channel 2; extend the motor leads; down beside the hub fork, under the motor plate"}
  - {id: bec_in, from: stack.vbat, to: bec, v: 25.2, gauge: 24, color: red/black, length_mm: 90,
     route: [[26.8, 15.5, 197], [26.8, 15.5, 182]], note: "UBEC input on the ESC battery pads, through the 30 deg wire pass"}
  - {id: servo_roll_pwr, from: bec, to: servo_roll, v: 5.0, gauge: 24, color: red/brown, length_mm: 350,
     route: [[26.8, 15.5, 182], [26.8, 20, 100], [100.8, 18.5, 85], [100.8, 18.5, 12], [95.8, 18, 11], [95.8, 8, 9], [94.8, -5, 8]]}
  - {id: servo_pitch_pwr, from: bec, to: servo_pitch, v: 5.0, gauge: 24, color: red/brown, length_mm: 480,
     route: [[26.8, 15.5, 182], [26.8, 20, 100], [100.8, 18.5, 85], [100.8, 18.5, 12],
             {item: gimbal_outer, at: [78, 16, 12.5]}, {item: gimbal_outer, at: [66.7, 38.5, 11.5]},
             {item: gimbal_outer, at: [44.2, 63.1, 11.5]}, {item: gimbal_outer, at: [20, 74, 13]}, {item: gimbal_outer, at: [6, 64, 12]}]}
  - {id: servo_roll_sig, from: stack, to: servo_roll, kind: signal, gauge: 28, color: orange, length_mm: 370,
     route: [[26.8, 15.5, 197], [26.8, 15.5, 180], [26.8, 20, 100], [100.8, 18.5, 85], [100.8, 18.5, 12], [95.8, 18, 11], [95.8, 8, 9], [94.8, -5, 8]],
     note: "FC PWM output 4 (M4 pad, timer group 2 at 50 Hz)"}
  - {id: servo_pitch_sig, from: stack, to: servo_pitch, kind: signal, gauge: 28, color: orange, length_mm: 500,
     route: [[26.8, 15.5, 197], [26.8, 15.5, 180], [26.8, 20, 100], [100.8, 18.5, 85], [100.8, 18.5, 12],
             {item: gimbal_outer, at: [78, 16, 12.5]}, {item: gimbal_outer, at: [66.7, 38.5, 11.5]},
             {item: gimbal_outer, at: [44.2, 63.1, 11.5]}, {item: gimbal_outer, at: [20, 74, 13]}, {item: gimbal_outer, at: [6, 64, 12]}],
     note: "FC PWM output 3 (M3 pad, timer group 2 at 50 Hz)"}
  - {id: rx_pwr, from: stack.5v, to: receiver, v: 5.0, gauge: 28, color: red/black, length_mm: 70,
     route: [[0, -31, 197], [0, -31, 180]], note: "through the 270 deg wire pass"}
  - {id: rx_crsf, from: stack, to: receiver, kind: signal, gauge: 28, color: yellow/white, conductors: 2, length_mm: 70,
     route: [[0, -31, 197], [0, -31, 180]], note: "CRSF TX/RX to a free FC UART"}
requirements:
  - {id: twr, check: thrust_to_weight, motors: [motor_top, motor_bottom], factor: 0.78, output_limit: 0.85, min_ratio: 2.0,
     why: "ENGINEERING.md s3 multirotor T/W >= 2 at the 6S pack's nominal 22.2 V: catalog 1685 g per XING2 2207 + 51466 (measured at 24 V) x 0.78 coax efficiency (MDPI Aerospace 3(4):32) x 0.85^2 (thrust at the 85 % output cap, see electrical.limits), scaled by (22.2/24)^2"}
  - {id: twr_sag, check: thrust_to_weight, motors: [motor_top, motor_bottom], factor: 0.78, output_limit: 0.85, pack_v: 21.0, min_ratio: 1.8,
     why: "still climbs with authority when the 6S pack sags to 3.5 V/cell (21 V) under full load late in the flight"}
  - {id: power, check: power_budget,
     why: "battery C rating, XT60, ESC channels, FC 5 V pad, servo UBEC and every wire within rating at average (hover) and peak current"}
  - {id: flight_time, check: flight_time, min_min: 2,
     why: "the brief asks >= 2 min at hover on 80 % of the 1100 mAh pack"}
  - {id: plug_access, check: connector_access, item: xt60, direction: [1, 0, 0], length_mm: 30,
     why: "the battery's XT60 plugs in from outside with the drone assembled (plug body + fingers, 30 mm)"}
  - {id: usb_access, check: connector_access, item: stack, direction: [-1, 0, 0], at: [0, 0, 11], length_mm: 45, size: [12, 7],
     why: "fit the FC with its USB-C port facing -X (between the 90 and 210 deg tubes): a USB-C plug (12 x 7 mm) reaches it from the board centre out past the mast; +Y is blocked by a tube"}
  - {id: cg_axis, check: cg, point: [0, 0, 0], axis: [0, 0, 1], max_lateral_mm: 3, min_along_mm: 0,
     poses: [{gimbal_roll: 15, gimbal_pitch: 15}, {gimbal_roll: -15, gimbal_pitch: -15}],
     why: "the CG must sit on the thrust axis (within 3 mm) and above the gimbal pivot so thrust vectoring can balance it"}
  - {id: stand, check: tip_over, min_deg: 15, why: "must stand on its three legs on a 15 deg slope or a bump"}
  - id: gimbal_fea
    check: fea_static
    part: motor_hub
    why: "the hub carries both motors' thrust into the two pitch pivots: 2 x max thrust (2 x 2 x 1685 g = 66 N)"
    direction: xy
    sf: 3.0                  # on top of the brief's 2 x max thrust: the hub is the drone's arm (ENGINEERING.md s3 crash-exposed)
    max_disp_mm: 0.5
    fixed: {any: [{near_joint: pitch_horn, radius: 12},                                     # horn face + screws
                  {cylinder: {at: [0, 0, 0], dir: [0, 1, 0], r: 1.68, span: [-71, -60]}}]}   # dowel bore
    loads: [{box: [[-15, -15, hub_t - 0.01], [15, 15, hub_t + 0.01]], force_n: [0, 0, 66.1]}]
  - id: outer_fea
    check: fea_static
    part: gimbal_outer
    why: "the roll ring passes the hub's 2 x max thrust from the pitch servo pad and pitch dowel to the roll pivots"
    direction: xy            # printed flat: the ring's bending runs along the layers
    sf: 3.0                  # thrust path = the drone's arm (ENGINEERING.md s3 crash-exposed)
    max_disp_mm: 1.0         # props clear the ring by > 5 mm; 1 mm of flex at 2 x max thrust is harmless
    fixed: {any: [{near_joint: roll_horn, radius: 12},
                  {cylinder: {at: [0, 0, 0], dir: [1, 0, 0], r: 1.68, span: [-83, -71]}}]}
    loads:
      - {sites: ring_servo, radius: 3, force_n: [0, 0, 33.05]}
      - {cylinder: {at: [0, 0, 0], dir: [0, 1, 0], r: 1.525, span: [-83, -71]}, bearing_n: [0, 0, 33.05]}
  - id: yoke_fea
    check: fea_static
    part: ring_low
    why: "the yoke arms carry 2 x max thrust from the roll pivots up into the mast tubes"
    direction: z             # printed upside down: the arms' axial load runs across the layers
    sf: 3.0                  # ENGINEERING.md s3: static load across layers
    max_disp_mm: 1.0
    fixed: {any: [{cylinder: {at: [0, rod_r, 0], dir: [0, 0, 1], r: 2.75}},
                  {cylinder: {at: [-0.866 * rod_r, -0.5 * rod_r, 0], dir: [0, 0, 1], r: 2.75}},
                  {cylinder: {at: [0.866 * rod_r, -0.5 * rod_r, 0], dir: [0, 0, 1], r: 2.75}}]}
    loads:
      - {sites: yoke_servo, radius: 3, force_n: [0, 0, 33.05]}
      - {cylinder: {at: [0, 0, 0], dir: [1, 0, 0], r: 1.525, span: [-92, -82]}, bearing_n: [0, 0, 33.05]}
  - id: lug_fea
    check: fea_static
    part: ring_low
    why: >-
      hard landing pulls the leg screws out of the lug inserts. Per leg at 3 g on two legs (790 g budget x 3 x 9.81 / 2
      = 11.6 N up, 5.8 N sideways at the foot, 78 mm out and 160 mm below the pad): 11.6 x 78 = 905 N mm about the
      tangential axis over a ~26 mm lever from the pad's outer bearing edge to the screws = 35 N, plus 5.8 x 160 =
      928 N mm about the radial axis over the 7 mm half-width of the pad = 133 N; 168 N per leg on its two inserts,
      applied on all three legs at once, with the pad's bearing reaction at each lug end (conservative: only two legs land)
    direction: z             # the inserts pull across ring_low's layers
    sf: 3.0
    max_disp_mm: 2.0         # largest anywhere: the -X yoke pin-plate tip swings as the plate tilts (1.67 mm in this
                             # all-three-legs case); elastic, and the gimbal hangs from the yoke so it moves with it
    fixed: {any: [{cylinder: {at: [0, rod_r, 0], dir: [0, 0, 1], r: 2.75}},
                  {cylinder: {at: [-0.866 * rod_r, -0.5 * rod_r, 0], dir: [0, 0, 1], r: 2.75}},
                  {cylinder: {at: [0.866 * rod_r, -0.5 * rod_r, 0], dir: [0, 0, 1], r: 2.75}}]}
    loads:                   # per leg: screws pull 168 N down, the pad's outer end bears 179.6 N up (net = the 11.6 N foot load)
      - {sites: leg, radius: 3.5, force_n: [0, 0, -504]}
      - {near_joint: leg_1, radius: 9, force_n: [0, 0, 179.6]}
      - {near_joint: leg_2, radius: 9, force_n: [0, 0, 179.6]}
      - {near_joint: leg_3, radius: 9, force_n: [0, 0, 179.6]}
  - id: leg_fea
    check: fea_static
    part: leg_1
    why: "a hard landing on two legs at 3 g: 790 g (the mass budget) x 3 x 9.81 / 2 = 11.6 N up at each foot, plus a 5.8 N sideways (tangential) kick"
    direction: xy            # printed on its side: the strut bends along the layers
    sf: 3.0                  # ENGINEERING.md s3: crash-exposed
    max_disp_mm: 3.0
    fixed: {any: [{sites: leg, radius: 4},                              # the two screw heads
                  {box: [[-5, -7.01, -0.01], [9.01, 7.01, 0.01]]}]}       # pad's outer end bearing up on the lug
    loads: [{box: [[foot_r - leg_r0 - 11, -11, ground_z - ring_low_z - 0.01], [foot_r - leg_r0 + 11, 11, ground_z - ring_low_z + 0.01]], force_n: [0, 5.8, 11.6]}]
  - {id: props, check: prop_clearance, min_mm: 3, min_between_mm: 20, joints: [],
     poses: [{gimbal_roll: 15}, {gimbal_roll: -15}, {gimbal_pitch: 15}, {gimbal_pitch: -15},
             {gimbal_roll: 15, gimbal_pitch: 15}, {gimbal_roll: 15, gimbal_pitch: -15},
             {gimbal_roll: -15, gimbal_pitch: 15}, {gimbal_roll: -15, gimbal_pitch: -15}],
     why: "props must clear the mast, legs, gimbal and each other at every gimbal angle"}
  - {id: roll_torque, check: static_torque, joint: gimbal_roll, actuator: servo_roll, max_fraction: 0.5,
     why: "gravity alone must not load the roll servo past half stall"}
