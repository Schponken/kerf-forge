name: Robotic gripper claw
description: >
  A symmetric two-finger claw for the desk robot arm (projects/robot_arm): it bolts onto the arm's wrist exactly where
  the old gripper did (25T horn + M3 pivot, 35 mm across the forearm fork) and uses the arm's own grip MG996R. Each
  finger carries its own printed spur gear; the gears mesh 1:1, so the servo drives one finger and the other turns the
  opposite way and the object is squeezed toward the claw's centre line. TPU pads, 0-70 mm opening, holds the arm's
  150 g payload at about a quarter of the servo's stall torque. A bench stand that copies the forearm's wrist end
  holds the claw and a wrist servo for testing (and proves the fit to the arm).
printer: Bambu Lab A2L
supports: allowed
style: {radii: [1.0, 2.0, 3.0], edge_break: 0.6}     # one fillet language: 1 small inside, 2 load-path roots, 3 big blends; 0.6 edge chamfer
params:
  x_g: {value: 38, unit: "mm", min: 34, max: 50, step: 1, label: Gear axes ahead of the wrist axis}
  gear_m: {value: 1.5, unit: "mm", min: 1.5, max: 2.0, step: 0.25, label: Gear module}
  gear_z: {value: 16, unit: "teeth", min: 14, max: 18, step: 1, label: Teeth per gear}
  gear_w: {value: 12, unit: "mm", min: 10, max: 14, step: 1, label: Gear face width}
  cover_t: {value: 4, unit: "mm", min: 3, max: 6, step: 0.5, label: Cover plate thickness}
  finger_len: {value: 45, unit: "mm", min: 40, max: 55, step: 1, label: Gear axis to pad contact (along the claw); <= 45 keeps the friction hold SF >= 2 at half stall (DESIGN.md)}
  pad_gap: {value: 1.0, unit: "mm", min: 0.5, max: 3.0, step: 0.5, label: Pad-to-pad gap when closed}
  pad_par: {value: 21, unit: "°", min: 0, max: 30, step: 1, label: Finger angle at which the two pads are parallel (21 = a 35 mm object)}
  pad_t: {value: 3, unit: "mm", min: 2, max: 4, step: 0.5, label: TPU pad thickness}
  grip_open: {value: 40, unit: "°", min: 30, max: 50, step: 1, label: Grip servo travel from closed to open (deg)}
layout: parts/layout.py
parts:
  palm: {file: parts/palm.py, material: PETG, print_rot: [90, 0, 0], infill: 0.4, load_axis: [x, z]}
  cover: {file: parts/cover.py, material: PETG, print_rot: [-90, 0, 0], infill: 0.5, load_axis: x}
  finger_l: {file: parts/finger.py, material: PETG, print_rot: [0, 0, 0], infill: 0.5, load_axis: x}
  finger_r: {file: parts/finger.py, material: PETG, print_rot: [0, 0, 0], infill: 0.5, load_axis: x}
  pad_l: {file: parts/pad.py, material: TPU, print_rot: [180, 0, 0], infill: 1.0,
          insert: {direction: [0, 0, -1], distance: 25}}
  pad_r: {file: parts/pad.py, material: TPU, print_rot: [180, 0, 0], infill: 1.0,
          insert: {direction: [0, 0, -1], distance: 25}}
  wrist_stand: {file: parts/wrist_stand.py, material: PETG, print_rot: [180, 0, 0], infill: 0.3, load_axis: [x, y],
                note: "bench stand: copies the arm forearm's wrist end; print it to test the claw before it goes on the arm"}
purchased:
  wr_servo: {catalog: servos.MG996R, proxy: servo, groups: {tabs: wr_servo}, tab_screws_from: bottom, range: [-75, 75],
             insert: {direction: [0, 0, 1], distance: 10},
             note: "the arm's wrist servo (or a spare) for the bench stand; on the arm the claw goes on the forearm's own"}
  wr_horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: wr_horn},
            note: "the wrist servo's horn (on the arm: the one already on the wrist servo)"}
  gr_servo: {catalog: servos.MG996R, proxy: servo, groups: {tabs: gr_servo}, tab_screws_from: bottom, range: [0, 40],
             insert: {direction: [0, 0, 1], distance: 10},
             note: "the arm's grip servo (robot_arm gr_servo): moves from the old gripper to the claw"}
  gr_horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: gr_horn}, hole_start_deg: 0,
            note: "the grip servo's horn (comes with it from the old gripper); hole_start_deg 0 = finger.py puts the 4 screws under gear teeth"}
assembly:
  root: wrist_stand
  joints:
    - {parent: wrist_stand.servo_seat, child: wr_servo.tabs}
    - {parent: wr_servo.output, child: wr_horn.spline, name: wrist, range: [-75, 75]}
    - {parent: wr_horn.face, child: palm.horn_mount}
    - {parent: palm.servo_seat, child: gr_servo.tabs}
    - {parent: gr_servo.output, child: gr_horn.spline, name: grip, range: [0, 40], home: 0}
    - {parent: gr_horn.face, child: finger_l.horn_mount}
    - {parent: palm.idler, child: finger_r.pivot, name: grip_r, range: [-40, 0], home: 0}
    - {parent: palm.cover_seat, child: cover.origin}
    - {parent: finger_l.pad_seat, child: pad_l.origin}
    - {parent: finger_r.pad_seat, child: pad_r.origin}
  order: [wrist_stand, wr_servo, wr_horn, palm, gr_servo, gr_horn, finger_l, finger_r, cover, pad_l, pad_r]
  sweeps:
    - {joint: grip_r, follows: grip, ratio: -1}
requirements:
  - {id: grip_open, check: distance, a: finger_l.tip, b: finger_r.tip, min_mm: 60, pose: {grip: 40, grip_r: -40},
     why: "the open claw takes a 60 mm object (a can or a cup) between the pad faces"}
  - {id: grip_closed, check: distance, a: finger_l.tip, b: finger_r.tip, max_mm: 2.0, pose: {},
     why: "closed, the pads meet (1 mm gap) so it can pick up a pen or a wire"}
  - {id: torque_wrist, check: static_torque, joint: wrist, actuator: wr_servo, payload_g: 150, payload_at: palm.tcp,
     max_fraction: 0.5, gravity: [0, -1, 0], poses: [{}, {grip: 40, grip_r: -40}, {wrist: 30}, {wrist: -30}],
     why: "on the arm the claw hangs off the wrist servo; with it held level (wrist 0) and 150 g in the jaws the MG996R must stay at or under half its stall torque. The stand holds the wrist axis vertical, so gravity is given as the arm's (claw -Y at wrist 0)"}
  - {id: gears, check: gear_bending, module: gear_m, z_driver: gear_z, z_driven: gear_z, width: gear_w, torque_nmm: stall_nmm,
     sf: 3.0, direction: xy,
     why: "worst case: the whole grip-servo stall torque through the mesh (an object pressed against the idler finger only); teeth printed flat, so the root stress runs along the layers"}
  - {id: claw_mass, check: mass_max, max_g: 130, include: [palm, cover, finger_l, finger_r, pad_l, pad_r, gr_servo, gr_horn],
     why: "what the arm carries past the wrist: the old gripper + finger + servo + horn weighed ~98 g; the arm's shoulder budget (DESIGN.md) holds up to ~130 g"}
  # --- strength at grip-servo stall (DESIGN.md 'Load -> section'): per pad 10.2 N (922 N*mm / (2 x 45 mm)); the idler's
  # 461 N*mm comes through the mesh as 38.4 N tangential (claw -X on the idler) + 14.0 N separating; each gear axis then
  # carries 38.4 / 24.2 N. Each support is loaded with the FULL axis load (the other support may be loose).
  - id: finger_l_fea
    check: fea_static
    part: finger_l
    why: "drive finger at grip-servo stall: half the stall torque (461 N*mm) reaches its own pad; the object pushes the pad face outward along its normal, 461 / 36.2 mm (lever of the pad-centre normal about the gear axis) = 12.7 N; held at the 4 horn screws"
    direction: xy             # printed flat on its gear face: the finger bends along the layers
    sf: 2.0
    max_disp_mm: 1.0
    fixed: {sites: gr_horn, radius: 4.0}
    loads:
      - {near_joint: pad_seat, radius: 6.0, force_n: [4.55, 11.86, 0]}     # 12.7 N along the pad's outward normal (pad_par 21 deg)
  - id: finger_r_fea
    check: fea_static
    part: finger_r
    why: "idler finger at stall: 12.7 N along the pad's outward normal (461 N*mm / 36.2 mm), held on its dowel bore (the gear teeth carry the torque into the drive gear: gears check)"
    direction: xy
    sf: 2.0
    max_disp_mm: 1.0
    fixed: {cylinder: {at: [0, 0, 0], dir: [0, 0, 1], r: 1.675, tol: 0.3, span: [0, "gear_w"]}}
    loads:
      - {near_joint: pad_seat, radius: 6.0, force_n: [4.55, -11.86, 0]}
  - id: palm_fea
    check: fea_static
    part: palm
    why: "grip servo at stall: its 922 N*mm reaction on the 4 tab pilots plus the whole drive-axis side load (38.4 N along X, 24.2 N across) through the servo case, and the whole idler-axis load on the pedestal; held at the wrist horn screws and the pivot insert"
    direction: auto
    sf: 3.0
    max_disp_mm: 0.3
    fixed:
      any:
        - {sites: wr_horn, radius: 4.0}
        - {cylinder: {at: [0, 0, "W"], dir: [0, 0, -1], r: 2.0, tol: 0.3, span: [0, "plate_t + 3"]}}
    loads:
      - {sites: gr_servo, radius: 4.0, torque_nmm: "stall_nmm", axis: {at: ["x_g", 0, "z_d"], dir: [0, 1, 0]}}
      - {sites: gr_servo, radius: 4.0, force_n: [38.4, 0, -24.2]}
      - {cylinder: {at: ["x_g", "y_g0 - 0.5", "z_i"], dir: [0, -1, 0], r: 1.5, tol: 0.3, span: [0, 10]}, bearing_n: [-38.4, 0, 24.2]}
  - id: cover_fea
    check: fea_static
    part: cover
    why: "both gear axes' full side loads at stall on the cover's two dowel holes (drive 38.4 / -24.2 N, idler -38.4 / 24.2 N), held at the two post screws"
    direction: xy             # printed flat: the plate bends along the layers
    sf: 2.0
    max_disp_mm: 0.2
    fixed: {sites: cover, radius: 4.0}
    loads:
      - {cylinder: {at: ["x_g", "y_c1", "z_d"], dir: [0, -1, 0], r: 1.5, tol: 0.3, span: [0, "y_c1 - y_cb"]}, bearing_n: [38.4, 0, -24.2]}
      - {cylinder: {at: ["x_g", "y_c1", "z_i"], dir: [0, -1, 0], r: 1.675, tol: 0.3, span: [0, "y_c1 - y_cb"]}, bearing_n: [-38.4, 0, 24.2]}
  - id: stand_fea
    check: fea_static
    part: wrist_stand
    why: "the wrist servo stalls on the stand (its 922 N*mm reaction on the 4 tab pilots) while carrying 2x the claw's weight (2 x 1.0 N) on the pivot; foot on the bench"
    direction: auto
    sf: 3.0
    max_disp_mm: 0.5
    fixed: {box: [[-200, -200, -200], [200, 200, "-40 + 0.01"]]}
    loads:
      - {sites: wr_servo, radius: 4.0, torque_nmm: "stall_nmm", axis: {at: [0, 0, 0], dir: [0, 0, 1]}}
      - {cylinder: {at: [0, 0, "w_f"], dir: [0, 0, -1], r: 1.75, tol: 0.3, span: [0, "plate_t"]}, bearing_n: [0, -2.0, 0]}
