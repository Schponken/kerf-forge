name: Portable folding bungee rail launcher
description: >
  A no-power launcher for foam fixed-wing drones (0.3-2 kg, pusher or tractor, high or low wing). A 3 m V-slot 2040
  rail in four 750 mm sections folds at three joints held by quick-release pins (pull one, it swings on the other),
  stands on a two-leg aluminium bipod and a staked rear foot at ~11 deg. A printed sled on four Delrin V-wheels is thrown
  up the rail by 1-6 latex strands that run over the rail, round a nose pulley and back under it to an anchor set in
  notch 1-10 (the drone's setting, printed on its cradle). Cocked with a 2:1 line, held by a trigger hook with a
  red-flag safety pin, released by a foot pedal on a lanyard. A pre-stretched latex V-cord brake stops the sled near
  the nose and the drone flies on out of its open-front cradle. One cradle per drone from a template
  (example: drone_foldable_wings, 1.6 kg tractor high-wing).
printer: Bambu Lab A2L
supports: allowed
style: {radii: [1.0, 2.0, 4.0], edge_break: 0.8}
use_story:
  who: "Spencer and other hobby pilots launching their own foam fixed-wing drones (0.3-2 kg) alone, radio in hand"
  where: [outdoor]
  how_often: "a few field sessions a month, 5-20 launches each; carried folded in a car boot or on a backpack"
  goes_wrong:
    - {hazard: heat, max_c: 60, why: "left in a hot car boot or standing in the sun on the field"}
    - {hazard: drop, height_m: 1.0, survive: false, consequence: "the folded bundle dropped or the rail knocked over: a printed lug, hook or the pulley may crack; every printed part is a cheap reprint from the spares list and swaps with a hex key or a pin (stress simulations are paused, so no drop strength is claimed)"}
    - {hazard: other, what: "a cocked rail stores up to ~190 J: it must launch at the setting the cradle says, hold until the pilot is behind it, and stop the sled before the nose", covered_by: [launch_spencer, launch_top, launch_light, launch_peak, hook_seat]}
  field_repair: [brake_l, brake_r]
  carry_by: "the folded four-section bundle with a strap round it, legs and stakes alongside"
params:
  sec_len: {value: 750, unit: mm, min: 600, max: 1000, step: 10, label: Rail section length (4 sections)}
  rail_deg: {value: 11, unit: deg, min: 8, max: 14, step: 0.5, label: Rail angle above the ground}
  pin_off: {value: 44, unit: mm, min: 40, max: 52, step: 1, label: Fold pin axis out from the rail centre}
  pulley_r: {value: 48, unit: mm, min: 40, max: 55, step: 1, label: Nose pulley strand pitch radius}
  pulley_dx: {value: 66, unit: mm, min: 55, max: 80, step: 1, label: Pulley axle ahead of the rail nose}
  sled_len: {value: 170, unit: mm, min: 150, max: 200, step: 5, label: Sled length}
  sled_home_x: {value: 105, unit: mm, min: 95, max: 140, step: 1, label: Sled centre when cocked (rail x)}
  brake_x: {value: 2690, unit: mm, min: 2500, max: 2750, step: 5, label: Brake cord crossing (rail x)}
  brake_stop_max: {value: 300, unit: mm, min: 200, max: 400, step: 5, label: Sled travel allowed into the brake}
  brake_w: {value: 42, unit: mm, min: 38, max: 50, step: 1, label: Brake posts out from the rail centre}
  notch_1_x: {value: 1400, unit: mm, min: 1300, max: 1420, step: 5, label: Anchor notch 1 (rail x)}
  notch_pitch: {value: 55, unit: mm, min: 30, max: 60, step: 1, label: Anchor notch pitch}
  strand_rest: {value: 1299, unit: mm, min: 1100, max: 1500, step: 1, label: Latex strand rest length (loop to loop)}
  strands: {value: 5, unit: "", min: 1, max: 6, step: 1, label: Strands fitted (drone setting)}
  notch: {value: 5, unit: "", min: 1, max: 10, step: 1, label: Anchor notch (drone setting)}
  pivot_x: {value: -20, unit: mm, min: -30, max: -10, step: 1, label: Rail pivot on the rear foot (rail x)}
  pivot_z: {value: 20, unit: mm, min: 10, max: 30, step: 1, label: Rail pivot height in the rail (rail z; 20 = the rail's centre line so the launch recoil does not bend the rail)}
  pivot_h: {value: 35, unit: mm, min: 30, max: 45, step: 1, label: Rail pivot height above the ground}
  bipod_x: {value: 2150, unit: mm, min: 1600, max: 2200, step: 5, label: Bipod mount (rail x)}
  leg_splay: {value: 15, unit: deg, min: 8, max: 25, step: 1, label: Bipod leg splay}
  sock_off: {value: 30, unit: mm, min: 24, max: 40, step: 1, label: Leg socket axis out from the rail face}
  sock_z: {value: -8, unit: mm, min: -20, max: 0, step: 1, label: Leg socket bottom (rail z)}
  foot_t: {value: 12, unit: mm, min: 8, max: 20, step: 1, label: Leg tube end to the foot's ground face}
  drone_g: {value: 1590, unit: g, min: 300, max: 2000, step: 10, label: Example drone all-up mass (drone_foldable_wings)}
  drone_stall: {value: 11.5, unit: m/s, min: 5, max: 13, step: 0.1, label: Example drone stall speed (drone_foldable_wings stall_speed 41.4 km/h)}
  cr_fuse_w: {value: 104, unit: mm, min: 40, max: 140, step: 1, label: "Cradle template: fuselage width at the seat"}
  cr_fuse_h: {value: 64, unit: mm, min: 30, max: 120, step: 1, label: "Cradle template: fuselage depth"}
  cr_fuse_len: {value: 460, unit: mm, min: 200, max: 700, step: 5, label: "Cradle template: fuselage length"}
  cr_prop_r: {value: 89, unit: mm, min: 60, max: 160, step: 1, label: "Cradle template: prop radius (7 in = 89)"}
  cr_tractor: {value: 1, unit: "", min: 0, max: 1, step: 1, label: "Cradle template: 1 tractor (prop at the nose), 0 pusher"}
  cr_high_wing: {value: 1, unit: "", min: 0, max: 1, step: 1, label: "Cradle template: 1 high wing, 0 low wing"}
  cr_boom_d: {value: 8, unit: mm, min: 0, max: 20, step: 1, label: "Cradle template: tail boom diameter at the push face (0 = none)"}
