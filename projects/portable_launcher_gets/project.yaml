bom_extra:
  - {item: "latex tubing 3/16 in ID x 1/16 in wall (surgical / hi-start), 6 launch strands 1.30 m + 6 brake cords 0.30 m + loops", qty: 10, type: extra, spec: "motion.latex_tubing, metres", note: "measure one strand with a luggage scale at 100 / 200 / 300 % stretch first (DESIGN.md calibration); keep a spare set in the bag"}
  - {item: "100 lb braid line: cocking line (2 x 3 m), release lanyard (2.5 m), strand end loops", qty: 10, type: extra, spec: "motion.braid_100lb, metres"}
  - {item: "steel tent stake 9 in (4 through the rear foot, 1 through the pedal base)", qty: 5, type: extra, spec: motion.tent_stake_steel}
  - {item: "M5 x 25 socket head screw (wheel axles)", qty: 4, type: fastener, spec: "ISO 4762"}
  - {item: "M5 nyloc nut (wheel axles)", qty: 4, type: fastener, spec: "ISO 10511"}
  - {item: "6 mm aluminium spacer, 5 mm bore (wheel axles, fixed side)", qty: 2, type: extra, spec: "OpenBuilds aluminium spacer 6 mm"}
  - {item: "6 mm eccentric spacer (wheel axles, preload side)", qty: 2, type: extra, spec: "OpenBuilds eccentric spacer 6 mm (catalog motion.vwheel_delrin_solid)"}
  - {item: "red streamer / flag tape on the safety pin's ring", qty: 1, type: extra, spec: "30 cm"}
requirements:
  - id: launch_spencer
    check: bungee_launch
    why: "Spencer's drone_foldable_wings (1590 g, stall 11.5 m/s) at its cradle setting (5 strands x notch 5) leaves at >= 1.2 x stall, under 8 g, on the soft (commodity) end of the sourced latex spread"
    elastic: motion.latex_tubing
    strands: strands
    notch: notch
    notches: 10
    notch_pitch_mm: notch_pitch
    max_strands: 6
    rest_mm: strand_rest
    start_mm: "START_LEN[0]"
    end_mm: "END_LEN[0]"
    payload_g: drone_g
    moving: [sled, wheel_1, wheel_2, wheel_3, wheel_4, tail_pin, tail_roller_1, tail_roller_2, cradle]
    angle_deg: rail_deg
    rolling_mu: 0.05
    min_speed_m_s: "1.2 * drone_stall"
    max_g: 8
  - id: launch_top
    check: bungee_launch
    why: "the heaviest drone in the brief (2.0 kg, stall ~12 m/s) at the top setting 6 x 10 reaches 1.2 x stall under 8 g on commodity latex, and the brake (6 pre-stretched latex cords) stops the sled + cradle inside brake_stop_max"
    elastic: motion.latex_tubing
    strands: 6
    notch: 10
    notches: 10
    notch_pitch_mm: notch_pitch
    max_strands: 6
    rest_mm: strand_rest
    start_mm: "START_LEN[0]"
    end_mm: "END_LEN[0]"
    payload_g: 2000
    moving: [sled, wheel_1, wheel_2, wheel_3, wheel_4, tail_pin, tail_roller_1, tail_roller_2, cradle]
    angle_deg: rail_deg
    rolling_mu: 0.05
    min_speed_m_s: 14.4
    max_g: 8
    brake: {elastic: motion.latex_tubing, strands: 6, half_gap_mm: brake_w, free_mm: 600, rest_mm: 300, max_stop_mm: brake_stop_max}
  - id: launch_light
    check: bungee_launch
    why: "the lightest drone in the brief (0.3 kg foam, stall ~6 m/s) on the gentlest setting 1 x 1 still leaves at >= 1.15 x stall (Novakovic 2014) under 8 g"
    elastic: motion.latex_tubing
    strands: 1
    notch: 1
    notches: 10
    notch_pitch_mm: notch_pitch
    max_strands: 6
    rest_mm: strand_rest
    start_mm: "START_LEN[0]"
    end_mm: "END_LEN[0]"
    payload_g: 300
    moving: [sled, wheel_1, wheel_2, wheel_3, wheel_4, tail_pin, tail_roller_1, tail_roller_2, cradle]
    angle_deg: rail_deg
    rolling_mu: 0.05
    min_speed_m_s: 6.9
    max_g: 8
  - id: launch_peak
    check: bungee_launch
    why: "worst force case for the structure: the stiff (premium) end of the latex spread at the top setting 6 x 10 with a 2 kg drone; the brake (same stiff latex) still stops the sled inside brake_stop_max; its pull and brake peak are the load cases of the trigger, anchor, nose and sled checks"
    elastic: motion.latex_tubing
    curve: force_curve_premium
    strands: 6
    notch: 10
    notches: 10
    notch_pitch_mm: notch_pitch
    max_strands: 6
    rest_mm: strand_rest
    start_mm: "START_LEN[0]"
    end_mm: "END_LEN[0]"
    payload_g: 2000
    moving: [sled, wheel_1, wheel_2, wheel_3, wheel_4, tail_pin, tail_roller_1, tail_roller_2, cradle]
    angle_deg: rail_deg
    rolling_mu: 0.05
    brake: {elastic: motion.latex_tubing, curve: force_curve_premium, strands: 6, half_gap_mm: brake_w, free_mm: 600, rest_mm: 300, max_stop_mm: brake_stop_max}
  - id: prop_clear
    check: prop_clearance
    why: "the tractor prop spinning up on the cocked rail clears the latex strands, the sled and the cradle by 10 mm, and still clears the nose block, pulley and brake posts as the drone flies off"
    min_mm: 10
    props: [prop]
    joints: [fly_off]
    samples: 5
    poses: [{sled_travel: 2650, fly_off: 0}, {sled_travel: 2650, fly_off: 200}, {sled_travel: 2650, fly_off: 400}, {sled_travel: 2650, fly_off: 600}]
  - id: strands_under_mid
    check: channel_clear
    why: "the centre latex strand runs free under the rail from the pulley to the anchor, past the fold blocks' pins, the bipod and the brake posts"
    path: [{item: nose_block, at: strand_exit}, {item: anchor, at: hook_mid}]
    diameter: 9
  - id: strands_under_out
    check: channel_clear
    why: "the outermost latex strand (26 mm off the centre line) runs free under the rail too"
    path: [{item: nose_block, at: strand_exit_out}, {item: anchor, at: hook_out}]
    diameter: 9
  - id: hook_seat
    check: clearance_min
    why: "cocked: the trigger hook sits in front of the sled's tail roller without cutting into it (0.3 mm gap that closes under the strand pull)"
    a: trigger
    b: tail_roller_1
    min_mm: 0.1
  - {id: fold_a_stop, check: hard_stop, joint: fold_a, beyond: 3, why: "joint A cannot fold past straight: the blocks' end faces butt"}
  - {id: fold_b_stop, check: hard_stop, joint: fold_b, beyond: -3, why: "joint B cannot fold past straight"}
  - {id: fold_c_stop, check: hard_stop, joint: fold_c, beyond: 3, why: "joint C cannot fold past straight"}
  - id: stands
    check: tip_over
    why: "the rail on its rear foot and bipod with Spencer's drone loaded does not tip sideways before 20 deg (gusts, a leg on a tussock)"
    min_deg: 20
    support: [rear_foot, foot_l, foot_r]
  - id: carry_mass
    check: mass_max
    why: "the launcher (no drone, stakes and pins outside the model) stays under 6 kg to carry with one hand"
    advisory: "a carry target, not a safety or function limit"
    max_g: 6000
    include: [rear_foot, rear_block, trigger, hinge_aft_a, hinge_aft_b, hinge_aft_c, hinge_fwd_a, hinge_fwd_b, hinge_fwd_c, anchor_rack_a, anchor_rack_b, anchor, bipod_l, bipod_r, foot_l, foot_r, nose_block, pulley, brake_l, brake_r, sled, cradle, pedal_base, pedal, sec1, sec2, sec3, sec4, wheel_1, wheel_2, wheel_3, wheel_4, tail_pin, tail_roller_1, tail_roller_2, post_l, post_r, axle, pulley_brg_1, pulley_brg_2, leg_l, leg_r, strands_top]
