assembly:
  root: rear_foot
  joints:
    - {parent: rear_foot.rail_pivot, child: rear_block.pivot, name: rail_angle, range: [8, 14], home: 11}
    - {parent: rear_block.section, child: sec1.rear}
    - {parent: sec1.front, child: hinge_aft_a.section}
    - {parent: hinge_aft_a.fold_neg, child: hinge_fwd_a.pin_neg, name: fold_a, range: [-180, 0], home: 0}
    - {parent: hinge_fwd_a.section, child: sec2.rear}
