    - 32
- id: hub_fea
  check: fea_static
  part: hub_r
  why: '6 g pull-out on the right half: 32 N lift shared by the tubes by E I (8x6: 73 %, 23.4 N; 6x4: 27 %, 8.6 N) at their sockets, plus the moment of that lift about the hub face (32 N x (233 - 90) mm
    = 4.6 N m about X); held at the boss''s pin bore'
  direction: auto
  sf: 2.0
  max_disp_mm: 1.0
  fixed:
    cylinder:
      at:
      - pivot_x
      - pivot_y
      - 0
      dir:
      - 0
      - 0
      - 1
