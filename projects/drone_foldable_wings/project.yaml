    radius: 5.0
  loads:
  - cylinder:
      at:
      - pivot_x
      - pivot_y
      - 16.5
      dir:
      - 0
      - 0
      - 1
      r: 2.025
      tol: 0.4
      span:
      - -3.5
      - 3.5
    bearing_n:
    - 0
    - -152
    - 0
  - cylinder:
      at:
      - pivot_x
      - -pivot_y
      - 16.5
      dir:
      - 0
      - 0
      - 1
      r: 2.025
      tol: 0.4
      span:
      - -3.5
      - 3.5
    bearing_n:
    - 0
    - 152
    - 0
  - box:
    - - pivot_x - 9
      - pivot_y - 9
      - 13.2
    - - pivot_x + 9
      - pivot_y + 9
      - 13.8
    force_n:
    - 0
