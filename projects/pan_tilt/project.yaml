name: Pan-tilt camera mount
description: >
  A two-axis camera head for a Raspberry Pi Camera Module 3 on a standard 1/4-20 tripod screw. An SG90 in the base pans
  a printed yoke (+-90 deg, brief: +-80); an SG90 on the yoke's side wall tilts the camera bracket (-35..+65 deg, brief:
  -30..+60). The tilt bracket is carried on both sides: the servo horn on one arm and an M3 screw pivot in the opposite
  wall, so the small servo spline does not carry the bracket's side load alone.
printer: Bambu Lab A2L
supports: allowed
params:
  servo_floor_z: {value: 10.0, min: 9, max: 14, step: 0.5, label: Pan servo bottom above the base underside (tripod screw tip room)}
  floor_t: {value: 1.5, min: 1.2, max: 3, step: 0.1, label: Floor under the tripod nut}
  base_margin: {value: 4.0, min: 3, max: 8, step: 0.5, label: Base length beyond the servo tabs (each end)}
  base_side: {value: 7.0, min: 5, max: 12, step: 0.5, label: Base wall beside the servo body (each side)}
  yoke_t: {value: 6.0, min: 3.5, max: 8, step: 0.5, label: Yoke plate thickness}
  wall_t: {value: 5.0, min: 5.0, max: 6, step: 0.1, label: Yoke side-wall thickness}
  tilt_h: {value: 28.0, min: 24, max: 36, step: 0.5, label: Tilt axis above the yoke underside}
  cam_gap: {value: 27.0, min: 26, max: 32, step: 0.5, label: Space between the bracket arms (camera board 25 wide)}
  arm_t: {value: 3.5, min: 3, max: 5, step: 0.5, label: Bracket arm thickness}
  knuckle_len: {value: 8.0, min: 6, max: 10, step: 0.5, label: Pivot knuckle length (M3 thread depth)}
  pivot_gap: {value: 0.6, min: 0.5, max: 1, step: 0.1, label: Axial gap knuckle to pivot wall}
  cam_plate_x: {value: 7.0, min: 6.5, max: 12, step: 0.5, label: Camera plate back face ahead of the tilt axis}
  cam_plate_t: {value: 3.0, min: 2.5, max: 5, step: 0.5, label: Camera plate thickness}
  arm_bottom: {value: 15.0, min: 14, max: 18, step: 0.5, label: Bracket flat bottom below the tilt axis}
layout: parts/layout.py
parts:
  base: {file: parts/base.py, material: PETG, print_rot: [0, 0, 0], infill: 0.4, load_axis: Z,
         note: "Print upright, bottom face on the bed. Drop the 1/4-20 nut into the servo pocket before the servo."}
  yoke: {file: parts/yoke.py, material: PETG, print_rot: [0, 0, 0], infill: 0.4, load_axis: [Z, X],
         note: "Print on its plate (as assembled). Pivot hole and servo window are teardrop/bridged; no supports."}
  bracket: {file: parts/bracket.py, material: PETG, print_rot: [0, 0, 0], infill: 0.4, load_axis: [X, Z],
            note: "Print standing on its flat bottom (as assembled at tilt 0)."}
purchased:
  pan_servo: {catalog: servos.SG90, proxy: servo, groups: {tabs: base_pan}, range: [-90, 90]}
  pan_horn: {catalog: servo_horns.aluminum_micro_21T, proxy: horn, groups: {holes: yoke_pan}}
  tilt_servo: {catalog: servos.SG90, proxy: servo, groups: {tabs: yoke_tilt}, tab_screws_from: bottom, range: [-90, 90]}
  tilt_horn: {catalog: servo_horns.aluminum_micro_21T, proxy: horn, groups: {holes: bracket_tilt}}
  # component_height 0: the board proxy's generic component block (90% of the board) would cover the mounting holes;
  # the real parts on the front are the 10.8 mm lens housing only, modelled as the cam_lens keep-out below
  camera: {catalog: boards.rpi_camera_module_3, proxy: board, groups: {holes: cam_mount}, component_height: 0}
keepouts:
  cam_lens: {proxy: box, size: [10.8, 10.8, 6.98], owner: camera,
             note: "lens housing (catalog lens_housing_square x component_height)"}
  cam_rear: {proxy: box, size: [16, 22, 3.2], owner: camera,
             note: "parts behind the camera PCB (FPC connector), catalog rear_clearance 3.2"}
  cam_view: {proxy: box, size: [38, 22, 30], owner: camera,
             note: "camera field of view 66 x 41 deg (catalog hfov/vfov) out to 30 mm"}
bom_extra:
  - {type: hardware, item: 1/4-20 UNC hex nut (ASME B18.2.2, 7/16 in AF), qty: 1, spec: "catalog tripod_nut_1_4_20; captive in the base, pulled down onto the 1.5 mm floor by the tripod screw"}
  - {type: fastener, item: M3 x 10 socket head cap screw + M3 washer, qty: 1, spec: "tilt pivot: through the -Y yoke wall, threads into the bracket knuckle; medium threadlocker, back off 1/8 turn"}
  - {type: hardware, item: Raspberry Pi camera FPC cable 200-300 mm (15-pin, 22-pin on Pi 5/Zero), qty: 1, spec: "leave a slack loop for pan and tilt"}
  - {type: hardware, item: 2.5 mm cable tie, qty: 2, spec: "servo leads to the base and yoke tie slots"}
assembly:
  root: base
  joints:
    - {parent: base.pan_seat, child: pan_servo.tabs}
    - {parent: pan_servo.output, child: pan_horn.spline, name: pan, range: [-90, 90], home: 0}
    - {parent: pan_horn.face, child: yoke.horn_mount}
    - {parent: yoke.tilt_seat, child: tilt_servo.tabs}
    - {parent: tilt_servo.output, child: tilt_horn.spline, name: tilt, range: [-35, 65], home: 0}
    - {parent: tilt_horn.face, child: bracket.horn_mount}
    - {parent: bracket.cam_seat, child: camera.bottom}
    - {parent: bracket.cam_seat, child: cam_rear.top}
    - {parent: bracket.lens_base, child: cam_lens.bottom}
    - {parent: bracket.lens_front, child: cam_view.bottom}
  # bench sub-assembly first: the tilt horn is screwed to the bracket before the bracket goes on the servo
  order: [[tilt_horn, bracket], base, pan_servo, pan_horn, yoke, tilt_servo, camera]
  key_access:
    - {group: base_pan, before: [tilt_horn, bracket], why: "the pan servo is screwed into the base long before the head goes on; tilt_horn + bracket are only listed first because they are a bench sub-assembly"}
  sweeps:
    - {joint: pan, samples: 13}
    - {joint: tilt, samples: 13}
    - {name: corners, poses: [{pan: -90, tilt: -35}, {pan: -90, tilt: 65}, {pan: 90, tilt: -35}, {pan: 90, tilt: 65}]}
requirements:
  - {id: torque_tilt, check: static_torque, joint: tilt, actuator: tilt_servo, payload_g: 10, payload_at: bracket.cam_seat, max_fraction: 0.5,
     why: "the tilt servo holds camera + bracket + 10 g of camera-cable drag anywhere in its range at <= half its stall torque"}
  - {id: mass, check: mass_max, max_g: 90, why: "light head for a small tripod or a desk clamp"}
  - {id: cam_clear, check: clearance_min, a: bracket, b: yoke, min_mm: 0.5, joints: [tilt], samples: 19,
     why: "the bracket never rubs the yoke over the whole tilt range (ENGINEERING.md section 6)"}
  - {id: cam_clear_base, check: clearance_min, a: camera, b: yoke, min_mm: 1.0, joints: [tilt], samples: 19,
     why: "the camera board never touches the yoke plate when tilted down"}
  - id: bracket_fea
    check: fea_static
    part: bracket
    why: "camera jammed (hand or obstacle) while the tilt servo pushes at full stall torque; the torque enters at the horn face and leaves through the camera standoffs"
    direction: z            # the arms print standing, so their in-plane bending crosses layers
    sf: 3.0                 # docs/ENGINEERING.md section 3: static load across layers
    max_disp_mm: 0.3
    fixed: {box: [[cam_seat_x - 0.6, -50, -50], [cam_seat_x + 0.01, 50, 50]]}          # standoff tops (camera held)
    loads:
      - {box: [[-7, horn_y - 0.01, -7], [7, horn_y + 0.01, 7]], torque_nmm: servo_stall_nmm, axis: {at: [0, 0, 0], dir: [0, -1, 0]}}
  - id: yoke_fea
    check: fea_static
    part: yoke
    why: "the tilt servo's stall-torque reaction goes through its two tab screws into the +Y wall and down to the pan horn screws; plus 5 N pushed down on the pivot (hand on the camera)"
    direction: z
    sf: 3.0
    max_disp_mm: 0.3
    fixed: {sites: yoke_pan, radius: 2.0}
    loads:
      - {sites: yoke_tilt, radius: 2.0, torque_nmm: servo_stall_nmm, axis: {at: [0, wall_out, tilt_h], dir: [0, 1, 0]}}
      - {cylinder: {at: [0, pin_wall_in, tilt_h], dir: [0, -1, 0], r: 1.68, tol: 0.3, span: [0, wall_t]}, bearing_n: [0, 0, -5.0]}
  - id: base_fea
    check: fea_static
    part: base
    why: "the pan servo's stall-torque reaction at its two tab screws, plus a 10 N sideways knock on the head carried into the deck"
    direction: z
    sf: 3.0
    max_disp_mm: 0.2
    fixed: {box: [[-100, -100, -0.01], [100, 100, 0.01]]}                               # bottom face on the tripod plate
    loads:
      - {sites: base_pan, radius: 2.0, torque_nmm: servo_stall_nmm, axis: {at: [pan_x, 0, 0], dir: [0, 0, 1]}}
      - {sites: base_pan, radius: 2.0, force_n: [0, 10.0, 0]}
  - id: bracket_arm
    check: cantilever_stress
    part: bracket
    section: {name: arms ahead of the hubs, at: [5.5, 0, 0], normal: [1, 0, 0]}
    loads: [{at: cam_seat, force_n: [0, 0, "-servo_stall_nmm / cam_seat_x"]}]
    load_case: stall torque reacted at the camera seat
    sf: 3.0
    kt: 1.5
    direction: z
  - {id: head_cg, check: cg, ref: yoke.horn_mount, max_lateral_mm: 20, include: [yoke, tilt_servo, tilt_horn, bracket, camera],
     poses: [{tilt: -35}, {tilt: 65}],
     why: "the turning head's centre of gravity stays near the pan axis, so the pan servo's output bearing sees only a small overturning moment (moment = mass x lateral offset, in DESIGN.md)"}
