name: 5in freestyle FPV frame
description: >
  A printed 5-inch freestyle quad: a CF-PETG body plate with integrated camera cheeks, four bolt-on CF-PETG arms
  (replaceable after a crash), a top plate on four printed posts that carries the 6S battery and the XT60. iFlight
  XING2 2207 motors, Gemfan 51466 props, 30.5 mm SpeedyBee stack, 19 mm micro camera with 0-40 deg tilt.
printer: Bambu Lab A2L
supports: allowed
params:
  motor_r: {value: 113, min: 100, max: 120, step: 0.5, label: Motor radius from centre (diagonal / 2)}
  arm_w: {value: 20, min: 14, max: 24, step: 0.5, label: Arm width}
  arm_t: {value: 11, min: 8, max: 12, step: 0.5, label: Arm thickness}
  arm_r0: {value: 36, min: 28, max: 36, step: 0.5, label: Arm root end radius}
  arm_hole_1: {value: 38, min: 36, max: 44, step: 0.5, label: Inner arm screw radius}
  arm_hole_2: {value: 52, min: 46, max: 58, step: 0.5, label: Outer arm screw radius}
  body_t: {value: 7, min: 5, max: 8, step: 0.5, label: Body plate thickness}
  body_half: {value: 46, min: 40, max: 48, step: 0.5, label: Body plate half-width}
  post_h: {value: 38, min: 36, max: 44, step: 0.5, label: Top-plate post height above the body}
  top_t: {value: 3, min: 2.5, max: 4, step: 0.5, label: Top plate thickness}
  cam_x: {value: 48, min: 46, max: 52, step: 0.5, label: Camera pivot x}
  cam_z: {value: 19, min: 18, max: 22, step: 0.5, label: Camera pivot height}
derived:
  diag: 2 * motor_r
parts:
  body: {file: parts/body.py, material: CF-PETG, print_rot: [0, 0, 0], infill: 0.4, load_axis: [[1, 1, 0], [1, -1, 0]]}
  arm_1: {file: parts/arm.py, material: CF-PETG, print_rot: [0, 0, 0], infill: 0.5, load_axis: x}
  arm_2: {file: parts/arm.py, material: CF-PETG, print_rot: [0, 0, 0], infill: 0.5, load_axis: x}
  arm_3: {file: parts/arm.py, material: CF-PETG, print_rot: [0, 0, 0], infill: 0.5, load_axis: x}
  arm_4: {file: parts/arm.py, material: CF-PETG, print_rot: [0, 0, 0], infill: 0.5, load_axis: x}
  top_plate: {file: parts/top_plate.py, material: CF-PETG, print_rot: [180, 0, 0], infill: 0.3, load_axis: z}   # pillar bending = axial stress along the upright pillars, across the layers (top_plate_x/_y prove it, direction z)
purchased:
  motor_1: {catalog: drone.motors.2207_1855kv_6s, proxy: motor, groups: {mount: motor_1}}
  motor_2: {catalog: drone.motors.2207_1855kv_6s, proxy: motor, groups: {mount: motor_2}}
  motor_3: {catalog: drone.motors.2207_1855kv_6s, proxy: motor, groups: {mount: motor_3}}
  motor_4: {catalog: drone.motors.2207_1855kv_6s, proxy: motor, groups: {mount: motor_4}}
  stack: {catalog: drone.stacks.fc_30_5, proxy: stack, groups: {holes: stack}}
  camera: {catalog: drone.cameras.micro_19mm, proxy: box, size: [19, 19, 19], joints: {pivot: [0, -4.4, 9.5]},
           note: "RunCam Phoenix 2; frame: local Z = tilt axis, local +Y = lens; side M2 holes 5.1 mm from the back face"}
  battery: {catalog: drone.batteries.6S_1300, proxy: box, color: "#c8a400", joints: {strap: [14.5, 0, 36]}}
  xt60: {catalog: drone.connectors.XT60, proxy: box, color: "#d8b000"}
  vtx: {catalog: drone.vtx.tx800, proxy: stack, groups: {holes: vtx}}
  receiver: {catalog: electronics.receivers.elrs_nano, proxy: box, color: "#205020",
             note: "heat-shrunk, cable-tied under the top plate's camera roof (two tie slots); lead to the FC along the plate; T antenna legs tied up and out in a V through the two slots at the roof front (behind the lens, out of its view)"}
  vtx_ant: {catalog: electronics.antennas.lollipop4p_mmcx_95, proxy: box, size: [11, 11, 20], color: "#20a0a0",
            note: "5.8 GHz antenna, 95 mm tube: from the VTX rear corner outside the rear pillar, outside the rear pillar on the +y side, under the rear tab (one tie through the y +10.5 slot pair), out past the tab end and bent up; about 75 mm of tube path, head (11 mm, 20 mm envelope) above the tab end"}
  pad: {catalog: electronics.pads.battery_pad, proxy: box, size: [80, 40, 3], color: "#303030",
        note: "anti-slip pad cut to 80 x 40 mm (the pack's footprint, so the strap's side runs pass beside it)"}
  strap: {catalog: electronics.straps.strap_20x250, proxy: box, size: [20, 43.6, 1.8], color: "#404040",
          note: "one loop around the pack's width at x 4.5..24.5: over the pack, down its sides past the plate-edge notches, under the plate (about 170 mm of a 250 mm strap); top run modelled here, side and under runs are keep-outs strap_under / strap_l / strap_r"}
electrical:
  battery: battery
  burst_s: 5
  # Betaflight `set motor_output_limit = 74` clips every motor's final output to 74 %. Propeller law (static): rpm ~
  # output, thrust ~ rpm^2, shaft power ~ rpm^3, so the catalog full-output figures scale to 1685 x 0.74^2 = 923 g and
  # 35.08 x 0.74^3 = 14.22 A per motor (a central estimate: at part load the motor speed falls slightly less than
  # the output, so the real peak may reach ~60 A on a full pack; check it in Blackbox / OSD before freestyle). 4 x 14.22 + FC/5 V = 57.4 A keeps the XT60 (60 A burst, Holybro) and its 12 AWG pigtail inside rating.
  limits:
    motor_1: {peak_a: 14.22, why: "Betaflight CLI: set motor_output_limit = 74, save (35.08 A x 0.74^3, propeller power ~ rpm^3; central estimate: confirm the Blackbox/OSD peak is <= 60 A on a full pack before freestyle)"}
    motor_2: {peak_a: 14.22, why: "Betaflight CLI: set motor_output_limit = 74, save (35.08 A x 0.74^3, propeller power ~ rpm^3; central estimate: confirm the Blackbox/OSD peak is <= 60 A on a full pack before freestyle)"}
    motor_3: {peak_a: 14.22, why: "Betaflight CLI: set motor_output_limit = 74, save (35.08 A x 0.74^3, propeller power ~ rpm^3; central estimate: confirm the Blackbox/OSD peak is <= 60 A on a full pack before freestyle)"}
    motor_4: {peak_a: 14.22, why: "Betaflight CLI: set motor_output_limit = 74, save (35.08 A x 0.74^3, propeller power ~ rpm^3; central estimate: confirm the Blackbox/OSD peak is <= 60 A on a full pack before freestyle)"}
wiring:
  # world waypoints [x, y, z] (body bottom z 0, body top 7, top-plate underside 45); arm points ride with the arm
  # battery side: the pack's own lead to the XT60 (plugs in from behind the tab), the XT60 pigtail to the ESC pads
  # (out of the cradle's open front, round the rear pillar at y -16, under the VTX, down to the pads)
  - {id: bat_lead, from: battery, to: xt60, v: 25.2, gauge: 12, color: red/black, length_mm: 140,
     route: [[-46, 0, 60], [-80, 0, 50], [-80, 0, 37]], supplied: battery,
     note: "the pack's own lead (comes with the battery)"}
  - {id: main, from: xt60, to: stack, v: 25.2, gauge: 12, color: red/black, length_mm: 110,
     route: [[-44, 0, 37], [-43, -16, 34], [-25, -16, 30]],
     note: "XT60 pigtail to the ESC battery pads; hold the XT60 with a finger when unplugging the pack (a cable tie is all that holds it rearward); pre-bend the leads toward -y before soldering and use 8-10 mm heat-shrink on the XT60 cups (20 mm reaches the rear pillar); 35 V 1000 uF low-ESR cap (ships with the stack) soldered across the pads"}
  # motor phases: 3 wires each over the body top between the arm's two ribs, down onto the arm top past the body
  # corner, along the arm (2 ties through the arm slots) to the motor
  - {id: ph1, from: stack.esc, to: motor_1, v: 25.2, gauge: 18, conductors: 3, color: black, length_mm: 175,
     route: [{item: arm_1, at: [24, 0, 9]}, {item: arm_1, at: [64, 0, 9]}, {item: arm_1, at: [70, 0, 1.5]}, {item: arm_1, at: [96, 0, 1.5]}]}
  - {id: ph2, from: stack.esc, to: motor_2, v: 25.2, gauge: 18, conductors: 3, color: black, length_mm: 175,
     route: [{item: arm_2, at: [24, 0, 9]}, {item: arm_2, at: [64, 0, 9]}, {item: arm_2, at: [70, 0, 1.5]}, {item: arm_2, at: [96, 0, 1.5]}]}
  - {id: ph3, from: stack.esc, to: motor_3, v: 25.2, gauge: 18, conductors: 3, color: black, length_mm: 175,
     route: [{item: arm_3, at: [24, 0, 9]}, {item: arm_3, at: [64, 0, 9]}, {item: arm_3, at: [70, 0, 1.5]}, {item: arm_3, at: [96, 0, 1.5]}]}
  - {id: ph4, from: stack.esc, to: motor_4, v: 25.2, gauge: 18, conductors: 3, color: black, length_mm: 175,
     route: [{item: arm_4, at: [24, 0, 9]}, {item: arm_4, at: [64, 0, 9]}, {item: arm_4, at: [70, 0, 1.5]}, {item: arm_4, at: [96, 0, 1.5]}]}
  # FC 5 V rail: VTX (0.75 A at 800 mW) + receiver (0.1 A) of the 3 A BEC; camera (5-36 V) on the 9 V pad, so the
  # lead's voltage drop can't take it under its 5 V minimum
  - {id: vtx_5v, from: stack.5v, to: vtx, v: 5.0, gauge: 26, color: red/black, length_mm: 80,
     route: [[-8, 14, 30], [-13.5, 14, 33]], note: "up from the FC's rear-right pads in the 5 mm gap over the stack to the VTX pads (outside the strap band)"}
  - {id: cam_9v, from: stack.9v, to: camera, v: 9.0, gauge: 28, color: red/black, length_mm: 110,
     route: [[20, 15, 20], [37, 15, 20], [38, 11, 20]]}
  - {id: rx_5v, from: stack.5v, to: receiver, v: 5.0, gauge: 28, color: red/black, length_mm: 110,
     route: [[20, 15, 32], [38, 15, 40]]}
  # signals
  - {id: cam_video, from: camera, to: stack, kind: signal, gauge: 28, color: yellow, length_mm: 110,
     route: [[38, 11, 20], [37, 15, 20], [20, 15, 20]], note: "camera video into the FC (OSD)"}
  - {id: vtx_video, from: stack, to: vtx, kind: signal, gauge: 28, color: yellow, length_mm: 80,
     route: [[-8, 14, 30], [-13.5, 14, 33]], note: "FC video out + SmartAudio (UART) to the VTX, same path as vtx_5v"}
  - {id: crsf, from: stack, to: receiver, kind: signal, gauge: 28, color: white/green, length_mm: 110,
     route: [[20, 15, 32], [38, 15, 40]], note: "CRSF TX/RX to an FC UART"}
keepouts:
  strap_under: {proxy: box, size: [20, 43.6, 1.8], owner: strap, note: "strap run under the top plate"}
  strap_l: {proxy: box, size: [20, 1.8, 45.6], owner: strap, note: "strap side run, plate underside to pack top"}
  strap_r: {proxy: box, size: [20, 1.8, 45.6], owner: strap, note: "strap side run"}
  prop_1: {catalog: drone.props.5_1in, proxy: prop_disc, owner: motor_1, h: 7}
  prop_2: {catalog: drone.props.5_1in, proxy: prop_disc, owner: motor_2, h: 7}
  prop_3: {catalog: drone.props.5_1in, proxy: prop_disc, owner: motor_3, h: 7}
  prop_4: {catalog: drone.props.5_1in, proxy: prop_disc, owner: motor_4, h: 7}
bom_extra:
  - {type: fastener, item: M2 x 6 mm button head screw, qty: 2, spec: ISO 7380, price_key: "screw:M2:button", note: "camera side pivots; heads sit in 1 mm cheek recesses, so 3.5 mm grip leaves 2.5 mm in the camera's own threads"}
  - {type: hardware, item: M2 flat washer, qty: 4, spec: "under the VTX screw heads (its holes take M3)"}
  - {type: hardware, item: "M2 x 6 mm nylon spacer, round, 4 mm OD", qty: 4, price_key: "spacer:M2x6:nylon", spec: "between the top-plate bosses and the VTX PCB: the 1.6 mm board + 6 mm spacer + washer fill the 8 mm VTX envelope, so the M2 x 12 clamps 3.9 mm into the boss"}
  - {type: hardware, item: 2.5 mm cable tie, qty: 12, price_key: "tie:2.5mm", spec: "2 per arm for motor wires, 1 wrapped under the XT60 through the two slots beside its cradle, 1 for the VTX antenna under the tab, 2 for the receiver and its antenna legs"}
  - {type: hardware, item: medium-strength (blue) threadlocker, qty: 1, price_key: "threadlocker:blue", spec: "Loctite 243 or equal", note: "one drop on each of the 16 motor screws (steel into the aluminium base) and the 8 arm screws at their nuts"}
  - {type: hardware, item: M3 silicone grommets (stack), qty: 4, spec: "ship with the SpeedyBee stack; soft-mount", link: "https://www.speedybee.com/speedybee-f405-v4-bls-55a-30x30-fc-esc-stack/", note: "included with the stack (no separate purchase)"}
assembly:
  root: body
  joints:
    - {parent: body.arm_1, child: arm_1.root}
    - {parent: body.arm_2, child: arm_2.root}
    - {parent: body.arm_3, child: arm_3.root}
    - {parent: body.arm_4, child: arm_4.root}
    - {parent: arm_1.motor, child: motor_1.base}
    - {parent: arm_2.motor, child: motor_2.base}
    - {parent: arm_3.motor, child: motor_3.base}
    - {parent: arm_4.motor, child: motor_4.base}
    - {parent: motor_1.prop, child: prop_1.hub}
    - {parent: motor_2.prop, child: prop_2.hub}
    - {parent: motor_3.prop, child: prop_3.hub}
    - {parent: motor_4.prop, child: prop_4.hub}
    - {parent: body.stack, child: stack.bottom}
    - {parent: body.top, child: top_plate.base}
    - {parent: top_plate.battery, child: pad.bottom}
    - {parent: pad.top, child: battery.bottom}
    - {parent: battery.strap, child: strap.bottom}
    - {parent: top_plate.strap_u, child: strap_under.bottom}
    - {parent: top_plate.strap_l, child: strap_l.bottom}
    - {parent: top_plate.strap_r, child: strap_r.bottom}
    - {parent: top_plate.rx, child: receiver.bottom}
    - {parent: top_plate.xt60, child: xt60.bottom}
    - {parent: top_plate.vtx, child: vtx.bottom}
    - {parent: top_plate.vant, child: vtx_ant.bottom}
    - {parent: body.cam_tilt, child: camera.pivot, name: cam_tilt, range: [0, 40], home: 25}
  order: [body, [arm_1, arm_2, arm_3, arm_4], [motor_1, motor_2, motor_3, motor_4], stack, camera, top_plate, vtx, vtx_ant, receiver, xt60, pad, battery, strap]
  key_access:
    - {group: vtx, before: [body, stack, camera, arm_1, arm_2, arm_3, arm_4], why: "the VTX is screwed under the top plate on the bench before the plate goes onto the frame"}
  sweeps:
    - {joint: cam_tilt, samples: 9}
requirements:
  - {id: prop_gap, check: prop_clearance, min_mm: 3, min_between_mm: 4, joints: [cam_tilt],
     why: "spinning props must clear each other by 4 mm and everything else by 3 mm, also while the camera tilts"}
  - {id: twr, check: thrust_to_weight, thrust_g_total: 3691, min_ratio: 6,
     why: "freestyle needs >= 6:1; catalog XING2 2207 max thrust 1685 g at full output, x 0.74^2 for the 74 % Betaflight motor_output_limit that keeps the XT60 in rating = 922.7 g x 4 motors = 3691 g"}
  - {id: frame_mass, check: mass_max, max_g: 250, include: [body, arm_1, arm_2, arm_3, arm_4, top_plate],
     why: "printed frame no heavier than 250 g"}
  - {id: cg_center, check: cg, point: [0, 0, 0], max_lateral_mm: 5,
     why: "ENGINEERING.md section 9: CG within 5 mm of the thrust centre so the quad hovers without trim"}
  - id: arm_strength
    check: fea_static
    part: arm_1
    why: "crash / aggressive case: 2 x one motor's max thrust (2 x 1685 g = 33.1 N) pulling the motor screws up, arm held at its two frame bolts"
    direction: xy            # arm prints flat; bending stress runs along the arm, in the layer plane
    sf: 3.0                  # ENGINEERING.md section 3: crash-exposed drone arm
    max_disp_mm: 0.87         # ENGINEERING.md: arm tip deflection < 1 % of the 87 mm arm (audit F8)
    fixed: {sites: arm_1, radius: 3.5}
    loads: [{sites: motor_1, radius: 3.5, force_n: [0, 0, 33.06]}]
  - id: body_strength
    check: fea_static
    part: body
    why: "the arm_1 crash load (2 x max thrust at the motor) arrives at the body as a lever couple through the two arm screws; the body must not fail before the replaceable arm"
    direction: xy            # body prints flat; plate bending stress lies in the layers
    sf: 3.0
    max_disp_mm: 1.0
    fixed: {sites: posts, radius: 5.5}      # post feet (screw seat + the 9 mm foot on the top face): the top-plate + battery mass is the main inertia it is held by
    loads:
      # lever on the arm (supports at r 38 / 52, 33.06 N at r 113): inner nut pulls the body down 144.0 N,
      # the arm top presses up on the body underside around the outer screw with 177.1 N
      - {box: [[23.8, 23.8, body_t - 3.21], [29.9, 29.9, body_t - 3.19]], force_n: [0, 0, -144.0]}   # nut seat (nut sunk 0.5 mm + 2.7 pocket)
      - {box: [[32.8, 32.8, -0.01], [40.8, 40.8, 0.01]], force_n: [0, 0, 177.1]}
  - id: body_strength_3
    check: fea_static
    part: body
    why: "same arm_1 crash couple, reacted by the post feet (top plate + battery, the largest mass) AND the opposite arm's clamp (arm_3 + motor_3 inertia): loads the diagonal path across the body past the stack holes and the lightening windows (audit F5). Holding it at arm_3 alone would put the whole quad's inertia on a 55 g arm + motor (9 % of the mass): not a real load case"
    direction: xy
    sf: 3.0
    max_disp_mm: 1.0
    fixed: {any: [{sites: posts, radius: 5.5}, {sites: arm_3, radius: 6.0}]}   # arm_3 clamp: screw + nut seat and the arm top round it
    loads:
      - {box: [[23.8, 23.8, body_t - 3.21], [29.9, 29.9, body_t - 3.19]], force_n: [0, 0, -144.0]}
      - {box: [[32.8, 32.8, -0.01], [40.8, 40.8, 0.01]], force_n: [0, 0, 177.1]}
  # top plate: posts print upright, so post bending runs across the layers (direction z). Crash case: a 50 g hit on
  # battery + pad + strap (215 g CNHL pack + ~15 g) = 0.23 kg x 50 x 9.81 = 112.8 N, applied at the pack CG 21 mm above
  # the plate top (3 mm pad + half the 36 mm pack): force on the plate top + its 112.8 x 21 = 2369 N*mm tipping couple.
  - id: top_plate_x
    check: fea_static
    part: top_plate
    why: "battery takes a 50 g front/rear crash hit; the webbed post pillars bend across their 9 mm side"
    direction: z
    sf: 3.0
    max_disp_mm: 1.5
    fixed: {sites: posts, radius: 4.5}
    loads:
      - {box: [[-40, -21, post_h + top_t - 0.01], [40, 21, post_h + top_t + 0.01]], force_n: [112.8, 0, 0]}
      - {box: [[-40, -21, post_h + top_t - 0.01], [40, 21, post_h + top_t + 0.01]], torque_nmm: 2369, axis: {at: [0, 0, post_h + top_t], dir: [0, 1, 0]}}
  - id: top_plate_y
    check: fea_static
    part: top_plate
    why: "battery takes a 50 g side crash hit"
    direction: z
    sf: 3.0
    max_disp_mm: 1.5
    fixed: {sites: posts, radius: 4.5}
    loads:
      - {box: [[-40, -21, post_h + top_t - 0.01], [40, 21, post_h + top_t + 0.01]], force_n: [0, 112.8, 0]}
      - {box: [[-40, -21, post_h + top_t - 0.01], [40, 21, post_h + top_t + 0.01]], torque_nmm: 2369, axis: {at: [0, 0, post_h + top_t], dir: [-1, 0, 0]}}
  - {id: power, check: power_budget,
     why: "battery C rating, ESC channels, FC 5 V BEC, XT60 and every wire inside their ratings at hover and at full throttle"}
  - {id: flight_time, check: flight_time, min_min: 3, why: "brief: at least 3 min at hover on 80 % of the 1300 mAh pack. Ideal-hover estimate (momentum theory, FM 0.5): real hover draws more, and freestyle flying gives about 3-5 min"}
  - {id: usb_access, check: connector_access, item: stack, direction: [0, 1, 0], at: [0, 0, 17], length_mm: 45, size: [12, 7],
     why: "Betaflight CLI is needed (motor_output_limit 74): fit the FC with its USB-C port facing +Y (right); +Y between the right-hand arms is open from the board out past the body edge for a USB-C plug (12 x 7 mm) + 45 mm of cable. If that turns the FC's arrow sideways, set board_align_yaw (90 / 270) in Betaflight. +X is the camera, -X the VTX + XT60 lead, so +/-Y are the sides to use"}
  - {id: xt60_plug, check: connector_access, item: xt60, direction: [-1, 0, 0], length_mm: 30,
     why: "the battery plug goes straight into the XT60 from the rear with the frame assembled"}
