name: Parallel gripper for the desk robot arm
description: >
  A rack-and-pinion parallel-jaw gripper that bolts onto the desk robot arm's wrist in place of its single-finger
  gripper (same wrist fork, horn and pivot). The arm's grip servo (MG996R) lies inline in the gripper body; a printed
  20-tooth pinion on its horn drives two racks, one per jaw, so both jaws move in and out together and stay parallel,
  the object stays centred on the tool point. Each jaw slides on two steel guide rods. Opens 2-54 mm. A small bench
  stand that reproduces the arm's wrist end lets you test the gripper before it goes on the arm.
printer: Bambu Lab A2L
supports: allowed
params:
  plate_t: {value: 7, unit: "mm", min: 7, max: 8, step: 0.5, label: Wrist fork plate thickness (robot_arm plate_t)}
  side_gap: {value: 1.5, unit: "mm", min: 0.5, max: 2.0, step: 0.1, label: Axial gap at the wrist pivot (robot_arm side_gap)}
  grip_w: {value: 35, unit: "mm", min: 35, max: 35, step: 1, label: Wrist fork width (= robot_arm grip_w; the forearm is built for it)}
  link_h: {value: 34, unit: "mm", min: 34, max: 34, step: 1, label: Wrist disc diameter (robot_arm link_h)}
  x_bulk: {value: 45, unit: "mm", min: 45, max: 55, step: 0.5, label: Bulkhead back face (grip servo tab tops) ahead of the wrist axis}
  bulk_t: {value: 7, unit: "mm", min: 7, max: 7.5, step: 0.5, label: Bulkhead thickness (servo tab pilots; 7 mm gives the M3 x 8 thread-forming screws their engagement, < 7.7 so the case top still passes)}
  gear_m: {value: 1.5, unit: "mm", min: 1.5, max: 1.5, step: 0.25, label: Pinion / rack module}
  pinion_z: {value: 20, unit: "teeth", min: 20, max: 20, step: 1, label: Pinion teeth}
  gear_b: {value: 12, unit: "mm", min: 10, max: 14, step: 1, label: Pinion / rack face width}
  grip_max: {value: 100, unit: "°", min: 90, max: 110, step: 5, label: Servo travel closed -> open (deg)}
  gap0: {value: 2, unit: "mm", min: 1, max: 4, step: 0.5, label: Pad gap when closed}
  slab_gap: {value: 0.6, unit: "mm", min: 0.5, max: 1.0, step: 0.1, label: Gap between the pinion's front face and the carriages}
  carr_x: {value: 10, unit: "mm", min: 8, max: 14, step: 1, label: Carriage depth along the gripper}
  carr_len: {value: 14, unit: "mm", min: 12, max: 20, step: 1, label: Carriage length along the rods}
  rod_y: {value: 21, unit: "mm", min: 18, max: 24, step: 0.5, label: Guide rods above / below the pinion axis}
  stop_gap: {value: 1.0, unit: "mm", min: 0.5, max: 2.0, step: 0.1, label: Extra travel past fully open before the carriage meets the cheek}
  cheek_t: {value: 9, unit: "mm", min: 8, max: 10, step: 0.5, label: End cheek thickness (rod seats; with z_stop it sets the 100 mm rod length)}
  finger_len: {value: 32, unit: "mm", min: 25, max: 40, step: 1, label: Finger length ahead of the carriage}
  pad_len: {value: 24, unit: "mm", min: 15, max: 30, step: 1, label: Grip pad length along the finger}
  stand_h: {value: 70, unit: "mm", min: 55, max: 110, step: 1, label: Bench stand - wrist axis height above the bench}
layout: parts/layout.py
parts:
  gripper: {file: parts/gripper.py, material: PETG, print_rot: [-90, 0, 0], infill: 0.4, load_axis: X,
            assembly_note: "before it goes on the arm, on the bench stand: find the pulse where the pads just touch (grip 0 deg) and make it the software floor in your arm code (there is no mechanical stop at the closed end; past it the servo stalls on the pads); hold test: hang 300 g (150 g x slip factor 2) from a 25 mm block in the jaws and raise the squeeze one degree past contact at a time until it holds, then use that overdrive for every hold (never a stall); if it slips even at full squeeze, re-oil the rods; weigh it: at most 194 g with rods and screws"}
  pinion: {file: parts/pinion.py, material: PETG, print_rot: [180, 0, 0], infill: 0.6, load_axis: X}   # teeth are all perimeter (4 loops = 1.7 mm > half the 2.4 mm tooth); the web idles at 7 %
  jaw_r: {file: parts/jaw.py, material: PETG, print_rot: [-90, 0, 0], infill: 0.5, load_axis: X, params: {side: 1},
          assembly_note: "oil both guide rods where this carriage runs (dry PTFE spray or a drop of light machine oil): NOT optional, dry the carriage cocks on its 14 mm bores and their friction eats most of the grip force (DESIGN.md Grip force); it must slide freely on the oiled rods while you press the pad; re-oil when the jaws feel rough"}
  jaw_l: {file: parts/jaw.py, material: PETG, print_rot: [-90, 0, 0], infill: 0.5, load_axis: X, params: {side: -1},
          assembly_note: "oil both guide rods where this carriage runs (dry PTFE spray or a drop of light machine oil): NOT optional, dry the carriage cocks on its 14 mm bores and their friction eats most of the grip force (DESIGN.md Grip force); it must slide freely on the oiled rods while you press the pad; re-oil when the jaws feel rough"}
  rod_keeper: {file: parts/rod_keeper.py, material: PETG, print_rot: [0, 0, 0], infill: 0.4}
  stand: {file: parts/stand.py, material: PETG, print_rot: [0, 0, 0], infill: 0.3, load_axis: Z}
purchased:
  wr_servo: {catalog: servos.MG996R, proxy: servo, groups: {tabs: wr_servo}, tab_screws_from: bottom, range: [-75, 75],
             note: "the stand's wrist servo; on the arm this is the arm's own wrist servo (projects/robot_arm)"}
  wr_horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: wr_horn}}
  gr_servo: {catalog: servos.MG996R, proxy: servo, groups: {tabs: gr_servo}, tab_screws_from: bottom, range: [0, 100],
             note: "the arm's grip servo: reuse the one from the arm's old gripper"}
  gr_horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: gr_horn}}
  # bench electrics (DESIGN.md 'Bench electrics'): 5 V mains adapter -> barrel-jack adapter -> the grip servo; an
  # Arduino Nano on USB makes the pulses. Only the grip servo is powered on the bench: the stand's wrist servo stands in
  # for the arm's wrist and is set by hand, unplugged. On the arm the gripper uses the arm's own supply, splices and
  # PCA9685 channel 4 (projects/robot_arm wiring pwr_gr / sig_gr): nothing here goes on the arm.
  psu: {catalog: electronics.supplies.meanwell_gst60a05, proxy: box, render: false, off_board: "on the bench behind the stand"}
  jack: {catalog: electronics.connectors.dc_jack_5521_screw, proxy: box, off_board: "on the bench behind the stand"}
  nano: {catalog: boards.arduino_nano, proxy: board, off_board: "on the bench behind the stand, on a non-conductive pad"}
bom_extra:
  - {type: electrical, item: "IEC C13 mains cord (country plug)", qty: 1, price_key: "mains_cord:C13", spec: "the MEAN WELL adapter ships without one (element14: mains lead sold separately)"}
  - {type: electrical, item: USB Mini-B cable, qty: 1, price_key: "cable:usb_mini_b", spec: "programs and powers the Arduino Nano A000005 (Mini-B, PiShop page)"}
  - {type: fastener, item: "M4 x 20 mm wood screw or M4 bolt + nut through the bench, head <= 8 mm", qty: 2, price_key: "screw:M4x20:socket",
     spec: "stand to the bench through the two diagonal holes in its bars (a stalled wrist servo would rock it); or a C-clamp on the back bar at a bench corner"}
  - {type: tool, item: 2.5 mm ball-end hex driver, qty: 1, price_key: "tool:ball_end_hex_set_1.5-5", spec: "the servo tab screws next to each servo's cable boss (a straight key grazes the boss)"}
assembly:
  root: stand
  joints:
    - {parent: stand.servo_seat, child: wr_servo.tabs}
    - {parent: wr_servo.output, child: wr_horn.spline, name: wrist, range: [-75, 75]}
    - {parent: wr_horn.face, child: gripper.horn_mount}
    - {parent: gripper.servo_seat, child: gr_servo.tabs}
    - {parent: gr_servo.output, child: gr_horn.spline, name: grip, range: [0, 100], home: 0}
    - {parent: gr_horn.face, child: pinion.horn_mount}
    - {parent: gripper.jaw_r_slide, child: jaw_r.mount, name: jaw_r_slide}
    - {parent: gripper.jaw_l_slide, child: jaw_l.mount, name: jaw_l_slide}
    - {parent: gripper.keeper_seat, child: rod_keeper.origin}
    - {parent: stand.desk_psu, child: psu.bottom}
    - {parent: stand.desk_jack, child: jack.bottom}
    - {parent: stand.desk_nano, child: nano.bottom}
  sweeps:
    # rack and pinion: each jaw travels r * pi / 180 = 15 * pi / 180 = 0.261799 mm per servo degree (layout mm_per_deg)
    - {joint: jaw_r_slide, follows: grip, ratio: 0.261799}
    - {joint: jaw_l_slide, follows: grip, ratio: 0.261799}
  # horn centre screws are driven when their horn goes on (before the part that covers them); the pinion's four
  # horn screws before the jaws slide in over them; the rods + keeper after the jaws
  order: [stand, wr_servo, wr_horn, gr_servo, gripper, gr_horn, pinion, [jaw_r, jaw_l], rod_keeper]
style: {radii: [1.0, 2.0, 4.0], edge_break: 0.6}
electrical:
  supply: psu                # mains adapter: rated by its 6 A, no run time
  burst_s: 5                 # the grip servo stalled for 5 s (a jammed jaw), for wire heating
wiring:      # bench test set-up only (on the arm: robot_arm pwr_gr / sig_gr). Ends = item centres; cut length >= routed + 15 %.
  - {id: psu_cord, from: psu, to: jack, v: 5.0, gauge: 22, color: black/white, length_mm: 1000, supplied: psu,
     note: "the adapter's own 1 m DC cord with its 5.5 x 2.1 plug; gauge not published, so checked as 22 AWG (the thinnest whose 7 A chassis ampacity covers the adapter's 6 A)"}
  - {id: pwr_gr, from: jack, to: gr_servo, v: 5.0, gauge: 22, color: red/brown, lead: [gr_servo, electronics.wire_misc.servo_ext_300_pololu2184],
     ends: {from: screw, to: plug}, route: [stand.lead_down, stand.lead_a, stand.lead_b, stand.lead_c, gripper.lead_2, gripper.lead_top, gripper.lead_1],
     note: "grip servo plugged into a 300 mm extension; cut the extension's male end, red / brown into the jack's + / - terminals; up the stand leg (slot pair), over the wrist outside plate A, into the gripper's servo bay"}
  - {id: sig_gr, from: nano, to: gr_servo, kind: signal, pin: D9, gauge: 22, color: orange, lead: pwr_gr, ends: {from: crimp, to: plug},
     route: [stand.lead_down, stand.lead_a, stand.lead_b, stand.lead_c, gripper.lead_2, gripper.lead_top, gripper.lead_1],
     note: "the extension's orange (signal) wire, crimped, onto Nano D9"}
  - {id: gnd_ref, from: jack, to: nano, kind: signal, gauge: 22, color: black, length_mm: 150, ends: {from: screw, to: crimp},
     note: "jack minus terminal (with the brown wire, one twin ferrule) to a Nano GND pin: the servo signal needs a common ground (the Nano runs from the PC's USB)"}
requirements:
  - {id: grip_open, check: distance, a: jaw_l.pad, b: jaw_r.pad, min_mm: 50, pose: {grip: 100, jaw_l_slide: 26.179, jaw_r_slide: 26.179},
     why: "fully open (servo 100 deg): the pads 2 + 2 x 26.18 = 54.4 mm apart; the arm's brief asks >= 40 mm"}
  - {id: grip_closed, check: distance, a: jaw_l.pad, b: jaw_r.pad, max_mm: 3, pose: {},
     why: "closed (servo 0 deg) the pads are 2 mm apart, so thin objects (a 3 mm card) can be picked"}
  - {id: torque_wrist, check: static_torque, joint: wrist, actuator: wr_servo, payload_g: 150, payload_at: gripper.tcp,
     max_fraction: 0.25, poses: [{}, {wrist: -75}, {wrist: 75}, {grip: 100, jaw_l_slide: 26.179, jaw_r_slide: 26.179}],
     why: "<= 2.35 kg*cm with 150 g at the tool point and the gripper horizontal: together with gripper_mass this keeps the arm's shoulder at <= 49 % of stall (DESIGN.md 'Arm torque budget')"}
  - {id: gripper_mass, check: mass_max, max_g: 166, include: [gripper, pinion, jaw_r, jaw_l, rod_keeper, gr_servo, gr_horn],
     why: "printed parts + grip servo + horn; + 19.8 g of rods and ~8 g of screws and inserts (not items) = <= 194 g on the wrist; with torque_wrist <= 2.35 kg*cm the shoulder stays <= 10.32 of its 10.5 kg*cm half-stall limit (DESIGN.md 'Arm torque budget')"}
  - {id: stop_open_r, check: hard_stop, joint: jaw_r_slide, beyond: 27.6,
     why: "past fully open the carriage meets the +Z cheek (1 mm of over-travel), so the rack can never leave the pinion"}
  - {id: stop_open_l, check: hard_stop, joint: jaw_l_slide, beyond: 27.6,
     why: "same for the -Z cheek"}
  - {id: pinion_teeth, check: gear_bending, module: gear_m, z_driver: pinion_z, z_driven: 400, width: gear_b, torque_nmm: mg_stall_nmm,
     material: PETG, sf: 3, direction: xy,
     why: "one jaw blocked alone at stall: the whole 922 N*mm on one mesh (61.5 N); the pinion prints flat (teeth in the layer plane); a rack is z = infinity (400 = the Lewis table's last row)"}
  - {id: rack_teeth, check: gear_bending, module: gear_m, z_driver: pinion_z, z_driven: 400, width: gear_b, torque_nmm: mg_stall_nmm,
     material: PETG, sf: 3, direction: z,
     why: "the same 61.5 N on the rack teeth, which print standing (they bend across layers); judged with the pinion's smaller form factor, conservative"}
  - {id: power, check: power_budget, why: "adapter, jack and every wire within rating with the grip servo stalled; the grip servo gets >= its 4.8 V minimum through the 1 m adapter cord and its lead"}
  - {id: plug_access, check: connector_access, item: jack, direction: [1, 0, 0], length_mm: 30,
     why: "the adapter plug (11 mm barrel) and fingers reach the jack"}
  - {id: usb_access, check: connector_access, item: nano, direction: [1, 0, 0], length_mm: 30,
     why: "the USB cable reaches the Nano to load the bring-up sketch"}
  - id: stand_fea
    check: fea_static
    part: stand
    why: "the wrist servo stalls (922 N*mm, the gripper jammed on the bench) through its four tab screws while the stand carries 2x the gripper + payload weight (~190 g + 150 g = 3.3 N, x2 = 6.7 N, half on the servo tabs, half on the pivot); the whole base underside is held: it rests on the bench and is screwed down through the two M4 holes in the bars (or clamped) before power, as DESIGN.md says; the legs print standing (bending across layers)"
    direction: z
    case: crash
    sf: 3.0
    max_disp_mm: 1.0
    fixed: {box: [[-200, -100, -0.1], [0, 100, 0.6]]}
    loads:
      - {sites: wr_servo, radius: 4.0, torque_nmm: "mg_stall_nmm", axis: {at: [0, 0, "stand_h"], dir: [0, -1, 0]}}
      - {sites: wr_servo, radius: 4.0, force_n: [0, 0, -3.35]}
      - {cylinder: {at: [0, "-w_f", "stand_h"], dir: [0, 1, 0], r: 1.8, tol: 0.4, span: [0, "plate_t"]}, bearing_n: [0, 0, -3.35]}
  - id: gripper_stall_fea
    check: fea_static
    part: gripper
    why: "the grip servo at stall with one jaw blocked: its 922 N*mm case reaction goes from the four tab screws through the bulkhead and wings to the cheeks, where the guide rods hand it back from the jaws (closed internal load loop)"
    direction: z
    sf: 3.0
    max_disp_mm: 0.3
    fixed:
      any:
        - {cylinder: {at: ["x_rod", "rod_y", "z_c + z_stop"], dir: [0, 0, 1], r: 2.0, tol: 0.4, span: [0, "cheek_t"]}}
        - {cylinder: {at: ["x_rod", "-rod_y", "z_c + z_stop"], dir: [0, 0, 1], r: 2.0, tol: 0.4, span: [0, "cheek_t"]}}
        - {cylinder: {at: ["x_rod", "rod_y", "z_c - z_stop"], dir: [0, 0, -1], r: 2.0, tol: 0.4, span: [0, "cheek_t"]}}
        - {cylinder: {at: ["x_rod", "-rod_y", "z_c - z_stop"], dir: [0, 0, -1], r: 2.0, tol: 0.4, span: [0, "cheek_t"]}}
    loads:
      - {sites: gr_servo, radius: 4.0, torque_nmm: "mg_stall_nmm", axis: {at: ["x_bulk", 0, "z_c"], dir: [1, 0, 0]}}
  - id: gripper_wrist_fea
    check: fea_static
    part: gripper
    why: "fault case: the arm drives the closed gripper into the desk and the wrist servo stalls (922 N*mm) against the head: the fork plates carry the whole wrist torque from the horn screws and the pivot to the cheeks"
    direction: z
    case: crash
    sf: 3.0
    max_disp_mm: 1.0
    fixed:
      any:
        - {cylinder: {at: ["x_rod", "rod_y", "z_c + z_stop"], dir: [0, 0, 1], r: 2.0, tol: 0.4, span: [0, "cheek_t"]}}
        - {cylinder: {at: ["x_rod", "-rod_y", "z_c + z_stop"], dir: [0, 0, 1], r: 2.0, tol: 0.4, span: [0, "cheek_t"]}}
        - {cylinder: {at: ["x_rod", "rod_y", "z_c - z_stop"], dir: [0, 0, -1], r: 2.0, tol: 0.4, span: [0, "cheek_t"]}}
        - {cylinder: {at: ["x_rod", "-rod_y", "z_c - z_stop"], dir: [0, 0, -1], r: 2.0, tol: 0.4, span: [0, "cheek_t"]}}
    loads:
      - {sites: wr_horn, radius: 4.0, torque_nmm: "mg_stall_nmm", axis: {at: [0, 0, 0], dir: [0, 0, 1]}}
  - id: jaw_fea
    check: fea_static
    part: jaw_r
    why: "one jaw blocked alone with the grip servo at stall: the whole 922 N*mm on its rack = 61.5 N at the pad, held by the rack teeth at the far mesh point (fully open) and the two rod bores"
    direction: xy
    sf: 2.0
    max_disp_mm: 0.5
    fixed:
      any:
        - {cylinder: {at: ["carr_x / 2", "rod_y", 0], dir: [0, 0, 1], r: 2.2, tol: 0.4, span: [0, "carr_len"]}}
        - {cylinder: {at: ["carr_x / 2", "-rod_y", 0], dir: [0, 0, 1], r: 2.2, tol: 0.4, span: [0, "carr_len"]}}
        - {box: [["-(gear_b + slab_gap) - 0.1", "r_p - gear_m - 0.1", "-z_in - s_max - 3"], ["-slab_gap + 0.1", "r_p + 1.2 * gear_m + 0.1", "-z_in - s_max + 3"]]}
    loads:
      - {near_joint: pad, radius: 6.0, force_n: [0, 0, 61.5]}
  - id: finger_root
    check: cantilever_stress
    part: jaw_r
    section: {name: finger root, at: ["carr_x + 0.5", 0, 4], normal: [1, 0, 0]}
    loads: [{at: pad, force_n: [0, 0, 61.5]}]
    load_case: one jaw blocked alone at grip-servo stall
    sf: 2.0
    kt: 1.0
    direction: auto
  - id: pinion_fea
    check: fea_static
    part: pinion
    why: "stall torque from the four horn screws into the teeth (tooth-root bending is gear_bending; this proves the gear body and the counterbored screw seats)"
    direction: xy
    sf: 3.0
    max_disp_mm: 0.1
    fixed: {sites: gr_horn, radius: 3.0}
    loads:
      - {cylinder: {at: [0, 0, 0], dir: [0, 0, 1], r: "r_p + gear_m", tol: 0.6, span: [0, "gear_b"]}, torque_nmm: "mg_stall_nmm", axis: {at: [0, 0, 0], dir: [0, 0, 1]}}
