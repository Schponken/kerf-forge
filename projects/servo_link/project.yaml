name: Servo test rig
description: >
  An MG996R servo on a printed bracket swings a 100 mm arm through ±90° under gravity. The seed project:
  it exercises catalog-backed mounts on both sides, the joint tree, the motion sweep, fastener alignment,
  the static-torque check and every export.
printer: Bambu Lab A2L
supports: allowed
params:
  arm_len: {value: 100, min: 60, max: 140, step: 1, label: Arm length (pivot to tip)}
  arm_w: {value: 18, min: 14, max: 24, step: 0.5, label: Arm width}   # 18 mm keeps stall-load tip deflection under 1 mm
  arm_t: {value: 6, min: 5, max: 9, step: 0.5, label: Arm thickness}
  pivot_h: {value: 75, min: 60, max: 120, step: 1, label: Pivot height above the base top}
  wall_t: {value: 8, min: 8, max: 12, step: 0.5, label: Bracket wall thickness}
  base_t: {value: 8, min: 8, max: 12, step: 0.5, label: Base plate thickness}
  foot_d: {value: 38, min: 30, max: 50, step: 1, label: Bracket foot depth}
  foot_t: {value: 6, min: 5, max: 10, step: 0.5, label: Bracket foot thickness}
  gusset_t: {value: 5, min: 4, max: 8, step: 0.5, label: Gusset thickness}
layout: parts/layout.py     # shared geometry both base and bracket use (screw positions, seat heights)
parts:
  base: {file: parts/base.py, material: PETG, print_rot: [0, 0, 0], infill: 0.3}
  bracket: {file: parts/bracket.py, material: PETG, print_rot: [90, 0, 0], infill: 0.4, load_axis: Z}
  arm: {file: parts/arm.py, material: PETG, print_rot: [0, 0, 0], infill: 0.3,
        assembly_note: "the horn disc is only 2 mm thick: snug the 4 screws (about 0.5 N m) with medium threadlocker, do not torque them down"}
purchased:
  servo: {catalog: servos.MG996R, proxy: servo, groups: {tabs: bracket_servo}, tab_screws_from: bottom, tab_washers: true,
          assembly_note: "pull out its 4 rubber grommets first (the screws are sized for bare tabs); push it in top-first from BEHIND the wall",
          range: [-90, 90], insert: {direction: [0, 0, 1], distance: 25}}   # top-first through the wall window, from behind
  horn: {catalog: servo_horns.aluminum_25T, proxy: horn, groups: {holes: horn_arm},
         assembly_note: "centre the servo first: wire it up (WIRING.md), run servo.write(90) (1500 us), then press the horn on so the arm will point straight up; fit its centre screw"}
  # electrics (off the rig, on the desk): 5 V mains adapter -> barrel-jack terminal adapter -> servo power; an Arduino
  # Nano on USB makes the 500-2500 us pulses for the full +/-90 deg swing (DESIGN.md 'Electrics')
  psu: {catalog: electronics.supplies.meanwell_gst60a05, proxy: box}
  jack: {catalog: electronics.connectors.dc_jack_5521_screw, proxy: box}
  nano: {catalog: boards.arduino_nano, proxy: board}
bom_extra:
  - {type: fastener, item: M3 flat washer (DIN 125), qty: 4, group: bracket_servo, spec: "under the servo tab screw heads (the tab holes are 4.5 mm keyhole slots); counted in the screw grip"}
  - {type: hardware, item: 50 g calibration weight or fishing sinker on a wire loop or S-hook, qty: 1, spec: "hangs from the arm tip hole"}
  - {type: hardware, item: 2.5 mm cable tie, qty: 1, spec: "servo lead strain relief"}
  - {type: electrical, item: "IEC C13 mains cord (country plug)", qty: 1, price_key: "mains_cord:C13", spec: "the MEAN WELL adapter ships without one (element14: mains lead sold separately)"}
  - {type: electrical, item: USB Mini-B cable, qty: 1, price_key: "cable:usb_mini_b", spec: "programs and powers the Arduino Nano A000005 (Mini-B, PiShop page)"}
  - {type: electrical, item: "2.54 mm male pin header (pins, break 3 off a strip)", qty: 3, price_key: "header:2.54x40", spec: "servo plug pushes onto it; solder servo_pwr red/black and servo_sig orange to its pins, heat-shrink each"}
  - {type: tool, item: 2.5 mm ball-end hex driver, qty: 1, spec: "the two servo tab screws next to the cable boss (a straight key grazes the boss)"}
assembly:
  root: base
  order: [base, bracket, servo, [psu, jack, nano], horn, arm]   # servo in from behind; wire it up so it can be centred before the horn goes on
  joints:
    - {parent: base.bracket_seat, child: bracket.origin}
    - {parent: bracket.servo_seat, child: servo.tabs}
    - {parent: servo.output, child: horn.spline, name: swing, range: [-90, 90], home: 0}
    - {parent: horn.face, child: arm.horn_mount}
    - {parent: base.desk_psu, child: psu.bottom}
    - {parent: base.desk_jack, child: jack.bottom}
    - {parent: base.desk_nano, child: nano.bottom}
  sweeps:
    - {joint: swing, samples: 13}
electrical:
  supply: psu                # mains adapter: rated by its 6 A, no run time
  burst_s: 5                 # a stalled swing (servo at 2.5 A) held for 5 s, for wire heating
wiring:      # ends = item centres; cut lengths = routed + 15 %, rounded up. World mm, base frame (desk at z 0).
  - {id: psu_cord, from: psu, to: jack, v: 5.0, gauge: 22, color: black/white, length_mm: 1000, supplied: psu,
     route: [[62.5, -109.3, 15], [111.7, -63, 6]],
     note: "the adapter's own 1 m DC cord (Jameco: 3.28 ft) with its 5.5 x 2.1 plug; MEAN WELL does not publish its gauge here, so it is checked as 22 AWG: the thinnest gauge whose chassis ampacity (7 A, catalog wire.awg) covers the 6 A the adapter is rated to deliver through it"}
  - {id: servo_pwr, from: jack, to: servo, v: 5.0, gauge: 22, color: red/black, length_mm: 250, ends: {to: header},
     route: [[76.3, -63, 6], [70, -63, 13], [40, -30, 12], [5, -24, 66], [31, -46, 80]],
     note: "jack screw terminals (+ / -) to the 3-pin male header's middle (red) and outer (brown) pins; the servo's own plug pushes onto the header; tie the lead through the wall's cable-tie slots"}
  - {id: servo_sig, from: nano, to: servo, kind: signal, gauge: 26, color: orange, length_mm: 240, ends: {to: header},
     route: [[78, -13, 3], [70, -13, 13], [40, -30, 12], [5, -24, 66], [31, -46, 80]],
     note: "Nano D9 to the header's signal pin (servo orange); Nano powered from USB"}
  - {id: gnd_common, from: nano, to: jack, kind: signal, gauge: 26, color: black, length_mm: 110,
     route: [[78, -13, 3], [76.3, -63, 6]],
     note: "Nano GND into the jack's minus screw terminal (common ground), next to the servo_pwr black wire"}
requirements:
  - {id: arm_torque, check: static_torque, joint: swing, actuator: servo, payload_g: 50, payload_at: arm.tip, max_fraction: 0.5,
     why: "the servo must hold the arm and a 50 g weight anywhere in its range using at most half its stall torque"}
  - id: bracket_fea
    check: fea_static
    part: bracket
    why: "the wall must take the servo's full stall-torque reaction (a couple through the four tab screws) without yielding"
    direction: z            # judge against layer-direction strength (conservative; the wall prints on its back)
    sf: 3.0                 # docs/ENGINEERING.md: static load across layers
    max_disp_mm: 0.3
    fixed: {box: [[-200, -1, -1], [200, 200, 0.01]]}          # foot underside, clamped to the base
    loads:                                                    # stall torque about the output axis = +/- Z couple at the tab screws
      - {box: [[servo_hx / 2 - 3, wall_t - 8, pivot_h - 8], [servo_hx / 2 + 3, wall_t + 0.01, pivot_h + 8]], force_n: [0, 0, "servo_stall_nmm / servo_hx"]}
      - {box: [[-servo_hx / 2 - 3, wall_t - 8, pivot_h - 8], [-servo_hx / 2 + 3, wall_t + 0.01, pivot_h + 8]], force_n: [0, 0, "-servo_stall_nmm / servo_hx"]}
  - id: arm_fea
    check: fea_static
    part: arm
    why: "the arm must survive the servo driving it into an obstacle at stall torque (9.2 N at the tip), in-plane = along layers"
    direction: xy
    sf: 2.0
    max_disp_mm: 1.0        # 1% of the 100 mm arm length
    fixed: {sites: horn_arm, radius: 3.0}
    loads: [{near_joint: tip, radius: 4.0, force_n: ["servo_stall_nmm / arm_len", 0, 0]}]
  - {id: rig_mass, check: mass_max, max_g: 250, include: [base, bracket, servo, horn, arm],
     why: "bench rig; keep it light enough to move around (the adapter, jack and Nano sit on the desk beside it)"}
  - {id: power, check: power_budget, why: "adapter, jack and every wire within rating with the servo stalled"}
  - {id: plug_access, check: connector_access, item: jack, direction: [1, 0, 0], length_mm: 30,
     why: "the adapter plug (11 mm barrel) and fingers reach the jack"}
  - {id: usb_access, check: connector_access, item: nano, direction: [1, 0, 0], length_mm: 30,
     why: "the USB cable reaches the Nano to load the sweep sketch"}
