    - {joint: fold_r, samples: 14}
    - {joint: fold_l, samples: 14}
    - {joint: sweep_srv_r, follows: fold_r, ratio: 1.6154}
    - {joint: sweep_srv_l, follows: fold_l, ratio: -1.6154}
    - {joint: ail_r, samples: 7}
    - {joint: ail_l, samples: 7}
    - {joint: elevator, samples: 7}
    - {joint: rudder, samples: 7}
requirements:
- id: sm_spread
  check: static_margin_tail
  min: 0.08
  max: 0.2
  halves: {right: hub_r, left: hub_l}
  root_y: pivot_y
  why: 'wings spread (launch, cruise, landing): stable but not nose-heavy, 8-20 % MAC between the CG and the wing + tail neutral point; the glove (|y| < pivot_y) never moves (DESIGN.md)'
- id: sm_half
  check: static_margin_tail
  min: 0.05
  max: 0.82
  halves: {right: hub_r, left: hub_l}
  root_y: pivot_y
  pose: {fold_r: 32.5, fold_l: 32.5}
  why: 'half swept (fast passes, 80-110 km/h): stable (>= 5 % MAC); upper bound = the most margin full up elevator can trim at 70 km/h, the slowest it is flown half swept: eta_t 0.9 x V_h 0.47 x a_t 3.23 x tau 0.55 x 22 deg / CL 0.35 = 0.82 (DESIGN.md "Trim limits")'
- id: sm_folded
  check: static_margin_tail
  min: 0.05
  max: 1.36
  halves: {right: hub_r, left: hub_l}
  root_y: pivot_y
  pose: {fold_r: 65, fold_l: 65}
  why: 'folded for the dive: stable (>= 5 % MAC); upper bound = the most margin full up elevator can trim at 90 km/h, the slowest it is flown folded: 0.289 / CL 0.21 = 1.36 (DESIGN.md "Trim limits")'
- id: sm_asym
  check: static_margin_tail
  min: 0.05
  max: 0.82
  halves: {right: hub_r, left: hub_l}
  root_y: pivot_y
  pose: {fold_r: 65, fold_l: 0}
  why: 'one side folded, the other spread (the most uneven roll input): stable in pitch (>= 5 % MAC), trimmable as sm_half (DESIGN.md)'
- id: wing_loading
  check: wing_loading
  max_g_dm2: 95
  why: 'the 1.0 m span the brief asks for, with PETG, a 6S pack, FPV gear and two pivot drives: a sport-FPV loading, capped at the class of flown swing-wing models (XFly F-14 115 g/dm2, REFERENCES.md); floating in gentle thermals would need ~55-65 g/dm2 (DESIGN.md "Assumptions")'
- id: stall_speed
  check: stall_speed
  max_kmh: 45
  re: 200000
  why: 'spread-wing belly-landing speed on grass after a hand / bungee launch: <= 45 km/h (fpv_wing and drone_foldable_wings limit; Darkwing-1 50 km/h); MH 45 at Re 200 000'
- id: spar_bending
  check: spar_bending
  tubes: [rods.cf_tube_8x6, rods.cf_tube_6x4]
  y_root: 195
  load_factor: 6
  sf: 1.5
  why: 6 g pull-out on an elliptical lift distribution where the tubes leave the hub (y 195 = hub_y1); SF 1.5 on the low tensile strength figure
- id: fold_pull_r
  check: fold_hinge_moment
  joint: fold_r
  item: hub_r
  side: right
  speed_kmh: 84
  cd: -0.08
  actuator: sweep_servo_r
  ratio: 1.6154
  max_fraction: 0.5
  root_y: pivot_y
  extra_nmm: 20
  why: '4 g pull at the manoeuvring speed (84 km/h = stall 42 x sqrt 4) at CL ~1.0, alpha ~11 deg: net chordwise force cd cos a - cl sin a = 0.11 x 0.98 - 1.0 x 0.19 = -0.08 (forward; cd 0.03 profile + 0.08 induced, A 5); 20 N mm ball-bearing and gear-mesh friction (DESIGN.md); MG996R stall x 21/13 x 50 %'
- id: fold_pull_l
  check: fold_hinge_moment
  joint: fold_l
  item: hub_l
  side: left
  speed_kmh: 84
  cd: -0.08
  actuator: sweep_servo_l
  ratio: 1.6154
  max_fraction: 0.5
  root_y: pivot_y
  extra_nmm: 20
  why: mirror of fold_pull_r
- id: fold_dive_r
  check: fold_hinge_moment
  joint: fold_r
  item: hub_r
  side: right
  speed_kmh: 150
  cd: 0.015
  cl: 0.05
  actuator: sweep_servo_r
  ratio: 1.6154
  max_fraction: 0.5
  root_y: pivot_y
  extra_nmm: 20
  why: 'opening the folded wing in a 150 km/h dive (about the prop''s pitch speed on 6S, DESIGN.md): CL 0.05, cd 0.015 (aft, resists opening) + 20 N mm friction; the 50 % fraction is 2x the 1.5x-drag rule LisEagle sized its fold actuator by (REFERENCES.md)'
- id: fold_dive_l
  check: fold_hinge_moment
  joint: fold_l
  item: hub_l
  side: left
  speed_kmh: 150
  cd: 0.015
  cl: 0.05
  actuator: sweep_servo_l
  ratio: 1.6154
  max_fraction: 0.5
  root_y: pivot_y
  extra_nmm: 20
  why: mirror of fold_dive_r
- id: sweep_gears
  check: gear_bending
  module: 2
  z_driver: 13
  z_driven: 21
  width: 10
  torque_nmm: 921.8
  material: PETG
  sf: 3.0
  why: Lewis bending at the MG996R's stall (9.4 kg cm = 921.8 N mm) on the PETG pinion's 10 mm engaged width, SF 3 (a stalled servo drives the teeth repeatedly)
- id: stop_spread_r
  check: hard_stop
  joint: fold_r
  beyond: -3
  why: 'spread is a real stop (the forward pull at high lift and the failsafe both drive the panel onto it): 3 deg past 0 the hub''s sector hits the pod''s stop post'
- id: stop_spread_l
  check: hard_stop
  joint: fold_l
  beyond: -3
  why: mirror of stop_spread_r
- id: stop_fold_r
  check: hard_stop
  joint: fold_r
  beyond: 68
  why: 'the folded end is a real stop: 3 deg past 65 the sector hits the pod''s other stop post'
- id: stop_fold_l
  check: hard_stop
  joint: fold_l
  beyond: 68
  why: mirror of stop_fold_r
- id: fold_tail_clear_r
  check: clearance_min
  a: wing_r2
  b: hstab
  min_mm: 15
  joints: [fold_r]
  samples: 14
  why: the folded right panel passes the tail with >= 15 mm (flex, gusts)
- id: fold_tail_clear_l
  check: clearance_min
  a: wing_l2
  b: hstab
  min_mm: 15
  joints: [fold_l]
  samples: 14
  why: mirror
- id: view_clear_r
  check: clearance_min
  a: wing_r2
  b: camera_view
  min_mm: 10
  joints: [fold_r]
  samples: 8
  why: 'the brief''s promise: folded panels never enter the FPV view (the view cone is the camera''s useful 120 x 40 deg forward field, DESIGN.md)'
- id: view_clear_l
  check: clearance_min
  a: wing_l2
  b: camera_view
  min_mm: 10
  joints: [fold_l]
  samples: 8
  why: mirror
- id: twr
  check: thrust_to_weight
  motors: [motor]
  min_ratio: 0.8
  why: 'hand launch with a confident climb: T/W >= 1/(L/D) 0.125 + climb gradient 0.3 (4.5 m/s at 15 m/s) = 0.43, x ~1.35 for a 7 in FPV prop''s static-to-flight thrust drop = 0.58, rounded up to 0.8 for a hand launch without the bungee'
- id: flight_time
  check: flight_time
  min_min: 20
  why: '12+ min of MIXED flying (the brief): level cruise at 55 km/h must last >= 20 min on 80 % of the pack; the mix 40 % cruise, 25 % half swept at 2x cruise power, 15 % climbs at ~4x, 20 % dives at idle averages ~1.65x cruise power, so 20 min of cruise = ~12 min mixed (DESIGN.md "Flight time")'
- id: power
  check: power_budget
  why: pack C rating, FC current sensor, ESC, both BECs, XT60 and every wire inside their ratings in cruise and at full throttle
- id: prop_clear
  check: prop_clearance
  min_mm: 5
  joints: [fold_r, fold_l]
  why: the 7 in prop clears every part by 5 mm at every sweep angle
- id: auw
  check: mass_max
  max_g: 1800
  why: 'all-up mass <= 1800 g: keeps the spread loading under 95 g/dm2 and the stall under 45 km/h on the 20 dm2 wing (DESIGN.md mass budget)'
- id: case_fit
  check: size_max
  max_mm: [500, 330, 220]
  include: [fuselage, nose, motor_mount, motor, hatch, glove, pod_r, pod_l, cap_r, cap_l, sweep_servo_r, sweep_servo_l, sweep_horn_r, sweep_horn_l, pinion_r, pinion_l, pin_r, pin_l, battery, pad, strap, xt60, esc, fc, receiver, vtx, gps, camera, boom_clamp]
  why: 'wings, tail and boom off, prop and VTX antenna unscrewed: the body (fuselage, glove, nacelles, nose, motor) fits a backpack case of about 500 x 330 x 220 mm inside (the panels, boom + tail go beside it)'
- id: xt60_plug
  check: connector_access
  item: xt60
  direction: [0, 0, 1]
  length_mm: 25
  why: with the hatch off, the pack's XT60 plugs in from above, ahead of the pack
