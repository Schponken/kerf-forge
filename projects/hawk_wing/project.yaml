name: Hawk-wing swing-wing FPV plane
description: >-
  A 1.0 m printed FPV plane whose outer wing panels sweep back in flight like a hawk's: spread for slow, efficient
  cruise and soft landings, half swept for speed, folded 65 deg for a straight, stable dive, one side more than the
  other for extra roll. The inner wing is a fixed glove (F-14 style outboard pivot), so sweeping moves the lift far
  less than a root pivot. Each panel turns on a 5 mm steel pin in two ball bearings, driven by an MG996R through a
  13/21 T gear in a nacelle under the glove; it comes off with two M3 screws and one servo plug. Tractor 2806.5 on
  6S, conventional tail on an unpluggable carbon boom, F405-WMO (INAV) with GPS, nose FPV camera.
printer: Bambu Lab A2L
layout: parts/layout.py
style: {radii: [1.0, 2.0, 3.0], edge_break: 0.6}
use_story:
  who: 'Spencer, flying it FPV himself: hand or bungee launch, slow cruise and thermal passes spread, fast passes half swept, dives folded with a pull-out, belly landing on grass'
  where:
  - outdoor
  - field
  how_often: weekend sessions, 3-5 flights of ~12 min
  goes_wrong:
  - hazard: heat
    max_c: 45
    why: 'summer sun at the field and a car ride there (PETG HDT ~70 C; not left on a dashboard)'
  - hazard: crash
    speed_m_s: 15
    survive: false
    consequence: 'a nose-in or cartwheel at pull-out speed: the prop, the nose cap (camera fairing), the wingtip skids and the tail surfaces are the cheap parts that break first; reprint them (the pivots, gears and glove sit aft of the nose and inside the wing, out of the first impact)'
  - hazard: other
    what: hand / bungee launch with the wings spread and a belly landing on grass
    covered_by:
    - stall_speed
    - twr
    - wing_loading
  - hazard: other
    what: 'wings swept in a fast dive must still open under air load, and stay where the servos put them in a pull-out; on signal loss they go to spread'
    covered_by:
    - fold_pull_r
    - fold_pull_l
    - fold_dive_r
    - fold_dive_l
    - sweep_gears
    - stop_spread_r
    - stop_spread_l
  - hazard: other
    what: 'forgiving and predictable in every shape: pitch-stable spread, half swept, folded and swept unevenly, every one trimmable with the elevator'
    covered_by:
    - sm_spread
    - sm_half
    - sm_folded
    - sm_asym
  - hazard: other
    what: wings and tail off for a backpack case (about 500 x 330 x 220 mm inside)
    covered_by:
    - case_fit
  field_repair:
  - cap_r
  - cap_l
  - boom_clamp
  - nose
  carry_by: the fuselage under the glove, wings off or folded
electrical:
  battery: battery
  burst_s: 10
  cruise:
    speed_kmh: 55
    l_over_d: 8
    eta: 0.45
    why: 'spread-wing cruise at 55 km/h; L/D 8 (A 5 wing, pod fuselage, boom, tail, two pivot nacelles) and eta 0.45 (a 7 in 3-blade FPV prop is inefficient at 55 km/h), the sibling drone_foldable_wings values: DESIGN.md'
  draw:
    fc:
      avg_a: 0.25
      peak_a: 0.3
      why: Matek publishes no own draw for the F405-WMO; an F405 + gyro + OSD board draws ~0.15-0.25 A at 5 V (same bound as fpv_wing, UNVERIFIED)
