  pinion_l: {file: parts/pinion.py, material: PETG, print_rot: [0, 0, 0], infill: 1.0, walls: 4, load_axis: [X, Y]}
  wing_r1: {file: parts/wing.py, material: PETG, print_rot: [90, 0, 0], infill: 0.03, walls: 1, airfoil: mh45}
  wing_l1: {file: parts/wing.py, material: PETG, print_rot: [-90, 0, 0], infill: 0.03, walls: 1, airfoil: mh45}
  wing_r2: {file: parts/wing.py, material: PETG, print_rot: [90, 0, 0], infill: 0.03, walls: 1, airfoil: mh45, supports: needed}
